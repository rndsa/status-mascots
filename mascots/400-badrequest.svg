<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <style>
      @keyframes headTilt {
        0%, 100% { transform: rotate(0deg); }
        50% { transform: rotate(14deg); }
      }
      @keyframes questionBounce {
        0%, 100% { transform: translateY(0); opacity: 0.7; }
        50% { transform: translateY(-4px); opacity: 1; }
      }
      .bot-tilt { animation: headTilt 2.2s ease-in-out infinite; transform-origin: 60px 80px; }
      .q-mark { animation: questionBounce 1.5s ease-in-out infinite; transform-origin: center; }
    </style>
  </defs>
  <!-- Question Mark -->
  <g class="q-mark">
    <text x="82" y="24" font-family="-apple-system, sans-serif" font-size="22" font-weight="900" fill="#ffd043">?</text>
  </g>
  <g class="bot-tilt">
    <!-- Antenna -->
    <line x1="60" y1="32" x2="60" y2="14" stroke="#3a3f50" stroke-width="4" stroke-linecap="round"/>
    <circle cx="60" cy="12" r="5" fill="#ffd043"/>
    <!-- Ears -->
    <rect x="18" y="44" width="8" height="32" rx="4" fill="#222634"/>
    <rect x="94" y="44" width="8" height="32" rx="4" fill="#222634"/>
    <!-- Helmet -->
    <rect x="24" y="28" width="72" height="66" rx="24" fill="#ffffff" stroke="#e1e4ea" stroke-width="2"/>
    <!-- Visor -->
    <rect x="30" y="36" width="60" height="42" rx="14" fill="#10131a"/>
    <!-- Asymmetric Puzzled Eyes (o .) -->
    <circle cx="44" cy="56" r="6" fill="#ffd043"/>
    <circle cx="74" cy="56" r="3.5" fill="#ffd043"/>
    <line x1="56" y1="66" x2="64" y2="66" stroke="#ffd043" stroke-width="2.5" stroke-linecap="round"/>
  </g>
</svg>