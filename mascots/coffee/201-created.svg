<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <linearGradient id="mug-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fed7aa"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
    <filter id="mug-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#c2410c" flood-opacity="0.25"/>
    </filter>
  </defs>
  <style>
    @keyframes happyJump {
      0%, 100% { transform: translateY(0) scale(1, 1); }
      30% { transform: translateY(6px) scale(1.08, 0.92); }
      55% { transform: translateY(-16px) scale(0.94, 1.06); }
      75% { transform: translateY(-2px) scale(1.02, 0.98); }
    }
    .head-jump { animation: happyJump 1.8s cubic-bezier(0.28, 0.84, 0.42, 1) infinite; transform-origin: 80px 145px; }
  </style>

  <ellipse cx="76" cy="148" rx="34" ry="6" fill="#000000" opacity="0.18"/>

  <g class="head-jump">
    <!-- Party Hat -->
    <polygon points="75,16 62,42 88,42" fill="#ec4899"/>
    <circle cx="75" cy="14" r="4.5" fill="#facc15"/>

    <path d="M 118 64 C 142 64 142 98 118 98" fill="none" stroke="#ea580c" stroke-width="8" stroke-linecap="round"/>
    <path d="M 118 64 C 142 64 142 98 118 98" fill="none" stroke="#fed7aa" stroke-width="4" stroke-linecap="round"/>

    <rect x="28" y="44" width="94" height="84" rx="28" fill="url(#mug-grad)" stroke="#ea580c" stroke-width="2.5" filter="url(#mug-glow)"/>

    <!-- Joyful Closed Eyes (^ ^) -->
    <path d="M 50 84 Q 60 72 70 84" fill="none" stroke="#431407" stroke-width="4.5" stroke-linecap="round"/>
    <path d="M 84 84 Q 94 72 104 84" fill="none" stroke="#431407" stroke-width="4.5" stroke-linecap="round"/>

    <path d="M 70 94 Q 76 104 82 94 Z" fill="#f43f5e"/>

    <ellipse cx="46" cy="96" rx="6" ry="3.5" fill="#f43f5e" opacity="0.6"/>
    <ellipse cx="106" cy="96" rx="6" ry="3.5" fill="#f43f5e" opacity="0.6"/>
  </g>
</svg>