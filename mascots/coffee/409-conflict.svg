<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <style>
    @keyframes spillWobble {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(-8deg); }
    }
    .spill { animation: spillWobble 0.8s infinite; transform-origin: 45px 115px; }
  </style>
  <g class="spill">
    <rect x="45" y="60" width="65" height="58" rx="12" fill="#fdba74" stroke="#ef4444" stroke-width="2.5"/>
    <line x1="60" y1="80" x2="70" y2="90" stroke="#ef4444" stroke-width="3"/>
    <line x1="70" y1="80" x2="60" y2="90" stroke="#ef4444" stroke-width="3"/>
    <line x1="80" y1="80" x2="90" y2="90" stroke="#ef4444" stroke-width="3"/>
    <line x1="90" y1="80" x2="80" y2="90" stroke="#ef4444" stroke-width="3"/>
    <!-- Coffee splash -->
    <path d="M 40 55 Q 30 45 42 42 Q 48 50 45 60 Z" fill="#78350f"/>
  </g>
  <text x="80" y="145" font-family="monospace" font-size="11" font-weight="bold" fill="#ef4444" text-anchor="middle">COFFEE SPILL</text>
</svg>