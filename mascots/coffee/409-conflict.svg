<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <style>
    @keyframes mugShake {
      0% { transform: rotate(0deg); }
      20% { transform: rotate(-12deg); }
      40% { transform: rotate(10deg); }
      60% { transform: rotate(-8deg); }
      100% { transform: rotate(0deg); }
    }
    .spilling { animation: mugShake 0.75s ease-in-out infinite; transform-origin: 80px 115px; }
  </style>
  <g class="spilling">
    <!-- Spilling Coffee Droplets -->
    <circle cx="45" cy="50" r="3.5" fill="#78350f"/>
    <circle cx="115" cy="48" r="4" fill="#78350f"/>
    <!-- Mug Body Reddish -->
    <rect x="52" y="55" width="56" height="60" rx="14" fill="#fee2e2" stroke="#ef4444" stroke-width="2.5"/>
    <path d="M 108 65 C 122 65 122 95 108 95" fill="none" stroke="#ef4444" stroke-width="5" stroke-linecap="round"/>
    <!-- Squeezed Panic Face (> <) -->
    <line x1="65" y1="76" x2="75" y2="84" stroke="#ef4444" stroke-width="3" stroke-linecap="round"/>
    <line x1="75" y1="76" x2="65" y2="84" stroke="#ef4444" stroke-width="3" stroke-linecap="round"/>
    <line x1="85" y1="76" x2="95" y2="84" stroke="#ef4444" stroke-width="3" stroke-linecap="round"/>
    <line x1="95" y1="76" x2="85" y2="84" stroke="#ef4444" stroke-width="3" stroke-linecap="round"/>
    <path d="M 76 92 Q 80 87 84 92" fill="none" stroke="#ef4444" stroke-width="2" stroke-linecap="round"/>
    <path d="M 105 45 Q 110 50 105 54 Q 100 50 105 45 Z" fill="#38bdf8"/>
  </g>
</svg>