<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <linearGradient id="mug-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fed7aa"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
  </defs>
  <style>
    @keyframes glitchJitter {
      0%, 100% { transform: translate(0, 0); }
      20% { transform: translate(-3px, 1px); }
      40% { transform: translate(2px, -2px); }
      60% { transform: translate(-2px, -1px); }
      80% { transform: translate(3px, 2px); }
    }
    .head-glitch { animation: glitchJitter 0.25s infinite; }
  </style>

  <ellipse cx="76" cy="148" rx="34" ry="6" fill="#000000" opacity="0.18"/>

  <g class="head-glitch">
    <path d="M 118 64 C 142 64 142 98 118 98" fill="none" stroke="#c084fc" stroke-width="8" stroke-linecap="round"/>

    <rect x="28" y="44" width="94" height="84" rx="28" fill="url(#mug-grad)" stroke="#c084fc" stroke-width="2.5"/>

    <!-- Glitched pixel eyes -->
    <rect x="48" y="80" width="16" height="5" fill="#c084fc"/>
    <rect x="52" y="75" width="8" height="15" fill="#c084fc"/>
    <rect x="88" y="80" width="16" height="5" fill="#38bdf8"/>
    <rect x="92" y="85" width="8" height="10" fill="#38bdf8"/>

    <rect x="70" y="96" width="12" height="4" fill="#c084fc"/>
  </g>
  <text x="76" y="146" font-family="monospace" font-size="10" font-weight="bold" fill="#c084fc" text-anchor="middle">PARSER GLITCH (422)</text>
</svg>