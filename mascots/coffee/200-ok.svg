<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <linearGradient id="cup-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fdba74"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
  </defs>
  <style>
    @keyframes steamRise {
      0% { transform: translateY(0) scaleX(1); opacity: 0.8; }
      50% { transform: translateY(-8px) scaleX(1.15); opacity: 0.5; }
      100% { transform: translateY(-16px) scaleX(0.85); opacity: 0; }
    }
    .steam-1 { animation: steamRise 2s infinite ease-out; }
    .steam-2 { animation: steamRise 2s infinite 0.7s ease-out; }
  </style>

  <!-- Steaming Aroma -->
  <path d="M 68 50 Q 64 38 70 28" fill="none" stroke="#d97706" stroke-width="2.5" stroke-linecap="round" class="steam-1"/>
  <path d="M 88 50 Q 92 38 86 28" fill="none" stroke="#d97706" stroke-width="2.5" stroke-linecap="round" class="steam-2"/>

  <!-- Mug Handle -->
  <path d="M 105 75 C 125 75 125 105 105 105" fill="none" stroke="#c2410c" stroke-width="8" stroke-linecap="round"/>

  <!-- Ceramic Mug Body -->
  <rect x="45" y="60" width="65" height="58" rx="12" fill="url(#cup-grad)" stroke="#c2410c" stroke-width="2"/>
  <!-- Smiling Face -->
  <circle cx="65" cy="85" r="4.5" fill="#431407"/>
  <circle cx="85" cy="85" r="4.5" fill="#431407"/>
  <path d="M 70 94 Q 75 99 80 94" fill="none" stroke="#431407" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Blushing Cheeks -->
  <circle cx="56" cy="90" r="3.5" fill="#f43f5e" opacity="0.6"/>
  <circle cx="94" cy="90" r="3.5" fill="#f43f5e" opacity="0.6"/>
  <!-- Saucer Plate -->
  <ellipse cx="78" cy="122" rx="46" ry="6" fill="#cbd5e1" stroke="#94a3b8" stroke-width="2"/>
</svg>