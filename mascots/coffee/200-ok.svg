<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <linearGradient id="mug-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fed7aa"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
    <filter id="mug-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#c2410c" flood-opacity="0.25"/>
    </filter>
  </defs>
  <style>
    @keyframes mugBob {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-7px) rotate(1.5deg); }
    }
    @keyframes steamRise {
      0% { transform: translateY(0) scale(0.8); opacity: 0; }
      50% { opacity: 0.8; }
      100% { transform: translateY(-16px) scale(1.2); opacity: 0; }
    }
    @keyframes eyeBlink {
      0%, 92%, 100% { transform: scaleY(1); }
      96% { transform: scaleY(0.1); }
    }
    .head-mug { animation: mugBob 3s ease-in-out infinite; transform-origin: 80px 145px; }
    .steam-puff-1 { animation: steamRise 2s infinite ease-out; }
    .steam-puff-2 { animation: steamRise 2s infinite 0.5s ease-out; }
    .blink-eye { animation: eyeBlink 3.6s infinite; transform-origin: 58px 86px; }
  </style>

  <ellipse cx="76" cy="148" rx="34" ry="6" fill="#000000" opacity="0.18"/>

  <!-- Aromatic Steam Rising -->
  <path d="M 64 34 Q 60 22 68 14" fill="none" stroke="#fdba74" stroke-width="2.5" stroke-linecap="round" class="steam-puff-1"/>
  <path d="M 84 34 Q 88 22 80 14" fill="none" stroke="#fdba74" stroke-width="2.5" stroke-linecap="round" class="steam-puff-2"/>

  <g class="head-mug">
    <!-- Ceramic Handle on Right -->
    <path d="M 118 64 C 142 64 142 98 118 98" fill="none" stroke="#ea580c" stroke-width="8" stroke-linecap="round"/>
    <path d="M 118 64 C 142 64 142 98 118 98" fill="none" stroke="#fed7aa" stroke-width="4" stroke-linecap="round"/>

    <!-- Ceramic Mug Cup Body -->
    <rect x="28" y="44" width="94" height="84" rx="28" fill="url(#mug-grad)" stroke="#ea580c" stroke-width="2.5" filter="url(#mug-glow)"/>

    <!-- Rim Coffee Surface / Latte Foam -->
    <ellipse cx="75" cy="46" rx="42" ry="8" fill="#78350f"/>
    <ellipse cx="75" cy="46" rx="36" ry="6" fill="#9a3412"/>
    <!-- Cute heart latte art in foam -->
    <path d="M 75 48 C 73 44 68 44 68 47 C 68 50 75 52 75 52 C 75 52 82 50 82 47 C 82 44 77 44 75 48 Z" fill="#fef3c7" opacity="0.8"/>

    <!-- Left Eye (Big Anime Pupil) -->
    <g class="blink-eye">
      <ellipse cx="58" cy="84" rx="8" ry="11" fill="#431407"/>
      <circle cx="61" cy="80" r="3.5" fill="#ffffff"/>
      <circle cx="56" cy="89" r="1.8" fill="#ffffff"/>
    </g>

    <!-- Right Eye (Cheerful Wink Arc) -->
    <path d="M 84 85 Q 94 72 104 85" fill="none" stroke="#431407" stroke-width="4.5" stroke-linecap="round"/>

    <!-- Cute Smiling Mouth -->
    <path d="M 70 96 Q 76 102 82 96" fill="none" stroke="#431407" stroke-width="3" stroke-linecap="round"/>

    <!-- Pink Cheeks -->
    <ellipse cx="46" cy="96" rx="6" ry="3.5" fill="#f43f5e" opacity="0.6"/>
    <ellipse cx="106" cy="96" rx="6" ry="3.5" fill="#f43f5e" opacity="0.6"/>
  </g>
</svg>