<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <linearGradient id="mug-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fed7aa"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
  </defs>
  <style>
    @keyframes workNod {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-5px); }
    }
    .head-work { animation: workNod 1.8s ease-in-out infinite; }
  </style>

  <ellipse cx="76" cy="148" rx="34" ry="6" fill="#000000" opacity="0.18"/>

  <g class="head-work">
    <path d="M 118 64 C 142 64 142 98 118 98" fill="none" stroke="#ea580c" stroke-width="8" stroke-linecap="round"/>

    <rect x="28" y="44" width="94" height="84" rx="28" fill="url(#mug-grad)" stroke="#ea580c" stroke-width="2.5"/>

    <!-- Worker Headband (Hachimaki) with Red Sun -->
    <path d="M 28 58 Q 75 50 122 58 L 122 66 Q 75 58 28 66 Z" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
    <circle cx="75" cy="61" r="4.5" fill="#ef4444"/>

    <!-- Confident smiling eyes (^ ^) -->
    <path d="M 50 82 Q 60 70 70 82" fill="none" stroke="#431407" stroke-width="4.5" stroke-linecap="round"/>
    <path d="M 84 82 Q 94 70 104 82" fill="none" stroke="#431407" stroke-width="4.5" stroke-linecap="round"/>

    <path d="M 70 96 Q 76 102 82 96" fill="none" stroke="#431407" stroke-width="3" stroke-linecap="round"/>
  </g>
  <text x="76" y="146" font-family="monospace" font-size="10" font-weight="bold" fill="#eab308" text-anchor="middle">MAINTENANCE (503)</text>
</svg>