<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <linearGradient id="mug-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fed7aa"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
  </defs>
  <style>
    @keyframes mugFade {
      0%, 100% { opacity: 0.95; }
      50% { opacity: 0.25; }
    }
    @keyframes lookLR {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-6px); }
      75% { transform: translateX(6px); }
    }
    .head-fade { animation: mugFade 3s ease-in-out infinite; }
    .eyes-roam { animation: lookLR 2.6s ease-in-out infinite; }
  </style>

  <ellipse cx="76" cy="148" rx="34" ry="6" fill="#000000" opacity="0.18"/>

  <g class="head-fade">
    <!-- Detective Hat -->
    <path d="M 40 44 C 40 26 110 26 110 44 Z" fill="#78350f"/>
    <ellipse cx="75" cy="44" rx="42" ry="6" fill="#92400e"/>

    <path d="M 118 64 C 142 64 142 98 118 98" fill="none" stroke="#ea580c" stroke-width="8" stroke-linecap="round"/>

    <rect x="28" y="44" width="94" height="84" rx="28" fill="url(#mug-grad)" stroke="#ea580c" stroke-width="2.5"/>

    <!-- Roaming eyes -->
    <g class="eyes-roam">
      <ellipse cx="58" cy="84" rx="7" ry="9" fill="#431407"/>
      <circle cx="60" cy="81" r="2.5" fill="#ffffff"/>

      <ellipse cx="94" cy="84" rx="7" ry="9" fill="#431407"/>
      <circle cx="96" cy="81" r="2.5" fill="#ffffff"/>
    </g>

    <ellipse cx="76" cy="96" rx="3.5" ry="4.5" fill="#431407"/>
  </g>
  <text x="76" y="146" font-family="monospace" font-size="10" font-weight="bold" fill="#64748b" text-anchor="middle">EMPTY CUP (404)</text>
</svg>