<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <linearGradient id="mug-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fed7aa"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
    <filter id="mug-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#ef4444" flood-opacity="0.3"/>
    </filter>
  </defs>
  <style>
    @keyframes sternMug {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-4px); }
    }
    .head-stern { animation: sternMug 2s ease-in-out infinite; }
  </style>

  <ellipse cx="76" cy="148" rx="34" ry="6" fill="#000000" opacity="0.18"/>

  <g class="head-stern">
    <path d="M 118 64 C 142 64 142 98 118 98" fill="none" stroke="#ef4444" stroke-width="8" stroke-linecap="round"/>

    <rect x="28" y="44" width="94" height="84" rx="28" fill="url(#mug-grad)" stroke="#ef4444" stroke-width="2.5" filter="url(#mug-glow)"/>

    <!-- Stern flat line eyes (- -) -->
    <line x1="48" y1="80" x2="64" y2="80" stroke="#ef4444" stroke-width="4.5" stroke-linecap="round"/>
    <line x1="88" y1="80" x2="104" y2="80" stroke="#ef4444" stroke-width="4.5" stroke-linecap="round"/>

    <line x1="70" y1="96" x2="82" y2="96" stroke="#ef4444" stroke-width="3" stroke-linecap="round"/>
  </g>
  <line x1="24" y1="140" x2="136" y2="140" stroke="#ef4444" stroke-width="2" stroke-dasharray="6 3"/>
</svg>