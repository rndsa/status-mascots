<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <style>
    @keyframes cafeJitter {
      0%, 100% { transform: translate(0, 0); }
      25% { transform: translate(-3px, 2px); }
      75% { transform: translate(3px, -2px); }
    }
    .jitter { animation: cafeJitter 0.15s infinite; }
  </style>
  <g class="jitter">
    <rect x="45" y="60" width="65" height="58" rx="12" fill="#fde047" stroke="#ca8a04" stroke-width="2.5"/>
    <!-- Giant dilated pupils -->
    <circle cx="65" cy="85" r="8" fill="#431407"/>
    <circle cx="85" cy="85" r="8" fill="#431407"/>
    <circle cx="67" cy="83" r="2.5" fill="#ffffff"/>
    <circle cx="87" cy="83" r="2.5" fill="#ffffff"/>
  </g>
  <text x="80" y="145" font-family="monospace" font-size="10" font-weight="bold" fill="#ca8a04" text-anchor="middle">CAFFEINE OVERDOSE</text>
</svg>