<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <linearGradient id="mug-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fed7aa"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
    <filter id="mug-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#ef4444" flood-opacity="0.3"/>
    </filter>
  </defs>
  <style>
    @keyframes mugNoShake {
      0%, 100% { transform: rotate(0deg); }
      20% { transform: rotate(-10deg); }
      40% { transform: rotate(10deg); }
      60% { transform: rotate(-7deg); }
      80% { transform: rotate(7deg); }
    }
    .head-no { animation: mugNoShake 1.4s ease-in-out infinite; transform-origin: 80px 145px; }
  </style>

  <ellipse cx="76" cy="148" rx="34" ry="6" fill="#000000" opacity="0.18"/>

  <g class="head-no">
    <!-- Red padlock -->
    <rect x="68" y="16" width="16" height="13" rx="3" fill="#ef4444"/>
    <path d="M 71 16 L 71 11 C 71 6 81 6 81 11 L 81 16" fill="none" stroke="#ef4444" stroke-width="2.5" stroke-linecap="round"/>

    <path d="M 118 64 C 142 64 142 98 118 98" fill="none" stroke="#ef4444" stroke-width="8" stroke-linecap="round"/>

    <rect x="28" y="44" width="94" height="84" rx="28" fill="url(#mug-grad)" stroke="#ef4444" stroke-width="2.5" filter="url(#mug-glow)"/>

    <!-- Squinting warning eyes -->
    <line x1="48" y1="80" x2="64" y2="80" stroke="#ef4444" stroke-width="3.8" stroke-linecap="round"/>
    <line x1="88" y1="80" x2="104" y2="80" stroke="#ef4444" stroke-width="3.8" stroke-linecap="round"/>

    <path d="M 68 96 Q 72 92 76 96 Q 80 100 84 96" fill="none" stroke="#ef4444" stroke-width="3" stroke-linecap="round"/>
  </g>
</svg>