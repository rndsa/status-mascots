<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <linearGradient id="mug-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fed7aa"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
  </defs>
  <style>
    @keyframes terrorShiver {
      0%, 100% { transform: translate(0, 0); }
      20% { transform: translate(-3px, 2px); }
      40% { transform: translate(3px, -2px); }
      60% { transform: translate(-2px, -2px); }
      80% { transform: translate(2px, 2px); }
    }
    @keyframes sparkFlick {
      0%, 100% { opacity: 0; }
      50% { opacity: 1; }
    }
    .head-terror { animation: terrorShiver 0.25s infinite; transform-origin: 80px 145px; }
    .sparks { animation: sparkFlick 0.3s infinite; }
  </style>

  <ellipse cx="76" cy="148" rx="34" ry="6" fill="#000000" opacity="0.18"/>

  <!-- Sparks -->
  <g class="sparks">
    <polyline points="20,36 28,48 22,52 32,66" fill="none" stroke="#facc15" stroke-width="2.5" stroke-linecap="round"/>
    <polyline points="138,36 130,48 136,52 126,66" fill="none" stroke="#facc15" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <g class="head-terror">
    <path d="M 118 64 C 142 64 142 98 118 98" fill="none" stroke="#ef4444" stroke-width="8" stroke-linecap="round"/>

    <rect x="28" y="44" width="94" height="84" rx="28" fill="url(#mug-grad)" stroke="#ef4444" stroke-width="2.5"/>

    <!-- Ceramic crack line -->
    <polyline points="75,44 78,60 72,74 80,90" fill="none" stroke="#ef4444" stroke-width="2" stroke-linecap="round"/>

    <!-- Wide Spooked Eyes O_O -->
    <ellipse cx="56" cy="78" rx="9" ry="12" fill="#ef4444"/>
    <circle cx="58" cy="75" r="3" fill="#ffffff"/>

    <ellipse cx="94" cy="78" rx="9" ry="12" fill="#ef4444"/>
    <circle cx="96" cy="75" r="3" fill="#ffffff"/>

    <!-- Screaming mouth -->
    <ellipse cx="76" cy="100" rx="9" ry="12" fill="#431407"/>
  </g>
  <text x="76" y="146" font-family="monospace" font-size="10" font-weight="bold" fill="#ef4444" text-anchor="middle">CRACKED (500)</text>
</svg>