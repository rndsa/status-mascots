<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <!-- Area 51 Warning Sign -->
  <rect x="35" y="40" width="90" height="60" rx="4" fill="#0f172a" stroke="#ef4444" stroke-width="3"/>
  <text x="80" y="60" font-family="sans-serif" font-size="12" font-weight="900" fill="#ef4444" text-anchor="middle">AREA 51</text>
  <text x="80" y="75" font-family="monospace" font-size="8" font-weight="bold" fill="#ffffff" text-anchor="middle">RESTRICTED</text>
  <text x="80" y="88" font-family="monospace" font-size="7" fill="#94a3b8" text-anchor="middle">NO ALIEN VEHICLES</text>
  <line x1="80" y1="100" x2="80" y2="140" stroke="#475569" stroke-width="4"/>
</svg>