<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <linearGradient id="alien-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e9d5ff"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <filter id="alien-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#ef4444" flood-opacity="0.3"/>
    </filter>
  </defs>
  <style>
    @keyframes sternAlien {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-4px); }
    }
    .head-stern { animation: sternAlien 2s ease-in-out infinite; }
  </style>

  <ellipse cx="80" cy="148" rx="34" ry="6" fill="#000000" opacity="0.18"/>

  <g class="head-stern">
    <!-- Red warning antenna -->
    <line x1="80" y1="38" x2="80" y2="14" stroke="#ef4444" stroke-width="3" stroke-linecap="round"/>
    <circle cx="80" cy="14" r="7.5" fill="#ef4444"/>

    <path d="M 32 72 C 32 40 50 36 80 36 C 110 36 128 40 128 72 C 128 104 112 128 80 128 C 48 128 32 104 32 72 Z" 
          fill="url(#alien-grad)" stroke="#ef4444" stroke-width="2.5" filter="url(#alien-glow)"/>

    <!-- Stern flat line eyes (- -) -->
    <line x1="52" y1="78" x2="68" y2="78" stroke="#ef4444" stroke-width="4.5" stroke-linecap="round"/>
    <line x1="92" y1="78" x2="108" y2="78" stroke="#ef4444" stroke-width="4.5" stroke-linecap="round"/>

    <line x1="74" y1="94" x2="86" y2="94" stroke="#ef4444" stroke-width="3" stroke-linecap="round"/>
  </g>
  <line x1="24" y1="140" x2="136" y2="140" stroke="#ef4444" stroke-width="2" stroke-dasharray="6 3"/>
</svg>