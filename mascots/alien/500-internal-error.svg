<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <!-- Crashed UFO in Crater with Smoke -->
  <ellipse cx="80" cy="115" rx="45" ry="15" fill="#1e293b"/>
  <!-- Half buried saucer -->
  <g transform="rotate(-25 80 100)">
    <ellipse cx="80" cy="100" rx="42" ry="14" fill="#475569" stroke="#ef4444" stroke-width="2"/>
    <!-- Cracked Dome -->
    <path d="M 65 92 C 65 75 95 75 95 92 Z" fill="#67e8f9" opacity="0.6"/>
    <line x1="75" y1="80" x2="85" y2="88" stroke="#ffffff" stroke-width="2"/>
  </g>
  <circle cx="95" cy="65" r="8" fill="#64748b" opacity="0.6"/>
  <circle cx="105" cy="50" r="12" fill="#64748b" opacity="0.4"/>
  <text x="80" y="145" font-family="monospace" font-size="10" font-weight="bold" fill="#ef4444" text-anchor="middle">CRASH LANDING (500)</text>
</svg>