<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <linearGradient id="alien-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e9d5ff"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <filter id="alien-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#7e22ce" flood-opacity="0.3"/>
    </filter>
  </defs>
  <style>
    @keyframes tiltAlien {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(-15deg); }
    }
    @keyframes qmarkBob {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-7px) rotate(4deg); }
    }
    .head-tilt { animation: tiltAlien 2.6s ease-in-out infinite; transform-origin: 80px 145px; }
    .qmark-box { animation: qmarkBob 2s ease-in-out infinite; transform-origin: 130px 30px; }
  </style>

  <ellipse cx="80" cy="148" rx="34" ry="6" fill="#000000" opacity="0.18"/>

  <g class="qmark-box">
    <ellipse cx="130" cy="30" rx="14" ry="14" fill="#141722" stroke="#c084fc" stroke-width="2"/>
    <text x="130" y="38" font-family="-apple-system, sans-serif" font-size="20" font-weight="900" fill="#c084fc" text-anchor="middle">?</text>
  </g>

  <g class="head-tilt">
    <line x1="80" y1="38" x2="80" y2="14" stroke="#c084fc" stroke-width="3" stroke-linecap="round"/>
    <circle cx="80" cy="14" r="7.5" fill="#eab308"/>

    <path d="M 32 72 C 32 40 50 36 80 36 C 110 36 128 40 128 72 C 128 104 112 128 80 128 C 48 128 32 104 32 72 Z" 
          fill="url(#alien-grad)" stroke="#9333ea" stroke-width="2.5" filter="url(#alien-glow)"/>

    <!-- Puzzled Eyes: Left spiral @, Right dot . -->
    <path d="M 60 76 A 4 4 0 1 1 56 80 A 7 7 0 1 1 65 78" fill="none" stroke="#2e1065" stroke-width="2.8" stroke-linecap="round"/>
    <ellipse cx="98" cy="80" rx="6" ry="8" fill="#2e1065"/>
    <circle cx="100" cy="78" r="2.2" fill="#ffffff"/>

    <circle cx="80" cy="94" r="4.5" fill="#2e1065"/>
  </g>
</svg>