<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <linearGradient id="ufo-saucer" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
    <linearGradient id="beam-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4ade80" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#22c55e" stop-opacity="0.05"/>
    </linearGradient>
  </defs>
  <style>
    @keyframes ufoHover {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px) rotate(2deg); }
    }
    .ufo { animation: ufoHover 2.5s ease-in-out infinite; transform-origin: 80px 80px; }
  </style>

  <!-- Tractor Beam -->
  <polygon points="80,95 45,145 115,145" fill="url(#beam-grad)"/>

  <g class="ufo">
    <!-- Glass Dome -->
    <path d="M 58 75 C 58 50 102 50 102 75 Z" fill="#67e8f9" opacity="0.75" stroke="#0891b2" stroke-width="1.5"/>
    <!-- Alien Head -->
    <ellipse cx="80" cy="68" rx="14" ry="12" fill="#4ade80"/>
    <circle cx="74" cy="66" r="3.5" fill="#052e16"/>
    <circle cx="86" cy="66" r="3.5" fill="#052e16"/>
    <!-- Antenna -->
    <line x1="80" y1="56" x2="80" y2="48" stroke="#22c55e" stroke-width="2"/>
    <circle cx="80" cy="46" r="3" fill="#facc15"/>

    <!-- Metallic Saucer Body -->
    <ellipse cx="80" cy="85" rx="48" ry="16" fill="url(#ufo-saucer)" stroke="#334155" stroke-width="2"/>
    <!-- Lights -->
    <circle cx="50" cy="88" r="3" fill="#38bdf8"/>
    <circle cx="70" cy="91" r="3" fill="#facc15"/>
    <circle cx="90" cy="91" r="3" fill="#4ade80"/>
    <circle cx="110" cy="88" r="3" fill="#f43f5e"/>
  </g>
</svg>