<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <linearGradient id="ufo-glass" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#bae6fd" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.4"/>
    </linearGradient>
  </defs>
  <style>
    @keyframes ufo-float { 0%, 100% { transform: translateY(0) rotate(0deg); } 50% { transform: translateY(-8px) rotate(4deg); } }
    .ufo { animation: ufo-float 2.5s ease-in-out infinite; transform-origin: 80px 90px; }
  </style>
  <g class="ufo">
    <!-- Glass Dome -->
    <path d="M 52 82 C 52 50 108 50 108 82 Z" fill="url(#ufo-glass)" stroke="#7dd3fc" stroke-width="2"/>
    <!-- Green Alien Inside Dome -->
    <circle cx="80" cy="70" r="16" fill="#4ade80"/>
    <!-- Big Alien Eyes -->
    <ellipse cx="73" cy="68" rx="4" ry="6" fill="#0f172a" transform="rotate(-10 73 68)"/>
    <circle cx="74" cy="66" r="1.5" fill="#ffffff"/>
    <ellipse cx="87" cy="68" rx="4" ry="6" fill="#0f172a" transform="rotate(10 87 68)"/>
    <circle cx="88" cy="66" r="1.5" fill="#ffffff"/>
    <!-- UFO Saucer Base -->
    <ellipse cx="80" cy="88" rx="46" ry="14" fill="#64748b" stroke="#334155" stroke-width="2"/>
    <ellipse cx="80" cy="85" rx="36" ry="8" fill="#94a3b8"/>
    <!-- Flashing LED Lights -->
    <circle cx="50" cy="88" r="3" fill="#facc15"/>
    <circle cx="65" cy="91" r="3" fill="#38bdf8"/>
    <circle cx="80" cy="92" r="3" fill="#f43f5e"/>
    <circle cx="95" cy="91" r="3" fill="#38bdf8"/>
    <circle cx="110" cy="88" r="3" fill="#facc15"/>
    <!-- Tractor beam -->
    <polygon points="68,98 92,98 108,135 52,135" fill="#38bdf8" opacity="0.3"/>
  </g>
</svg>