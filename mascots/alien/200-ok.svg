<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <linearGradient id="alien-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e9d5ff"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <filter id="alien-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#7e22ce" flood-opacity="0.3"/>
    </filter>
  </defs>
  <style>
    @keyframes alienBob {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-7px) rotate(1.5deg); }
    }
    @keyframes antennaWiggle {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(10deg); }
    }
    @keyframes eyeBlink {
      0%, 92%, 100% { transform: scaleY(1); }
      96% { transform: scaleY(0.1); }
    }
    .head-alien { animation: alienBob 3s ease-in-out infinite; transform-origin: 80px 145px; }
    .antenna { animation: antennaWiggle 2.2s ease-in-out infinite; transform-origin: 80px 38px; }
    .blink-eye { animation: eyeBlink 3.6s infinite; transform-origin: 60px 80px; }
  </style>

  <ellipse cx="80" cy="148" rx="34" ry="6" fill="#000000" opacity="0.18"/>

  <g class="head-alien">
    <!-- Antenna with Glowing Orb -->
    <g class="antenna">
      <line x1="80" y1="38" x2="80" y2="14" stroke="#c084fc" stroke-width="3" stroke-linecap="round"/>
      <circle cx="80" cy="14" r="7.5" fill="#38bdf8"/>
      <circle cx="82" cy="12" r="2.5" fill="#ffffff"/>
    </g>

    <!-- Chibi Alien Head Base (Inverted Egg / Chibi Alien) -->
    <path d="M 32 72 C 32 40 50 36 80 36 C 110 36 128 40 128 72 C 128 104 112 128 80 128 C 48 128 32 104 32 72 Z" 
          fill="url(#alien-grad)" stroke="#9333ea" stroke-width="2.5" filter="url(#alien-glow)"/>

    <!-- Left Eye (Big Glossy Cosmic Eye) -->
    <g class="blink-eye">
      <ellipse cx="60" cy="78" rx="9" ry="13" fill="#2e1065"/>
      <circle cx="63" cy="73" r="4" fill="#38bdf8"/>
      <circle cx="64" cy="72" r="1.8" fill="#ffffff"/>
      <circle cx="58" cy="84" r="1.5" fill="#ffffff"/>
    </g>

    <!-- Right Eye (Cheerful Wink Arc) -->
    <path d="M 90 80 Q 100 66 110 80" fill="none" stroke="#2e1065" stroke-width="4.5" stroke-linecap="round"/>

    <!-- Cute Smiling Mouth -->
    <path d="M 75 94 Q 80 100 85 94" fill="none" stroke="#2e1065" stroke-width="3" stroke-linecap="round"/>

    <!-- Pink Cheeks -->
    <ellipse cx="46" cy="94" rx="7" ry="4" fill="#f43f5e" opacity="0.6"/>
    <ellipse cx="114" cy="94" rx="7" ry="4" fill="#f43f5e" opacity="0.6"/>
  </g>
</svg>