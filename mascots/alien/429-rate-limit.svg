<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <linearGradient id="alien-hot-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fed7aa"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
  </defs>
  <style>
    @keyframes pantingBreath {
      0%, 100% { transform: scale(1, 1); }
      50% { transform: scale(1.05, 0.95); }
    }
    .head-pant { animation: pantingBreath 0.5s ease-in-out infinite; transform-origin: 80px 145px; }
  </style>

  <ellipse cx="80" cy="148" rx="34" ry="6" fill="#000000" opacity="0.18"/>

  <g class="head-pant">
    <path d="M 32 72 C 32 40 50 36 80 36 C 110 36 128 40 128 72 C 128 104 112 128 80 128 C 48 128 32 104 32 72 Z" 
          fill="url(#alien-hot-grad)" stroke="#c2410c" stroke-width="2.5"/>

    <!-- Exhausted spiral eyes -->
    <path d="M 60 78 A 3 3 0 1 1 56 81 A 5 5 0 1 1 63 79" fill="none" stroke="#7c2d12" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 98 78 A 3 3 0 1 1 94 81 A 5 5 0 1 1 101 79" fill="none" stroke="#7c2d12" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Open mouth with tongue out -->
    <ellipse cx="80" cy="94" rx="6" ry="5" fill="#7c2d12"/>
    <path d="M 78 96 Q 80 104 82 96 Z" fill="#f43f5e"/>

    <ellipse cx="46" cy="92" rx="7" ry="4" fill="#f97316" opacity="0.7"/>
    <ellipse cx="114" cy="92" rx="7" ry="4" fill="#f97316" opacity="0.7"/>
  </g>
  <text x="80" y="146" font-family="monospace" font-size="10" font-weight="bold" fill="#ea580c" text-anchor="middle">OVERHEAT 429</text>
</svg>