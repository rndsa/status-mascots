<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <linearGradient id="alien-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e9d5ff"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <filter id="alien-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#7e22ce" flood-opacity="0.3"/>
    </filter>
  </defs>
  <style>
    @keyframes happyJump {
      0%, 100% { transform: translateY(0) scale(1, 1); }
      30% { transform: translateY(6px) scale(1.08, 0.92); }
      55% { transform: translateY(-16px) scale(0.94, 1.06); }
      75% { transform: translateY(-2px) scale(1.02, 0.98); }
    }
    .head-jump { animation: happyJump 1.8s cubic-bezier(0.28, 0.84, 0.42, 1) infinite; transform-origin: 80px 145px; }
  </style>

  <ellipse cx="80" cy="148" rx="34" ry="6" fill="#000000" opacity="0.18"/>

  <g class="head-jump">
    <!-- Party Hat -->
    <polygon points="80,14 66,36 94,36" fill="#f43f5e"/>
    <circle cx="80" cy="12" r="4.5" fill="#facc15"/>

    <path d="M 32 72 C 32 40 50 36 80 36 C 110 36 128 40 128 72 C 128 104 112 128 80 128 C 48 128 32 104 32 72 Z" 
          fill="url(#alien-grad)" stroke="#9333ea" stroke-width="2.5" filter="url(#alien-glow)"/>

    <!-- Joyful Closed Eyes (^ ^) -->
    <path d="M 52 78 Q 62 66 72 78" fill="none" stroke="#2e1065" stroke-width="4.5" stroke-linecap="round"/>
    <path d="M 88 78 Q 98 66 108 78" fill="none" stroke="#2e1065" stroke-width="4.5" stroke-linecap="round"/>

    <!-- Happy Open Mouth -->
    <path d="M 74 92 Q 80 102 86 92 Z" fill="#2e1065"/>

    <ellipse cx="46" cy="94" rx="7" ry="4" fill="#f43f5e" opacity="0.6"/>
    <ellipse cx="114" cy="94" rx="7" ry="4" fill="#f43f5e" opacity="0.6"/>
  </g>
</svg>