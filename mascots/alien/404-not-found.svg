<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <style>
    @keyframes lost-ufo { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px) scale(0.9); } }
    .lost { animation: lost-ufo 3s infinite; }
  </style>
  <g class="lost">
    <!-- UFO looking down in deep space -->
    <ellipse cx="80" cy="80" rx="38" ry="12" fill="#475569"/>
    <path d="M 58 76 C 58 55 102 55 102 76 Z" fill="#38bdf8" opacity="0.4"/>
    <circle cx="80" cy="68" r="10" fill="#4ade80"/>
    <text x="80" y="115" font-family="monospace" font-size="11" font-weight="bold" fill="#38bdf8" text-anchor="middle">LOST IN SPACE</text>
  </g>
</svg>