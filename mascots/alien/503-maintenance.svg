<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <linearGradient id="alien-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e9d5ff"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
  </defs>
  <style>
    @keyframes workNod {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-5px); }
    }
    .head-work { animation: workNod 1.8s ease-in-out infinite; }
  </style>

  <ellipse cx="80" cy="148" rx="34" ry="6" fill="#000000" opacity="0.18"/>

  <g class="head-work">
    <path d="M 32 72 C 32 40 50 36 80 36 C 110 36 128 40 128 72 C 128 104 112 128 80 128 C 48 128 32 104 32 72 Z" 
          fill="url(#alien-grad)" stroke="#9333ea" stroke-width="2.5"/>

    <!-- Worker Headband (Hachimaki) with Red Sun -->
    <path d="M 32 54 Q 80 48 128 54 L 128 62 Q 80 56 32 62 Z" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
    <circle cx="80" cy="57" r="4.5" fill="#ef4444"/>

    <!-- Confident smiling eyes (^ ^) -->
    <path d="M 52 78 Q 62 66 72 78" fill="none" stroke="#2e1065" stroke-width="4.5" stroke-linecap="round"/>
    <path d="M 88 78 Q 98 66 108 78" fill="none" stroke="#2e1065" stroke-width="4.5" stroke-linecap="round"/>

    <path d="M 75 94 Q 80 100 85 94" fill="none" stroke="#2e1065" stroke-width="3" stroke-linecap="round"/>
  </g>
  <text x="80" y="146" font-family="monospace" font-size="10" font-weight="bold" fill="#eab308" text-anchor="middle">MAINTENANCE (503)</text>
</svg>