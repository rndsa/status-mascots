<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <linearGradient id="alien-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e9d5ff"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
  </defs>
  <style>
    @keyframes glitchJitter {
      0%, 100% { transform: translate(0, 0); }
      20% { transform: translate(-3px, 1px); }
      40% { transform: translate(2px, -2px); }
      60% { transform: translate(-2px, -1px); }
      80% { transform: translate(3px, 2px); }
    }
    .head-glitch { animation: glitchJitter 0.25s infinite; }
  </style>

  <ellipse cx="80" cy="148" rx="34" ry="6" fill="#000000" opacity="0.18"/>

  <g class="head-glitch">
    <path d="M 32 72 C 32 40 50 36 80 36 C 110 36 128 40 128 72 C 128 104 112 128 80 128 C 48 128 32 104 32 72 Z" 
          fill="url(#alien-grad)" stroke="#c084fc" stroke-width="2.5"/>

    <!-- Glitched pixel eyes -->
    <rect x="52" y="76" width="16" height="5" fill="#c084fc"/>
    <rect x="56" y="71" width="8" height="15" fill="#c084fc"/>
    <rect x="92" y="76" width="16" height="5" fill="#38bdf8"/>
    <rect x="96" y="81" width="8" height="10" fill="#38bdf8"/>

    <rect x="74" y="94" width="12" height="4" fill="#c084fc"/>
  </g>
  <text x="80" y="146" font-family="monospace" font-size="10" font-weight="bold" fill="#c084fc" text-anchor="middle">PARSER GLITCH (422)</text>
</svg>