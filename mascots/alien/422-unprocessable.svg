<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <style>
    @keyframes warpSpin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    .warp { animation: warpSpin 3s linear infinite; transform-origin: 80px 80px; }
  </style>
  <g class="warp">
    <ellipse cx="80" cy="80" rx="45" ry="20" fill="none" stroke="#a855f7" stroke-width="2" stroke-dasharray="8 4"/>
    <ellipse cx="80" cy="80" rx="30" ry="12" fill="none" stroke="#6366f1" stroke-width="2.5" stroke-dasharray="6 3"/>
    <circle cx="80" cy="80" r="10" fill="#0f172a"/>
  </g>
  <text x="80" y="145" font-family="monospace" font-size="10" font-weight="bold" fill="#a855f7" text-anchor="middle">WORMHOLE DISTORTION</text>
</svg>