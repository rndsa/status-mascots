<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <style>
    @keyframes saucerCrash {
      0%, 100% { transform: translateX(0); }
      50% { transform: translateX(4px); }
    }
    .crash { animation: saucerCrash 0.6s infinite; }
  </style>
  <!-- Two colliding Saucers -->
  <g class="crash">
    <ellipse cx="55" cy="80" rx="30" ry="10" fill="#64748b" stroke="#ef4444" stroke-width="2"/>
    <ellipse cx="105" cy="80" rx="30" ry="10" fill="#64748b" stroke="#ef4444" stroke-width="2"/>
    <!-- Collision Spark -->
    <polygon points="80,70 84,76 90,75 86,81 89,88 80,83 71,88 74,81 70,75 76,76" fill="#facc15"/>
  </g>
  <text x="80" y="145" font-family="monospace" font-size="11" font-weight="bold" fill="#ef4444" text-anchor="middle">ORBIT CONFLICT</text>
</svg>