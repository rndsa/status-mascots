<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <style>
    @keyframes ufoSpin {
      0% { transform: rotate(0deg); }
      20% { transform: rotate(-16deg) translateX(-8px); }
      40% { transform: rotate(14deg) translateX(8px); }
      60% { transform: rotate(-10deg); }
      100% { transform: rotate(0deg); }
    }
    .ufo-err { animation: ufoSpin 0.75s ease-in-out infinite; transform-origin: 80px 88px; }
  </style>
  <g class="ufo-err">
    <path d="M 52 82 C 52 50 108 50 108 82 Z" fill="#fca5a5" opacity="0.6" stroke="#ef4444" stroke-width="2"/>
    <!-- Alien Panicking (> <) -->
    <circle cx="80" cy="70" r="16" fill="#4ade80"/>
    <line x1="70" y1="65" x2="76" y2="71" stroke="#0f172a" stroke-width="2"/>
    <line x1="76" y1="65" x2="70" y2="71" stroke="#0f172a" stroke-width="2"/>
    <line x1="84" y1="65" x2="90" y2="71" stroke="#0f172a" stroke-width="2"/>
    <line x1="90" y1="65" x2="84" y2="71" stroke="#0f172a" stroke-width="2"/>
    <!-- UFO Saucer Base Red Warning -->
    <ellipse cx="80" cy="88" rx="46" ry="14" fill="#b91c1c" stroke="#7f1d1d" stroke-width="2"/>
    <!-- Warning Red Lights -->
    <circle cx="50" cy="88" r="3.5" fill="#ffffff"/>
    <circle cx="80" cy="92" r="3.5" fill="#ffffff"/>
    <circle cx="110" cy="88" r="3.5" fill="#ffffff"/>
    <path d="M 115 50 Q 120 56 115 60 Q 110 56 115 50 Z" fill="#38bdf8"/>
  </g>
</svg>