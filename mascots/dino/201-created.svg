<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <linearGradient id="dino-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#bef264"/>
      <stop offset="100%" stop-color="#65a30d"/>
    </linearGradient>
    <filter id="dino-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#4d7c0f" flood-opacity="0.3"/>
    </filter>
  </defs>
  <style>
    @keyframes happyJump {
      0%, 100% { transform: translateY(0) scale(1, 1); }
      30% { transform: translateY(6px) scale(1.08, 0.92); }
      55% { transform: translateY(-16px) scale(0.94, 1.06); }
      75% { transform: translateY(-2px) scale(1.02, 0.98); }
    }
    .head-jump { animation: happyJump 1.8s cubic-bezier(0.28, 0.84, 0.42, 1) infinite; transform-origin: 80px 145px; }
  </style>

  <ellipse cx="80" cy="148" rx="34" ry="6" fill="#000000" opacity="0.18"/>

  <g class="head-jump">
    <polygon points="40,46 48,22 60,42" fill="#f59e0b"/>
    <polygon points="86,38 96,20 106,42" fill="#f59e0b"/>

    <!-- Party Hat in Middle -->
    <polygon points="72,12 60,38 84,38" fill="#ec4899"/>
    <circle cx="72" cy="10" r="4" fill="#facc15"/>

    <path d="M 32 80 C 32 48 52 38 80 38 C 114 38 128 54 128 80 C 128 106 122 128 96 128 C 76 128 68 124 56 124 C 42 124 32 108 32 80 Z" 
          fill="url(#dino-grad)" stroke="#4d7c0f" stroke-width="2.5" filter="url(#dino-glow)"/>

    <!-- Joyful Closed Eyes (^ ^) -->
    <path d="M 52 80 Q 62 68 72 80" fill="none" stroke="#14532d" stroke-width="4.5" stroke-linecap="round"/>
    <path d="M 88 80 Q 98 68 108 80" fill="none" stroke="#14532d" stroke-width="4.5" stroke-linecap="round"/>

    <circle cx="82" cy="90" r="2" fill="#365314"/>
    <circle cx="88" cy="90" r="2" fill="#365314"/>

    <!-- Happy Open Rawr Mouth -->
    <path d="M 74 94 Q 88 108 102 94 Z" fill="#f43f5e"/>
    <polygon points="84,95 87,100 90,95" fill="#ffffff"/>

    <ellipse cx="48" cy="94" rx="7" ry="4" fill="#f43f5e" opacity="0.6"/>
    <ellipse cx="110" cy="98" rx="6" ry="3.5" fill="#f43f5e" opacity="0.6"/>
  </g>
</svg>