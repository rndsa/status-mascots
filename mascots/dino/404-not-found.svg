<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <style>
    @keyframes dinoDig {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(-10deg); }
    }
    .dig { animation: dinoDig 1.5s infinite; }
  </style>

  <!-- Hole in ground with dirt flying -->
  <ellipse cx="80" cy="120" rx="40" ry="12" fill="#451a03"/>
  <g class="dig">
    <!-- Dino head inside hole, tail sticking up -->
    <ellipse cx="80" cy="100" rx="24" ry="30" fill="#86efac" stroke="#16a34a" stroke-width="2"/>
    <path d="M 80 75 Q 70 50 60 45" fill="none" stroke="#16a34a" stroke-width="7" stroke-linecap="round"/>
  </g>
  <text x="80" y="145" font-family="monospace" font-size="10" font-weight="bold" fill="#ca8a04" text-anchor="middle">DIGGING 404</text>
</svg>