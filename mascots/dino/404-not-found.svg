<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <style>
    @keyframes dino-search { 0%, 100% { transform: rotate(0); } 50% { transform: rotate(-10deg); } }
    .searching { animation: dino-search 2.5s infinite; transform-origin: 80px 100px; }
  </style>
  <g class="searching">
    <!-- Dino scratching head with tiny arm, can't reach -->
    <ellipse cx="75" cy="105" rx="30" ry="22" fill="#86efac" stroke="#16a34a" stroke-width="2"/>
    <circle cx="85" cy="70" r="22" fill="#86efac" stroke="#16a34a" stroke-width="2"/>
    <circle cx="92" cy="68" r="4" fill="#14532d"/>
    <!-- Tiny arm struggling to reach head -->
    <line x1="88" y1="90" x2="92" y2="78" stroke="#16a34a" stroke-width="3" stroke-linecap="round"/>
    <text x="110" y="55" font-family="sans-serif" font-size="20" font-weight="bold" fill="#eab308">?</text>
    <text x="80" y="145" font-family="monospace" font-size="11" font-weight="bold" fill="#16a34a" text-anchor="middle">CANNOT REACH</text>
  </g>
</svg>