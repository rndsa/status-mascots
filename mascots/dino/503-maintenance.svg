<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <linearGradient id="dino-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#bef264"/>
      <stop offset="100%" stop-color="#65a30d"/>
    </linearGradient>
  </defs>
  <style>
    @keyframes workNod {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-5px); }
    }
    .head-work { animation: workNod 1.8s ease-in-out infinite; }
  </style>

  <ellipse cx="80" cy="148" rx="34" ry="6" fill="#000000" opacity="0.18"/>

  <g class="head-work">
    <polygon points="40,46 48,22 60,42" fill="#f59e0b"/>
    <polygon points="62,38 72,16 84,36" fill="#f59e0b"/>
    <polygon points="86,38 96,20 106,42" fill="#f59e0b"/>

    <path d="M 32 80 C 32 48 52 38 80 38 C 114 38 128 54 128 80 C 128 106 122 128 96 128 C 76 128 68 124 56 124 C 42 124 32 108 32 80 Z" 
          fill="url(#dino-grad)" stroke="#4d7c0f" stroke-width="2.5"/>

    <!-- Worker Headband (Hachimaki) with Red Sun -->
    <path d="M 30 58 Q 80 50 130 58 L 130 66 Q 80 58 30 66 Z" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
    <circle cx="80" cy="61" r="4.5" fill="#ef4444"/>

    <!-- Confident smiling eyes (^ ^) -->
    <path d="M 52 80 Q 62 68 72 80" fill="none" stroke="#14532d" stroke-width="4.5" stroke-linecap="round"/>
    <path d="M 88 80 Q 98 68 108 80" fill="none" stroke="#14532d" stroke-width="4.5" stroke-linecap="round"/>

    <path d="M 74 94 Q 88 104 102 94" fill="none" stroke="#14532d" stroke-width="3" stroke-linecap="round"/>
    <polygon points="84,95 87,100 90,95" fill="#ffffff"/>
  </g>
  <text x="80" y="146" font-family="monospace" font-size="10" font-weight="bold" fill="#eab308" text-anchor="middle">MAINTENANCE (503)</text>
</svg>