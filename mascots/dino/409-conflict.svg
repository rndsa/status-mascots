<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <linearGradient id="dino-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#bef264"/>
      <stop offset="100%" stop-color="#65a30d"/>
    </linearGradient>
    <filter id="dino-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#ef4444" flood-opacity="0.3"/>
    </filter>
  </defs>
  <style>
    @keyframes shockDino {
      0%, 100% { transform: rotate(0deg); }
      15% { transform: rotate(-8deg); }
      30% { transform: rotate(8deg); }
      45% { transform: rotate(-6deg); }
      60% { transform: rotate(5deg); }
      75% { transform: rotate(-3deg); }
    }
    @keyframes sweatFall {
      0% { transform: translateY(0); opacity: 0; }
      50% { opacity: 1; }
      100% { transform: translateY(18px); opacity: 0; }
    }
    .head-shock { animation: shockDino 0.75s ease-in-out infinite; transform-origin: 80px 145px; }
    .sweat-drop { animation: sweatFall 1.2s infinite; }
  </style>

  <ellipse cx="80" cy="148" rx="34" ry="6" fill="#000000" opacity="0.18"/>

  <g class="head-shock">
    <polygon points="40,46 48,22 60,42" fill="#ef4444"/>
    <polygon points="62,38 72,16 84,36" fill="#ef4444"/>
    <polygon points="86,38 96,20 106,42" fill="#ef4444"/>

    <path d="M 32 80 C 32 48 52 38 80 38 C 114 38 128 54 128 80 C 128 106 122 128 96 128 C 76 128 68 124 56 124 C 42 124 32 108 32 80 Z" 
          fill="url(#dino-grad)" stroke="#ef4444" stroke-width="2.5" filter="url(#dino-glow)"/>

    <!-- Squeezed X Eyes (> <) -->
    <path d="M 52 74 L 64 82 L 52 90" fill="none" stroke="#ef4444" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 108 74 L 96 82 L 108 90" fill="none" stroke="#ef4444" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Panicked quivering mouth -->
    <path d="M 74 96 Q 80 91 86 96 Q 92 101 98 96" fill="none" stroke="#ef4444" stroke-width="3" stroke-linecap="round"/>

    <!-- Giant Anime Tears -->
    <g class="sweat-drop" transform="translate(122, 60)">
      <path d="M 0 -8 Q 6 0 0 5 Q -6 0 0 -8 Z" fill="#38bdf8"/>
    </g>
  </g>
</svg>