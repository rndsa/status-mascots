<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <!-- Wooden Fence Barrier -->
  <rect x="25" y="80" width="110" height="10" fill="#78350f"/>
  <rect x="25" y="105" width="110" height="10" fill="#78350f"/>
  <line x1="45" y1="70" x2="45" y2="135" stroke="#451a03" stroke-width="4"/>
  <line x1="115" y1="70" x2="115" y2="135" stroke="#451a03" stroke-width="4"/>

  <!-- Dino peering behind fence -->
  <circle cx="80" cy="65" r="24" fill="#86efac" stroke="#ef4444" stroke-width="2"/>
  <!-- Warning sign -->
  <polygon points="80,18 64,44 96,44" fill="#ef4444"/>
  <text x="80" y="40" font-family="sans-serif" font-size="14" font-weight="900" fill="#ffffff" text-anchor="middle">!</text>
</svg>