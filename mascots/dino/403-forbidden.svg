<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <linearGradient id="dino-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#bef264"/>
      <stop offset="100%" stop-color="#65a30d"/>
    </linearGradient>
    <filter id="dino-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#ef4444" flood-opacity="0.3"/>
    </filter>
  </defs>
  <style>
    @keyframes sternDino {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-4px); }
    }
    .head-stern { animation: sternDino 2s ease-in-out infinite; }
  </style>

  <ellipse cx="80" cy="148" rx="34" ry="6" fill="#000000" opacity="0.18"/>

  <g class="head-stern">
    <!-- Red warning spikes -->
    <polygon points="40,46 48,22 60,42" fill="#ef4444"/>
    <polygon points="62,38 72,16 84,36" fill="#ef4444"/>
    <polygon points="86,38 96,20 106,42" fill="#ef4444"/>

    <path d="M 32 80 C 32 48 52 38 80 38 C 114 38 128 54 128 80 C 128 106 122 128 96 128 C 76 128 68 124 56 124 C 42 124 32 108 32 80 Z" 
          fill="url(#dino-grad)" stroke="#ef4444" stroke-width="2.5" filter="url(#dino-glow)"/>

    <!-- Stern flat line eyes (- -) -->
    <line x1="52" y1="78" x2="68" y2="78" stroke="#ef4444" stroke-width="4.5" stroke-linecap="round"/>
    <line x1="92" y1="78" x2="108" y2="78" stroke="#ef4444" stroke-width="4.5" stroke-linecap="round"/>

    <!-- Bared stern teeth -->
    <rect x="74" y="94" width="28" height="6" rx="2" fill="#ffffff" stroke="#ef4444" stroke-width="1.5"/>
    <line x1="81" y1="94" x2="81" y2="100" stroke="#ef4444" stroke-width="1.5"/>
    <line x1="88" y1="94" x2="88" y2="100" stroke="#ef4444" stroke-width="1.5"/>
    <line x1="95" y1="94" x2="95" y2="100" stroke="#ef4444" stroke-width="1.5"/>
  </g>
  <line x1="24" y1="140" x2="136" y2="140" stroke="#ef4444" stroke-width="2" stroke-dasharray="6 3"/>
</svg>