<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <linearGradient id="dino-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#bef264"/>
      <stop offset="100%" stop-color="#65a30d"/>
    </linearGradient>
    <filter id="dino-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#ef4444" flood-opacity="0.3"/>
    </filter>
  </defs>
  <style>
    @keyframes dinoNoShake {
      0%, 100% { transform: rotate(0deg); }
      20% { transform: rotate(-10deg); }
      40% { transform: rotate(10deg); }
      60% { transform: rotate(-7deg); }
      80% { transform: rotate(7deg); }
    }
    .head-no { animation: dinoNoShake 1.4s ease-in-out infinite; transform-origin: 80px 145px; }
  </style>

  <ellipse cx="80" cy="148" rx="34" ry="6" fill="#000000" opacity="0.18"/>

  <g class="head-no">
    <!-- Red padlock -->
    <rect x="72" y="16" width="16" height="13" rx="3" fill="#ef4444"/>
    <path d="M 75 16 L 75 11 C 75 6 85 6 85 11 L 85 16" fill="none" stroke="#ef4444" stroke-width="2.5" stroke-linecap="round"/>

    <polygon points="40,46 48,22 60,42" fill="#f59e0b"/>
    <polygon points="62,38 72,16 84,36" fill="#f59e0b"/>
    <polygon points="86,38 96,20 106,42" fill="#f59e0b"/>

    <path d="M 32 80 C 32 48 52 38 80 38 C 114 38 128 54 128 80 C 128 106 122 128 96 128 C 76 128 68 124 56 124 C 42 124 32 108 32 80 Z" 
          fill="url(#dino-grad)" stroke="#ef4444" stroke-width="2.5" filter="url(#dino-glow)"/>

    <!-- Squinting warning eyes -->
    <line x1="52" y1="78" x2="68" y2="78" stroke="#ef4444" stroke-width="3.8" stroke-linecap="round"/>
    <line x1="92" y1="78" x2="108" y2="78" stroke="#ef4444" stroke-width="3.8" stroke-linecap="round"/>

    <!-- Denying wavy mouth -->
    <path d="M 74 96 Q 80 92 86 96 Q 92 100 98 96" fill="none" stroke="#ef4444" stroke-width="3" stroke-linecap="round"/>
  </g>
</svg>