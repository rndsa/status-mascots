<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <!-- Dino trying to reach high keyhole -->
  <rect x="110" y="30" width="30" height="100" fill="#475569"/>
  <circle cx="125" cy="45" r="5" fill="#ef4444"/>
  <rect x="122" y="47" width="6" height="8" rx="2" fill="#ef4444"/>

  <!-- Dino stretching tiptoe -->
  <ellipse cx="65" cy="105" rx="26" ry="24" fill="#86efac" stroke="#16a34a" stroke-width="2"/>
  <circle cx="75" cy="75" r="18" fill="#86efac" stroke="#16a34a" stroke-width="2"/>
  <circle cx="82" cy="72" r="3.5" fill="#14532d"/>
  <!-- Key in tiny hand -->
  <line x1="85" y1="88" x2="105" y2="70" stroke="#f59e0b" stroke-width="3"/>
  <circle cx="105" cy="70" r="4" fill="#f59e0b"/>
</svg>