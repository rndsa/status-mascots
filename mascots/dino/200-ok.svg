<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <linearGradient id="dino-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#bef264"/>
      <stop offset="100%" stop-color="#65a30d"/>
    </linearGradient>
    <filter id="dino-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#4d7c0f" flood-opacity="0.3"/>
    </filter>
  </defs>
  <style>
    @keyframes dinoBob {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-7px) rotate(1.5deg); }
    }
    @keyframes spikeWiggle {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(6deg); }
    }
    @keyframes eyeBlink {
      0%, 92%, 100% { transform: scaleY(1); }
      96% { transform: scaleY(0.1); }
    }
    .head-dino { animation: dinoBob 3s ease-in-out infinite; transform-origin: 80px 145px; }
    .spikes { animation: spikeWiggle 2.2s ease-in-out infinite; transform-origin: 50px 30px; }
    .blink-eye { animation: eyeBlink 3.6s infinite; transform-origin: 62px 82px; }
  </style>

  <ellipse cx="80" cy="148" rx="34" ry="6" fill="#000000" opacity="0.18"/>

  <g class="head-dino">
    <!-- Dorsal Spikes on Head/Back -->
    <g class="spikes">
      <polygon points="40,46 48,22 60,42" fill="#f59e0b"/>
      <polygon points="62,38 72,16 84,36" fill="#f59e0b"/>
      <polygon points="86,38 96,20 106,42" fill="#f59e0b"/>
    </g>

    <!-- Chibi Dino Head Base (Squircle with snout bulge) -->
    <path d="M 32 80 C 32 48 52 38 80 38 C 114 38 128 54 128 80 C 128 106 122 128 96 128 C 76 128 68 124 56 124 C 42 124 32 108 32 80 Z" 
          fill="url(#dino-grad)" stroke="#4d7c0f" stroke-width="2.5" filter="url(#dino-glow)"/>

    <!-- Left Eye (Big Anime Pupil) -->
    <g class="blink-eye">
      <ellipse cx="62" cy="80" rx="8" ry="11" fill="#14532d"/>
      <circle cx="65" cy="76" r="3.5" fill="#ffffff"/>
      <circle cx="60" cy="85" r="1.8" fill="#ffffff"/>
    </g>

    <!-- Right Eye (Playful Wink Arc) -->
    <path d="M 88 82 Q 98 70 108 82" fill="none" stroke="#14532d" stroke-width="4.5" stroke-linecap="round"/>

    <!-- Cute Nostril Dots -->
    <circle cx="82" cy="90" r="2" fill="#365314"/>
    <circle cx="88" cy="90" r="2" fill="#365314"/>

    <!-- Cute Smiling Rawr Mouth with Little Tooth -->
    <path d="M 72 96 Q 88 106 104 96" fill="none" stroke="#14532d" stroke-width="3" stroke-linecap="round"/>
    <polygon points="82,98 86,104 90,98" fill="#ffffff"/>

    <!-- Pink Cheeks -->
    <ellipse cx="48" cy="94" rx="7" ry="4" fill="#f43f5e" opacity="0.6"/>
    <ellipse cx="110" cy="98" rx="6" ry="3.5" fill="#f43f5e" opacity="0.6"/>
  </g>
</svg>