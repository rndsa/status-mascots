<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <linearGradient id="dino-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#86efac"/>
      <stop offset="100%" stop-color="#22c55e"/>
    </linearGradient>
  </defs>
  <style>
    @keyframes dinoHop {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px) rotate(2deg); }
    }
    @keyframes tailWagDino {
      0%, 100% { transform: rotate(-5deg); }
      50% { transform: rotate(12deg); }
    }
    .rexy-body { animation: dinoHop 2s ease-in-out infinite; transform-origin: center bottom; }
    .tail-d { animation: tailWagDino 1.5s ease-in-out infinite; transform-origin: 45px 105px; }
  </style>

  <g class="rexy-body">
    <!-- Tail -->
    <path d="M 45 105 Q 25 100 20 85" fill="none" stroke="#16a34a" stroke-width="8" stroke-linecap="round" class="tail-d"/>
    <!-- Body -->
    <ellipse cx="75" cy="105" rx="32" ry="24" fill="url(#dino-grad)" stroke="#16a34a" stroke-width="2"/>
    <!-- Back Spikes -->
    <polygon points="50,92 56,84 62,92" fill="#eab308"/>
    <polygon points="64,90 70,82 76,90" fill="#eab308"/>
    <polygon points="78,90 84,82 90,90" fill="#eab308"/>
    <!-- Head -->
    <path d="M 75 75 C 75 50 115 50 120 70 C 122 80 115 90 95 90 C 80 90 75 85 75 75 Z" fill="url(#dino-grad)" stroke="#16a34a" stroke-width="2"/>
    <!-- Cute Eye -->
    <circle cx="98" cy="66" r="6" fill="#14532d"/>
    <circle cx="100" cy="64" r="2.5" fill="#ffffff"/>
    <polygon points="112,79 114,83 116,79" fill="#ffffff"/>
    <!-- Leaf Snack in mouth -->
    <path d="M 115 80 Q 128 75 130 85 Q 120 88 115 80 Z" fill="#15803d"/>
    <!-- Tiny Arms -->
    <ellipse cx="98" cy="98" rx="6" ry="4" fill="#86efac" stroke="#16a34a" stroke-width="1.5" transform="rotate(20 98 98)"/>
    <!-- Feet -->
    <ellipse cx="65" cy="128" rx="7" ry="5" fill="#16a34a"/>
    <ellipse cx="85" cy="128" rx="7" ry="5" fill="#16a34a"/>
  </g>
</svg>