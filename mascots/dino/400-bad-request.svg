<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <linearGradient id="dino-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#bef264"/>
      <stop offset="100%" stop-color="#65a30d"/>
    </linearGradient>
    <filter id="dino-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#4d7c0f" flood-opacity="0.3"/>
    </filter>
  </defs>
  <style>
    @keyframes tiltDino {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(-15deg); }
    }
    @keyframes qmarkBob {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-7px) rotate(4deg); }
    }
    .head-tilt { animation: tiltDino 2.6s ease-in-out infinite; transform-origin: 80px 145px; }
    .qmark-box { animation: qmarkBob 2s ease-in-out infinite; transform-origin: 130px 30px; }
  </style>

  <ellipse cx="80" cy="148" rx="34" ry="6" fill="#000000" opacity="0.18"/>

  <g class="qmark-box">
    <ellipse cx="130" cy="30" rx="14" ry="14" fill="#141722" stroke="#84cc16" stroke-width="2"/>
    <text x="130" y="38" font-family="-apple-system, sans-serif" font-size="20" font-weight="900" fill="#84cc16" text-anchor="middle">?</text>
  </g>

  <g class="head-tilt">
    <polygon points="40,46 48,22 60,42" fill="#f59e0b"/>
    <polygon points="62,38 72,16 84,36" fill="#f59e0b"/>
    <polygon points="86,38 96,20 106,42" fill="#f59e0b"/>

    <path d="M 32 80 C 32 48 52 38 80 38 C 114 38 128 54 128 80 C 128 106 122 128 96 128 C 76 128 68 124 56 124 C 42 124 32 108 32 80 Z" 
          fill="url(#dino-grad)" stroke="#4d7c0f" stroke-width="2.5" filter="url(#dino-glow)"/>

    <!-- Puzzled Eyes: Left spiral @, Right dot . -->
    <path d="M 62 78 A 4 4 0 1 1 58 82 A 7 7 0 1 1 67 80" fill="none" stroke="#14532d" stroke-width="2.8" stroke-linecap="round"/>
    <ellipse cx="98" cy="82" rx="6" ry="8" fill="#14532d"/>
    <circle cx="100" cy="80" r="2.2" fill="#ffffff"/>

    <circle cx="82" cy="90" r="2" fill="#365314"/>
    <circle cx="88" cy="90" r="2" fill="#365314"/>

    <!-- Puzzled small O mouth -->
    <circle cx="86" cy="98" r="4.5" fill="#14532d"/>
  </g>
</svg>