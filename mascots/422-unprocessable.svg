<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <style>
      @keyframes glitchShake {
        0%, 100% { transform: translate(0); }
        20% { transform: translate(-3px, 2px); }
        40% { transform: translate(3px, -1px); }
        60% { transform: translate(-2px, -2px); }
        80% { transform: translate(2px, 1px); }
      }
      .glitch { animation: glitchShake 0.4s ease-in-out infinite; }
    </style>
  </defs>
  <!-- Tangled wires on top -->
  <path d="M50 28 Q45 10 58 14 T65 24 T52 18" stroke="#f43f5e" stroke-width="2" fill="none"/>
  <!-- Helmet -->
  <g class="glitch">
    <rect x="24" y="28" width="72" height="66" rx="24" fill="#ffffff" stroke="#f43f5e" stroke-width="2"/>
    <!-- Visor -->
    <rect x="30" y="36" width="60" height="42" rx="14" fill="#10131a"/>
    <!-- Swirl Glitch Eyes (@ @) -->
    <circle cx="45" cy="56" r="6" stroke="#f43f5e" stroke-width="2" fill="none"/>
    <circle cx="45" cy="56" r="2" fill="#f43f5e"/>
    <circle cx="75" cy="56" r="6" stroke="#f43f5e" stroke-width="2" fill="none"/>
    <circle cx="75" cy="56" r="2" fill="#f43f5e"/>
    <!-- Wave mouth -->
    <path d="M48 68 Q54 64 60 68 T72 68" stroke="#f43f5e" stroke-width="2" fill="none"/>
  </g>
</svg>