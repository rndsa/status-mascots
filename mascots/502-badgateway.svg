<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <style>
      @keyframes sparkElectric {
        0%, 100% { opacity: 0.2; }
        50% { opacity: 1; }
      }
      .electric-spark { animation: sparkElectric 0.5s ease-in-out infinite alternate; }
    </style>
  </defs>
  <!-- Disconnected wire spark on top -->
  <line x1="38" y1="16" x2="52" y2="20" stroke="#3b82f6" stroke-width="3" stroke-linecap="round"/>
  <line x1="82" y1="16" x2="68" y2="20" stroke="#3b82f6" stroke-width="3" stroke-linecap="round"/>
  <!-- Spark between wires -->
  <polygon class="electric-spark" points="60,14 62,20 58,21 61,26 56,20 60,19" fill="#38bdf8"/>
  <!-- Helmet -->
  <rect x="24" y="28" width="72" height="66" rx="24" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
  <!-- Visor -->
  <rect x="30" y="36" width="60" height="42" rx="14" fill="#10131a"/>
  <!-- Dead / Off LED Eyes (- -) -->
  <circle cx="44" cy="56" r="4" fill="#334155"/>
  <circle cx="76" cy="56" r="4" fill="#334155"/>
  <line x1="55" y1="67" x2="65" y2="67" stroke="#334155" stroke-width="2" stroke-linecap="round"/>
</svg>