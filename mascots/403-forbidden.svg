<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <style>
      @keyframes sternPulse {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.03); }
      }
      .bot-stern { animation: sternPulse 2s ease-in-out infinite; transform-origin: center; }
    </style>
  </defs>
  <g class="bot-stern">
    <!-- Siren / Red Beacon -->
    <path d="M52 28 L68 28 L64 16 L56 16 Z" fill="#ff4d4d"/>
    <circle cx="60" cy="14" r="3" fill="#ff8080"/>
    <!-- Helmet -->
    <rect x="24" y="28" width="72" height="66" rx="24" fill="#1a1c23" stroke="#ff4d4d" stroke-width="2"/>
    <!-- Visor -->
    <rect x="30" y="36" width="60" height="42" rx="14" fill="#090a0e"/>
    <!-- Stern Red Eyes (- -) -->
    <line x1="38" y1="56" x2="50" y2="56" stroke="#ff4d4d" stroke-width="4" stroke-linecap="round"/>
    <line x1="70" y1="56" x2="82" y2="56" stroke="#ff4d4d" stroke-width="4" stroke-linecap="round"/>
    <line x1="55" y1="67" x2="65" y2="67" stroke="#ff4d4d" stroke-width="2.5" stroke-linecap="round"/>
  </g>
</svg>