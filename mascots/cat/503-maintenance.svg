<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <linearGradient id="cat-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fed7aa"/>
      <stop offset="100%" stop-color="#fb923c"/>
    </linearGradient>
  </defs>
  <style>
    @keyframes wrenchPaw {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(-20deg); }
    }
    .paw-tool { animation: wrenchPaw 1.4s ease-in-out infinite; transform-origin: 105px 115px; }
  </style>

  <!-- Yellow Engineer Cap on Cat -->
  <path d="M 60 52 Q 80 40 100 52 Z" fill="#eab308"/>
  <circle cx="80" cy="80" r="34" fill="url(#cat-grad)" stroke="#ea580c" stroke-width="2"/>
  <polygon points="45,45 60,75 35,75" fill="#f97316"/>
  <polygon points="115,45 125,75 100,75" fill="#f97316"/>
  <!-- Focused eyes -->
  <circle cx="68" cy="74" r="5" fill="#1e1b4b"/>
  <circle cx="70" cy="72" r="2" fill="#ffffff"/>
  <circle cx="92" cy="74" r="5" fill="#1e1b4b"/>
  <circle cx="94" cy="72" r="2" fill="#ffffff"/>

  <!-- Body -->
  <ellipse cx="80" cy="116" rx="36" ry="24" fill="url(#cat-grad)" stroke="#ea580c" stroke-width="2"/>

  <!-- Paw with Wrench -->
  <g class="paw-tool">
    <ellipse cx="105" cy="115" rx="7" ry="6" fill="#fed7aa" stroke="#ea580c" stroke-width="2"/>
    <line x1="105" y1="115" x2="128" y2="95" stroke="#94a3b8" stroke-width="4.5" stroke-linecap="round"/>
    <circle cx="128" cy="95" r="5" fill="none" stroke="#64748b" stroke-width="3"/>
  </g>
</svg>