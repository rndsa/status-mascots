<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <linearGradient id="cat-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fed7aa"/>
      <stop offset="100%" stop-color="#fb923c"/>
    </linearGradient>
  </defs>
  <style>
    @keyframes earTwitch {
      0%, 100% { transform: rotate(0deg); }
      15% { transform: rotate(-8deg); }
      30% { transform: rotate(0deg); }
    }
    @keyframes tailSway {
      0%, 100% { transform: rotate(-8deg); }
      50% { transform: rotate(18deg); }
    }
    @keyframes fishFloat {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      50% { transform: translateY(-8px) rotate(-8deg); }
    }
    .ear-l { animation: earTwitch 3.5s infinite; transform-origin: 45px 70px; }
    .cat-tail { animation: tailSway 2s ease-in-out infinite; transform-origin: 115px 125px; }
    .fish-snack { animation: fishFloat 2.6s ease-in-out infinite; transform-origin: 35px 55px; }
  </style>

  <!-- Tail -->
  <path d="M 115 125 Q 142 110 135 85" fill="none" stroke="#ea580c" stroke-width="7" stroke-linecap="round" class="cat-tail"/>

  <!-- Body -->
  <ellipse cx="80" cy="116" rx="36" ry="24" fill="url(#cat-grad)" stroke="#ea580c" stroke-width="2"/>

  <!-- Head -->
  <g>
    <!-- Ears -->
    <polygon points="45,45 60,75 35,75" fill="#f97316" class="ear-l"/>
    <polygon points="47,50 56,72 38,72" fill="#fed7aa"/>
    <polygon points="115,45 125,75 100,75" fill="#f97316"/>
    <polygon points="113,50 122,72 104,72" fill="#fed7aa"/>

    <circle cx="80" cy="80" r="34" fill="url(#cat-grad)" stroke="#ea580c" stroke-width="2"/>

    <!-- Happy Eyes (^ ^) -->
    <path d="M 60 76 Q 67 68 74 76" fill="none" stroke="#7c2d12" stroke-width="3" stroke-linecap="round"/>
    <path d="M 86 76 Q 93 68 100 76" fill="none" stroke="#7c2d12" stroke-width="3" stroke-linecap="round"/>

    <!-- Pink Nose -->
    <polygon points="80,82 77,80 83,80" fill="#f43f5e"/>
    <!-- :3 Mouth -->
    <path d="M 74 85 Q 77 89 80 85 Q 83 89 86 85" fill="none" stroke="#7c2d12" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Whiskers -->
    <line x1="42" y1="78" x2="56" y2="80" stroke="#c2410c" stroke-width="1.8"/>
    <line x1="40" y1="84" x2="56" y2="83" stroke="#c2410c" stroke-width="1.8"/>
    <line x1="118" y1="78" x2="104" y2="80" stroke="#c2410c" stroke-width="1.8"/>
    <line x1="120" y1="84" x2="104" y2="83" stroke="#c2410c" stroke-width="1.8"/>

    <!-- Cheeks -->
    <ellipse cx="58" cy="85" rx="5" ry="3" fill="#f43f5e" opacity="0.6"/>
    <ellipse cx="102" cy="85" rx="5" ry="3" fill="#f43f5e" opacity="0.6"/>
  </g>

  <!-- Paws -->
  <circle cx="68" cy="132" r="7" fill="#fed7aa" stroke="#ea580c" stroke-width="2"/>
  <circle cx="92" cy="132" r="7" fill="#fed7aa" stroke="#ea580c" stroke-width="2"/>

  <!-- Floating Fish Treat -->
  <g class="fish-snack">
    <path d="M 28 55 Q 36 48 42 55 Q 36 62 28 55 Z" fill="#38bdf8"/>
    <polygon points="42,55 48,50 48,60" fill="#38bdf8"/>
    <circle cx="32" cy="54" r="1" fill="#0f172a"/>
  </g>
</svg>