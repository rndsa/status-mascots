<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <linearGradient id="cat-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fed7aa"/>
      <stop offset="100%" stop-color="#fb923c"/>
    </linearGradient>
  </defs>
  <style>
    @keyframes ear-twitch { 0%, 100% { transform: rotate(0deg); } 20% { transform: rotate(-8deg); } 40% { transform: rotate(0deg); } }
    @keyframes tail-wag { 0%, 100% { transform: rotate(-10deg); } 50% { transform: rotate(15deg); } }
    .cat-head { animation: ear-twitch 3s ease-in-out infinite; transform-origin: 80px 100px; }
    .tail { animation: tail-wag 2s ease-in-out infinite; transform-origin: 120px 125px; }
  </style>
  <g>
    <!-- Tail -->
    <path d="M 115 125 Q 140 115 135 90" fill="none" stroke="#ea580c" stroke-width="7" stroke-linecap="round" class="tail"/>
    <!-- Body -->
    <ellipse cx="80" cy="115" rx="36" ry="26" fill="url(#cat-grad)" stroke="#ea580c" stroke-width="2"/>
    <!-- Head -->
    <g class="cat-head">
      <!-- Ears -->
      <polygon points="45,45 60,75 35,75" fill="#f97316"/>
      <polygon points="46,50 56,72 38,72" fill="#fed7aa"/>
      <polygon points="115,45 125,75 100,75" fill="#f97316"/>
      <polygon points="114,50 122,72 104,72" fill="#fed7aa"/>
      <!-- Head Circle -->
      <circle cx="80" cy="80" r="34" fill="url(#cat-grad)" stroke="#ea580c" stroke-width="2"/>
      <!-- Happy Cat Eyes (Arc ^ ^) -->
      <path d="M 60 76 Q 67 68 74 76" fill="none" stroke="#7c2d12" stroke-width="3" stroke-linecap="round"/>
      <path d="M 86 76 Q 93 68 100 76" fill="none" stroke="#7c2d12" stroke-width="3" stroke-linecap="round"/>
      <!-- Pink Nose -->
      <polygon points="80,82 77,80 83,80" fill="#f43f5e"/>
      <!-- Cat :3 mouth -->
      <path d="M 74 85 Q 77 89 80 85 Q 83 89 86 85" fill="none" stroke="#7c2d12" stroke-width="2.5" stroke-linecap="round"/>
      <!-- Whiskers -->
      <line x1="42" y1="78" x2="56" y2="80" stroke="#c2410c" stroke-width="2"/>
      <line x1="40" y1="84" x2="56" y2="83" stroke="#c2410c" stroke-width="2"/>
      <line x1="118" y1="78" x2="104" y2="80" stroke="#c2410c" stroke-width="2"/>
      <line x1="120" y1="84" x2="104" y2="83" stroke="#c2410c" stroke-width="2"/>
      <!-- Blush -->
      <ellipse cx="58" cy="85" rx="5" ry="3" fill="#f43f5e" opacity="0.6"/>
      <ellipse cx="102" cy="85" rx="5" ry="3" fill="#f43f5e" opacity="0.6"/>
    </g>
    <!-- Paws in front -->
    <circle cx="68" cy="132" r="7" fill="#fed7aa" stroke="#ea580c" stroke-width="2"/>
    <circle cx="92" cy="132" r="7" fill="#fed7aa" stroke="#ea580c" stroke-width="2"/>
  </g>
</svg>