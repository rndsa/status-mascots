<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <linearGradient id="cat-fur-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fdba74"/>
      <stop offset="100%" stop-color="#fb923c"/>
    </linearGradient>
    <filter id="cat-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#020617" flood-opacity="0.25"/>
    </filter>
  </defs>
  <style>
    @keyframes catBob {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-7px) rotate(1.5deg); }
    }
    @keyframes earTwitchL {
      0%, 90%, 100% { transform: rotate(0deg); }
      93% { transform: rotate(-8deg); }
      96% { transform: rotate(4deg); }
    }
    @keyframes eyeBlink {
      0%, 92%, 100% { transform: scaleY(1); }
      96% { transform: scaleY(0.1); }
    }
    .head-cat { animation: catBob 3s ease-in-out infinite; transform-origin: 80px 145px; }
    .ear-l { animation: earTwitchL 3s infinite; transform-origin: 45px 50px; }
    .blink-eye { animation: eyeBlink 3.6s infinite; transform-origin: 62px 85px; }
  </style>

  <ellipse cx="80" cy="148" rx="34" ry="6" fill="#000000" opacity="0.18"/>

  <g class="head-cat">
    <!-- Left Cat Ear -->
    <g class="ear-l">
      <polygon points="36,60 48,22 72,50" fill="#f97316" stroke="#ea580c" stroke-width="2"/>
      <polygon points="42,54 50,30 66,48" fill="#fbcfe8"/>
    </g>

    <!-- Right Cat Ear -->
    <g>
      <polygon points="124,60 112,22 88,50" fill="#f97316" stroke="#ea580c" stroke-width="2"/>
      <polygon points="118,54 110,30 94,48" fill="#fbcfe8"/>
    </g>

    <!-- Cat Head Base (Chibi Round Squircle) -->
    <rect x="28" y="44" width="104" height="88" rx="44" fill="url(#cat-fur-grad)" stroke="#ea580c" stroke-width="2.5" filter="url(#cat-shadow)"/>

    <!-- Left Cheek Whiskers -->
    <line x1="20" y1="84" x2="38" y2="86" stroke="#c2410c" stroke-width="2" stroke-linecap="round"/>
    <line x1="18" y1="94" x2="36" y2="92" stroke="#c2410c" stroke-width="2" stroke-linecap="round"/>

    <!-- Right Cheek Whiskers -->
    <line x1="140" y1="84" x2="122" y2="86" stroke="#c2410c" stroke-width="2" stroke-linecap="round"/>
    <line x1="142" y1="94" x2="124" y2="92" stroke="#c2410c" stroke-width="2" stroke-linecap="round"/>

    <!-- Left Eye (Big Kawaii Pupil) -->
    <g class="blink-eye">
      <ellipse cx="62" cy="84" rx="8" ry="11" fill="#431407"/>
      <circle cx="65" cy="80" r="3.5" fill="#ffffff"/>
      <circle cx="60" cy="89" r="1.8" fill="#ffffff"/>
    </g>

    <!-- Right Eye (Playful Wink Arc) -->
    <path d="M 88 85 Q 98 72 108 85" fill="none" stroke="#431407" stroke-width="4.5" stroke-linecap="round"/>

    <!-- Tiny Pink Nose -->
    <polygon points="80,91 76,87 84,87" fill="#f43f5e"/>

    <!-- Cat Mouth (:3) -->
    <path d="M 72 94 Q 76 98 80 94 Q 84 98 88 94" fill="none" stroke="#431407" stroke-width="2.8" stroke-linecap="round"/>

    <!-- Pink Kawaii Blushes -->
    <ellipse cx="48" cy="96" rx="7" ry="4" fill="#f43f5e" opacity="0.6"/>
    <ellipse cx="112" cy="96" rx="7" ry="4" fill="#f43f5e" opacity="0.6"/>
  </g>
</svg>