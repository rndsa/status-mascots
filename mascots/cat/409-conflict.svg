<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <linearGradient id="cat-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fed7aa"/>
      <stop offset="100%" stop-color="#fb923c"/>
    </linearGradient>
  </defs>
  <style>
    @keyframes hissShake {
      0%, 100% { transform: rotate(0deg); }
      20% { transform: rotate(-10deg); }
      40% { transform: rotate(8deg); }
      60% { transform: rotate(-6deg); }
      80% { transform: rotate(4deg); }
    }
    .head-hiss { animation: hissShake 0.85s ease-in-out infinite; transform-origin: 80px 110px; }
  </style>

  <g class="head-hiss">
    <polygon points="35,60 55,75 35,80" fill="#f97316"/>
    <polygon points="125,60 105,75 125,80" fill="#f97316"/>
    <circle cx="80" cy="80" r="34" fill="url(#cat-grad)" stroke="#ef4444" stroke-width="2.5"/>
    <!-- Squeezed Hissing Eyes (> <) -->
    <line x1="58" y1="72" x2="70" y2="80" stroke="#ef4444" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="70" y1="72" x2="58" y2="80" stroke="#ef4444" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="90" y1="72" x2="102" y2="80" stroke="#ef4444" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="102" y1="72" x2="90" y2="80" stroke="#ef4444" stroke-width="3.5" stroke-linecap="round"/>
    <!-- Open Mouth with Fangs -->
    <path d="M 72 87 Q 80 84 88 87 Q 80 96 72 87 Z" fill="#991b1b"/>
    <polygon points="76,87 78,90 80,87" fill="#ffffff"/>
    <polygon points="82,87 84,90 86,87" fill="#ffffff"/>
    <!-- Sweat drop -->
    <path d="M 115 50 Q 120 56 115 60 Q 110 56 115 50 Z" fill="#38bdf8"/>
  </g>

  <ellipse cx="80" cy="120" rx="34" ry="22" fill="url(#cat-grad)" stroke="#ea580c" stroke-width="2"/>
  <ellipse cx="62" cy="125" rx="8" ry="7" fill="#fed7aa" stroke="#ef4444" stroke-width="2"/>
  <ellipse cx="98" cy="125" rx="8" ry="7" fill="#fed7aa" stroke="#ef4444" stroke-width="2"/>
</svg>