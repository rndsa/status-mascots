<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <linearGradient id="cat-fur-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fdba74"/>
      <stop offset="100%" stop-color="#fb923c"/>
    </linearGradient>
    <filter id="cat-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#020617" flood-opacity="0.25"/>
    </filter>
  </defs>
  <style>
    @keyframes shockCat {
      0%, 100% { transform: rotate(0deg); }
      15% { transform: rotate(-8deg); }
      30% { transform: rotate(8deg); }
      45% { transform: rotate(-6deg); }
      60% { transform: rotate(5deg); }
      75% { transform: rotate(-3deg); }
    }
    @keyframes sweatFall {
      0% { transform: translateY(0); opacity: 0; }
      50% { opacity: 1; }
      100% { transform: translateY(18px); opacity: 0; }
    }
    .head-shock { animation: shockCat 0.75s ease-in-out infinite; transform-origin: 80px 145px; }
    .sweat-drop { animation: sweatFall 1.2s infinite; }
  </style>

  <ellipse cx="80" cy="148" rx="34" ry="6" fill="#000000" opacity="0.18"/>

  <g class="head-shock">
    <polygon points="36,60 48,22 72,50" fill="#f97316" stroke="#ea580c" stroke-width="2"/>
    <polygon points="42,54 50,30 66,48" fill="#fbcfe8"/>
    <polygon points="124,60 112,22 88,50" fill="#f97316" stroke="#ea580c" stroke-width="2"/>
    <polygon points="118,54 110,30 94,48" fill="#fbcfe8"/>

    <rect x="28" y="44" width="104" height="88" rx="44" fill="url(#cat-fur-grad)" stroke="#ef4444" stroke-width="2.5" filter="url(#cat-shadow)"/>

    <!-- Angry Squeezed X Eyes (> <) -->
    <path d="M 52 76 L 64 84 L 52 92" fill="none" stroke="#ef4444" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 108 76 L 96 84 L 108 92" fill="none" stroke="#ef4444" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>

    <polygon points="80,91 76,87 84,87" fill="#ef4444"/>
    <!-- Panicked quivering mouth -->
    <path d="M 72 96 Q 76 91 80 96 Q 84 101 88 96" fill="none" stroke="#ef4444" stroke-width="3" stroke-linecap="round"/>

    <!-- Giant Anime Sweat Drop -->
    <g class="sweat-drop" transform="translate(122, 60)">
      <path d="M 0 -8 Q 6 0 0 5 Q -6 0 0 -8 Z" fill="#38bdf8"/>
    </g>
  </g>
</svg>