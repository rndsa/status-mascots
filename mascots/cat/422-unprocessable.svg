<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <linearGradient id="cat-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fed7aa"/>
      <stop offset="100%" stop-color="#fb923c"/>
    </linearGradient>
  </defs>
  <style>
    @keyframes chaseTail {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    .tail-spin { animation: chaseTail 1.2s linear infinite; transform-origin: 80px 80px; }
  </style>

  <g class="tail-spin">
    <circle cx="80" cy="80" r="32" fill="url(#cat-grad)" stroke="#a855f7" stroke-width="2.5"/>
    <circle cx="72" cy="74" r="5" fill="#a855f7"/>
    <circle cx="88" cy="74" r="5" fill="#a855f7"/>
    <path d="M 76 86 Q 80 82 84 86" fill="none" stroke="#a855f7" stroke-width="2"/>
    <!-- Tail chasing curve -->
    <path d="M 112 80 C 120 110 80 120 70 112" fill="none" stroke="#ea580c" stroke-width="7" stroke-linecap="round"/>
  </g>
</svg>