<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <linearGradient id="cat-fur-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fdba74"/>
      <stop offset="100%" stop-color="#fb923c"/>
    </linearGradient>
    <filter id="cat-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#020617" flood-opacity="0.25"/>
    </filter>
  </defs>
  <style>
    @keyframes tiltCat {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(-15deg); }
    }
    @keyframes qmarkBob {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-7px) rotate(4deg); }
    }
    .head-tilt { animation: tiltCat 2.6s ease-in-out infinite; transform-origin: 80px 145px; }
    .qmark-box { animation: qmarkBob 2s ease-in-out infinite; transform-origin: 130px 30px; }
  </style>

  <ellipse cx="80" cy="148" rx="34" ry="6" fill="#000000" opacity="0.18"/>

  <g class="qmark-box">
    <ellipse cx="130" cy="30" rx="14" ry="14" fill="#141722" stroke="#f97316" stroke-width="2"/>
    <text x="130" y="38" font-family="-apple-system, sans-serif" font-size="20" font-weight="900" fill="#f97316" text-anchor="middle">?</text>
  </g>

  <g class="head-tilt">
    <polygon points="36,60 48,22 72,50" fill="#f97316" stroke="#ea580c" stroke-width="2"/>
    <polygon points="42,54 50,30 66,48" fill="#fbcfe8"/>
    <polygon points="124,60 112,22 88,50" fill="#f97316" stroke="#ea580c" stroke-width="2"/>
    <polygon points="118,54 110,30 94,48" fill="#fbcfe8"/>

    <rect x="28" y="44" width="104" height="88" rx="44" fill="url(#cat-fur-grad)" stroke="#ea580c" stroke-width="2.5" filter="url(#cat-shadow)"/>

    <line x1="20" y1="84" x2="38" y2="86" stroke="#c2410c" stroke-width="2" stroke-linecap="round"/>
    <line x1="18" y1="94" x2="36" y2="92" stroke="#c2410c" stroke-width="2" stroke-linecap="round"/>
    <line x1="140" y1="84" x2="122" y2="86" stroke="#c2410c" stroke-width="2" stroke-linecap="round"/>
    <line x1="142" y1="94" x2="124" y2="92" stroke="#c2410c" stroke-width="2" stroke-linecap="round"/>

    <!-- Puzzled Eyes: Left spiral @, Right dot . -->
    <path d="M 62 80 A 4 4 0 1 1 58 84 A 7 7 0 1 1 67 82" fill="none" stroke="#431407" stroke-width="2.8" stroke-linecap="round"/>
    <ellipse cx="98" cy="84" rx="6" ry="8" fill="#431407"/>
    <circle cx="100" cy="82" r="2.2" fill="#ffffff"/>

    <polygon points="80,91 76,87 84,87" fill="#f43f5e"/>
    <circle cx="80" cy="98" r="4.5" fill="#431407"/>
  </g>
</svg>