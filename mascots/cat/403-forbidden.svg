<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <linearGradient id="cat-fur-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fdba74"/>
      <stop offset="100%" stop-color="#fb923c"/>
    </linearGradient>
    <filter id="cat-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#020617" flood-opacity="0.25"/>
    </filter>
  </defs>
  <style>
    @keyframes airplaneVibe {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-4px); }
    }
    .head-airplane { animation: airplaneVibe 2s ease-in-out infinite; }
  </style>

  <ellipse cx="80" cy="148" rx="34" ry="6" fill="#000000" opacity="0.18"/>

  <g class="head-airplane">
    <!-- Flattened Airplane Ears (Marah/Waspada) -->
    <polygon points="20,62 14,44 54,58" fill="#f97316" stroke="#ea580c" stroke-width="2"/>
    <polygon points="140,62 146,44 106,58" fill="#f97316" stroke="#ea580c" stroke-width="2"/>

    <rect x="28" y="44" width="104" height="88" rx="44" fill="url(#cat-fur-grad)" stroke="#ef4444" stroke-width="2.5" filter="url(#cat-shadow)"/>

    <!-- Slit Stern Eyes (- -) -->
    <ellipse cx="62" cy="82" rx="7" ry="2" fill="#ef4444"/>
    <ellipse cx="98" cy="82" rx="7" ry="2" fill="#ef4444"/>

    <polygon points="80,91 76,87 84,87" fill="#ef4444"/>
    <line x1="74" y1="97" x2="86" y2="97" stroke="#ef4444" stroke-width="3" stroke-linecap="round"/>
  </g>
  <line x1="24" y1="140" x2="136" y2="140" stroke="#ef4444" stroke-width="2" stroke-dasharray="6 3"/>
</svg>