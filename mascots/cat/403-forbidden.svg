<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <linearGradient id="cat-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fed7aa"/>
      <stop offset="100%" stop-color="#fb923c"/>
    </linearGradient>
  </defs>
  <style>
    @keyframes hissArch {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-6px) scaleY(1.05); }
    }
    @keyframes sprayMist {
      0%, 100% { opacity: 0; transform: translateX(0); }
      50% { opacity: 0.9; transform: translateX(12px); }
    }
    .cat-arch { animation: hissArch 1.8s ease-in-out infinite; transform-origin: center bottom; }
    .mist { animation: sprayMist 1.5s infinite; }
  </style>

  <!-- Water Spray Bottle -->
  <rect x="25" y="65" width="14" height="26" rx="3" fill="#3b82f6"/>
  <path d="M 32 65 L 32 55 L 42 55 L 42 58" fill="none" stroke="#1d4ed8" stroke-width="3"/>
  <circle cx="28" cy="58" r="4" fill="#1d4ed8"/>
  <!-- Mist spray droplets -->
  <g class="mist">
    <circle cx="48" cy="54" r="2.5" fill="#38bdf8"/>
    <circle cx="56" cy="52" r="3" fill="#38bdf8"/>
    <circle cx="53" cy="59" r="2" fill="#38bdf8"/>
  </g>

  <!-- Cat Hissing with Back Arched -->
  <g class="cat-arch">
    <!-- Airplane Ears Flat -->
    <polygon points="75,55 90,70 75,75" fill="#f97316"/>
    <polygon points="135,55 120,70 135,75" fill="#f97316"/>
    <circle cx="105" cy="78" r="28" fill="url(#cat-grad)" stroke="#ef4444" stroke-width="2.5"/>
    <!-- Angry Eyes (> <) -->
    <line x1="92" y1="72" x2="100" y2="80" stroke="#ef4444" stroke-width="3"/>
    <line x1="100" y1="72" x2="92" y2="80" stroke="#ef4444" stroke-width="3"/>
    <line x1="110" y1="72" x2="118" y2="80" stroke="#ef4444" stroke-width="3"/>
    <line x1="118" y1="72" x2="110" y2="80" stroke="#ef4444" stroke-width="3"/>
    <!-- Open Mouth with Fangs -->
    <path d="M 100 86 Q 105 83 110 86 Q 105 93 100 86 Z" fill="#991b1b"/>
  </g>
</svg>