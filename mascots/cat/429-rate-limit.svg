<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <linearGradient id="cat-fur-hot" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fed7aa"/>
      <stop offset="100%" stop-color="#fb923c"/>
    </linearGradient>
  </defs>
  <style>
    @keyframes pantingBreath {
      0%, 100% { transform: scale(1, 1); }
      50% { transform: scale(1.05, 0.95); }
    }
    .head-pant { animation: pantingBreath 0.5s ease-in-out infinite; transform-origin: 80px 145px; }
  </style>

  <ellipse cx="80" cy="148" rx="34" ry="6" fill="#000000" opacity="0.18"/>

  <g class="head-pant">
    <polygon points="36,60 48,22 72,50" fill="#f97316"/>
    <polygon points="124,60 112,22 88,50" fill="#f97316"/>

    <rect x="28" y="44" width="104" height="88" rx="44" fill="url(#cat-fur-hot)" stroke="#ea580c" stroke-width="2.5"/>

    <!-- Exhausted spiral eyes -->
    <path d="M 62 82 A 3 3 0 1 1 58 85 A 5 5 0 1 1 65 83" fill="none" stroke="#ea580c" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 98 82 A 3 3 0 1 1 94 85 A 5 5 0 1 1 101 83" fill="none" stroke="#ea580c" stroke-width="2.5" stroke-linecap="round"/>

    <polygon points="80,91 76,87 84,87" fill="#ea580c"/>

    <!-- Panting mouth with pink tongue out :P -->
    <ellipse cx="80" cy="98" rx="6" ry="5" fill="#ea580c"/>
    <path d="M 78 100 Q 80 108 82 100 Z" fill="#f43f5e"/>

    <ellipse cx="48" cy="94" rx="7" ry="4" fill="#f97316" opacity="0.7"/>
    <ellipse cx="112" cy="94" rx="7" ry="4" fill="#f97316" opacity="0.7"/>
  </g>
  <text x="80" y="146" font-family="monospace" font-size="10" font-weight="bold" fill="#ea580c" text-anchor="middle">OVERHEAT 429</text>
</svg>