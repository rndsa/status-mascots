<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <linearGradient id="cat-fur-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fdba74"/>
      <stop offset="100%" stop-color="#fb923c"/>
    </linearGradient>
    <filter id="cat-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#020617" flood-opacity="0.25"/>
    </filter>
  </defs>
  <style>
    @keyframes lookLR {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-6px); }
      75% { transform: translateX(6px); }
    }
    .eyes-roam { animation: lookLR 2.6s ease-in-out infinite; }
  </style>

  <ellipse cx="80" cy="148" rx="34" ry="6" fill="#000000" opacity="0.18"/>

  <g>
    <!-- Detective Hat on top of cat head -->
    <path d="M 44 44 C 44 26 116 26 116 44 Z" fill="#78350f"/>
    <ellipse cx="80" cy="44" rx="42" ry="6" fill="#92400e"/>

    <polygon points="36,60 48,22 72,50" fill="#f97316" stroke="#ea580c" stroke-width="2"/>
    <polygon points="124,60 112,22 88,50" fill="#f97316" stroke="#ea580c" stroke-width="2"/>

    <rect x="28" y="44" width="104" height="88" rx="44" fill="url(#cat-fur-grad)" stroke="#ea580c" stroke-width="2.5" filter="url(#cat-shadow)"/>

    <!-- Roaming Cat Eyes looking for 404 -->
    <g class="eyes-roam">
      <ellipse cx="62" cy="84" rx="7" ry="9" fill="#431407"/>
      <circle cx="64" cy="81" r="2.5" fill="#ffffff"/>

      <ellipse cx="98" cy="84" rx="7" ry="9" fill="#431407"/>
      <circle cx="100" cy="81" r="2.5" fill="#ffffff"/>
    </g>

    <polygon points="80,91 76,87 84,87" fill="#f43f5e"/>
    <ellipse cx="80" cy="98" rx="3.5" ry="4.5" fill="#431407"/>
  </g>
  <text x="80" y="146" font-family="monospace" font-size="10" font-weight="bold" fill="#64748b" text-anchor="middle">SEARCHING (404)</text>
</svg>