<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <linearGradient id="jelly-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#6ee7b7"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="jelly-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#ef4444" flood-opacity="0.3"/>
    </filter>
  </defs>
  <style>
    @keyframes jellyNoShake {
      0%, 100% { transform: rotate(0deg); }
      20% { transform: rotate(-10deg); }
      40% { transform: rotate(10deg); }
      60% { transform: rotate(-7deg); }
      80% { transform: rotate(7deg); }
    }
    .head-no { animation: jellyNoShake 1.4s ease-in-out infinite; transform-origin: 80px 145px; }
  </style>

  <ellipse cx="80" cy="148" rx="34" ry="6" fill="#000000" opacity="0.18"/>

  <g class="head-no">
    <!-- Red padlock above jelly head -->
    <rect x="72" y="16" width="16" height="13" rx="3" fill="#ef4444"/>
    <path d="M 75 16 L 75 11 C 75 6 85 6 85 11 L 85 16" fill="none" stroke="#ef4444" stroke-width="2.5" stroke-linecap="round"/>

    <path d="M 32 85 C 32 46 54 32 80 32 C 106 32 128 46 128 85 C 128 118 116 130 96 130 C 84 130 80 124 74 124 C 68 124 64 130 52 130 C 36 130 32 118 32 85 Z" 
          fill="url(#jelly-grad)" stroke="#ef4444" stroke-width="2.5" filter="url(#jelly-glow)"/>

    <path d="M 44 46 Q 80 36 112 46 Q 102 54 48 54 Z" fill="#ffffff" opacity="0.35"/>

    <!-- Squinting warning eyes -->
    <line x1="52" y1="80" x2="68" y2="80" stroke="#ef4444" stroke-width="3.8" stroke-linecap="round"/>
    <line x1="92" y1="80" x2="108" y2="80" stroke="#ef4444" stroke-width="3.8" stroke-linecap="round"/>

    <!-- Wavy denying mouth -->
    <path d="M 72 94 Q 76 90 80 94 Q 84 98 88 94" fill="none" stroke="#ef4444" stroke-width="3" stroke-linecap="round"/>
  </g>
</svg>