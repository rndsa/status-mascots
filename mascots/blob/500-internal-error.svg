<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <linearGradient id="jelly-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#6ee7b7"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
  </defs>
  <style>
    @keyframes terrorShiver {
      0%, 100% { transform: translate(0, 0); }
      20% { transform: translate(-3px, 2px); }
      40% { transform: translate(3px, -2px); }
      60% { transform: translate(-2px, -2px); }
      80% { transform: translate(2px, 2px); }
    }
    @keyframes sparkFlick {
      0%, 100% { opacity: 0; }
      50% { opacity: 1; }
    }
    .head-terror { animation: terrorShiver 0.25s infinite; transform-origin: 80px 145px; }
    .sparks { animation: sparkFlick 0.3s infinite; }
  </style>

  <ellipse cx="80" cy="148" rx="34" ry="6" fill="#000000" opacity="0.18"/>

  <!-- Sparks -->
  <g class="sparks">
    <polyline points="24,36 32,48 26,52 36,66" fill="none" stroke="#facc15" stroke-width="2.5" stroke-linecap="round"/>
    <polyline points="136,36 128,48 134,52 124,66" fill="none" stroke="#facc15" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <g class="head-terror">
    <path d="M 32 85 C 32 46 54 32 80 32 C 106 32 128 46 128 85 C 128 118 116 130 96 130 C 84 130 80 124 74 124 C 68 124 64 130 52 130 C 36 130 32 118 32 85 Z" 
          fill="url(#jelly-grad)" stroke="#ef4444" stroke-width="2.5"/>

    <!-- Wide Spooked Eyes O_O -->
    <ellipse cx="62" cy="80" rx="9" ry="12" fill="#ef4444"/>
    <circle cx="64" cy="77" r="3" fill="#ffffff"/>

    <ellipse cx="98" cy="80" rx="9" ry="12" fill="#ef4444"/>
    <circle cx="100" cy="77" r="3" fill="#ffffff"/>

    <!-- Screaming open mouth -->
    <ellipse cx="80" cy="100" rx="9" ry="12" fill="#064e3b"/>
  </g>
  <text x="80" y="146" font-family="monospace" font-size="10" font-weight="bold" fill="#ef4444" text-anchor="middle">CRASH (500)</text>
</svg>