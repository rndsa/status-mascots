<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <linearGradient id="blob-splat" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
  </defs>
  <style>
    @keyframes puddleJiggle {
      0%, 100% { transform: scaleY(1); }
      50% { transform: scaleY(0.88); }
    }
    .puddle { animation: puddleJiggle 1.6s infinite; transform-origin: center bottom; }
  </style>

  <g class="puddle">
    <path d="M 25 125 C 20 120 30 100 50 105 C 70 95 90 95 110 105 C 130 100 140 120 135 125 C 120 135 40 135 25 125 Z" fill="url(#blob-splat)" stroke="#334155" stroke-width="2.5"/>
    <line x1="62" y1="108" x2="72" y2="116" stroke="#ef4444" stroke-width="2.5"/>
    <line x1="72" y1="108" x2="62" y2="116" stroke="#ef4444" stroke-width="2.5"/>
    <line x1="88" y1="108" x2="98" y2="116" stroke="#ef4444" stroke-width="2.5"/>
    <line x1="98" y1="108" x2="88" y2="116" stroke="#ef4444" stroke-width="2.5"/>
    <text x="80" y="145" font-family="monospace" font-size="11" font-weight="bold" fill="#ef4444" text-anchor="middle">SPLATTERED (500)</text>
  </g>
</svg>