<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <linearGradient id="blob-purple" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#7e22ce"/>
    </linearGradient>
  </defs>
  <style>
    @keyframes pixelGlitch {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(0.97, 1.03) translate(-2px, 1px); }
    }
    .px-glitch { animation: pixelGlitch 0.4s infinite; }
  </style>

  <g class="px-glitch">
    <path d="M 45 115 C 35 115 35 90 48 70 C 60 50 100 50 112 70 C 125 90 125 115 115 115 C 95 125 65 125 45 115 Z" fill="url(#blob-purple)" stroke="#581c87" stroke-width="2.5"/>
    <!-- Pixel blocks on jelly surface -->
    <rect x="60" y="65" width="8" height="8" fill="#ffffff" opacity="0.6"/>
    <rect x="68" y="73" width="8" height="8" fill="#ffffff" opacity="0.6"/>
    <rect x="85" y="65" width="8" height="8" fill="#ffffff" opacity="0.6"/>
    <!-- Glitched eyes -->
    <rect x="62" y="84" width="10" height="4" fill="#ffffff"/>
    <rect x="88" y="84" width="10" height="4" fill="#ffffff"/>
  </g>
</svg>