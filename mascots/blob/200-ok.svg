<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <linearGradient id="jelly-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#6ee7b7"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="jelly-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#059669" flood-opacity="0.3"/>
    </filter>
  </defs>
  <style>
    @keyframes jellyBreathe {
      0%, 100% { transform: scale(1, 1); }
      50% { transform: scale(1.04, 0.96) translateY(3px); }
    }
    @keyframes leafFlutter {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(12deg); }
    }
    @keyframes eyeBlink {
      0%, 92%, 100% { transform: scaleY(1); }
      96% { transform: scaleY(0.1); }
    }
    .head-jelly { animation: jellyBreathe 2.8s ease-in-out infinite; transform-origin: 80px 130px; }
    .sprout-leaf { animation: leafFlutter 2s ease-in-out infinite; transform-origin: 80px 32px; }
    .blink-eye { animation: eyeBlink 3.6s infinite; transform-origin: 62px 82px; }
  </style>

  <ellipse cx="80" cy="148" rx="34" ry="6" fill="#000000" opacity="0.18"/>

  <g class="head-jelly">
    <!-- Sprout on top of Jelly -->
    <g class="sprout-leaf">
      <path d="M 80 32 Q 78 20 72 16 Q 84 18 80 32" fill="#10b981"/>
      <path d="M 80 32 Q 84 22 92 18 Q 86 28 80 32" fill="#34d399"/>
    </g>

    <!-- Translucent Slime Dome -->
    <path d="M 32 85 C 32 46 54 32 80 32 C 106 32 128 46 128 85 C 128 118 116 130 96 130 C 84 130 80 124 74 124 C 68 124 64 130 52 130 C 36 130 32 118 32 85 Z" 
          fill="url(#jelly-grad)" stroke="#10b981" stroke-width="2.5" filter="url(#jelly-glow)"/>

    <!-- Glossy Specular Highlight on Dome -->
    <path d="M 44 46 Q 80 36 112 46 Q 102 54 48 54 Z" fill="#ffffff" opacity="0.35"/>
    <ellipse cx="44" cy="62" rx="4" ry="7" fill="#ffffff" opacity="0.25" transform="rotate(-20 44 62)"/>

    <!-- Floating inner bubbles -->
    <circle cx="50" cy="108" r="4" fill="#ffffff" opacity="0.25"/>
    <circle cx="106" cy="112" r="3" fill="#ffffff" opacity="0.25"/>

    <!-- Left Eye (Big Anime Pupil) -->
    <g class="blink-eye">
      <ellipse cx="62" cy="82" rx="8" ry="11" fill="#064e3b"/>
      <circle cx="65" cy="78" r="3.5" fill="#ffffff"/>
      <circle cx="60" cy="87" r="1.8" fill="#ffffff"/>
    </g>

    <!-- Right Eye (Cheerful Wink Arc) -->
    <path d="M 88 84 Q 98 72 108 84" fill="none" stroke="#064e3b" stroke-width="4.5" stroke-linecap="round"/>

    <!-- Sweet Pink Cheeks -->
    <ellipse cx="48" cy="94" rx="7" ry="4" fill="#f43f5e" opacity="0.5"/>
    <ellipse cx="112" cy="94" rx="7" ry="4" fill="#f43f5e" opacity="0.5"/>

    <!-- Happy Smiling Mouth -->
    <path d="M 74 92 Q 80 100 86 92 Z" fill="#064e3b"/>
  </g>
</svg>