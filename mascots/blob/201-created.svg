<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <linearGradient id="jelly-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#6ee7b7"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="jelly-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#059669" flood-opacity="0.3"/>
    </filter>
  </defs>
  <style>
    @keyframes jellyJump {
      0%, 100% { transform: translateY(0) scale(1, 1); }
      30% { transform: translateY(6px) scale(1.12, 0.88); }
      55% { transform: translateY(-16px) scale(0.92, 1.08); }
      75% { transform: translateY(-2px) scale(1.03, 0.97); }
    }
    .head-jump { animation: jellyJump 1.8s cubic-bezier(0.28, 0.84, 0.42, 1) infinite; transform-origin: 80px 145px; }
  </style>

  <ellipse cx="80" cy="148" rx="34" ry="6" fill="#000000" opacity="0.18"/>

  <g class="head-jump">
    <!-- Party Hat -->
    <polygon points="80,14 66,38 94,38" fill="#f43f5e"/>
    <circle cx="80" cy="12" r="4.5" fill="#facc15"/>

    <path d="M 32 85 C 32 46 54 32 80 32 C 106 32 128 46 128 85 C 128 118 116 130 96 130 C 84 130 80 124 74 124 C 68 124 64 130 52 130 C 36 130 32 118 32 85 Z" 
          fill="url(#jelly-grad)" stroke="#10b981" stroke-width="2.5" filter="url(#jelly-glow)"/>

    <path d="M 44 46 Q 80 36 112 46 Q 102 54 48 54 Z" fill="#ffffff" opacity="0.35"/>

    <!-- Joyful Eyes (^ ^) -->
    <path d="M 52 82 Q 62 70 72 82" fill="none" stroke="#064e3b" stroke-width="4.5" stroke-linecap="round"/>
    <path d="M 88 82 Q 98 70 108 82" fill="none" stroke="#064e3b" stroke-width="4.5" stroke-linecap="round"/>

    <ellipse cx="48" cy="94" rx="7" ry="4" fill="#f43f5e" opacity="0.5"/>
    <ellipse cx="112" cy="94" rx="7" ry="4" fill="#f43f5e" opacity="0.5"/>

    <!-- Joyful Smile -->
    <path d="M 73 90 Q 80 102 87 90 Z" fill="#064e3b"/>
  </g>
</svg>