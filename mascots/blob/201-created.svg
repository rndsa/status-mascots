<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <linearGradient id="blob-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
  </defs>
  <style>
    @keyframes babyJump {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-14px) scale(0.9, 1.1); }
    }
    .baby-slime { animation: babyJump 1.4s cubic-bezier(0.34, 1.56, 0.64, 1) infinite; transform-origin: 120px 125px; }
  </style>

  <!-- Big Jelly -->
  <path d="M 35 115 C 28 115 28 92 38 75 C 50 55 85 55 95 75 C 105 92 105 115 95 115 C 80 123 50 123 35 115 Z" fill="url(#blob-grad)" stroke="#047857" stroke-width="2"/>
  <ellipse cx="55" cy="70" rx="10" ry="5" fill="#ffffff" opacity="0.5" transform="rotate(-30 55 70)"/>
  <circle cx="55" cy="88" r="4" fill="#064e3b"/>
  <circle cx="75" cy="88" r="4" fill="#064e3b"/>

  <!-- Tiny Baby Slime Bouncing with Joy -->
  <g class="baby-slime">
    <path d="M 108 120 C 102 120 102 106 108 96 C 114 84 132 84 138 96 C 144 106 144 120 138 120 C 130 125 116 125 108 120 Z" fill="#6ee7b7" stroke="#059669" stroke-width="1.8"/>
    <circle cx="118" cy="104" r="2.5" fill="#064e3b"/>
    <circle cx="128" cy="104" r="2.5" fill="#064e3b"/>
    <circle cx="123" cy="108" r="1.5" fill="#f43f5e"/>
  </g>
</svg>