<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <linearGradient id="blob-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
  </defs>
  <style>
    @keyframes sinkHole {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(12px); }
    }
    .sink { animation: sinkHole 2.5s ease-in-out infinite; }
  </style>

  <!-- Dark Hole on floor -->
  <ellipse cx="80" cy="120" rx="42" ry="12" fill="#0f172a" stroke="#334155" stroke-width="2"/>

  <!-- Slime sinking into hole -->
  <g class="sink">
    <path d="M 52 118 C 50 110 52 98 62 88 C 72 78 88 78 98 88 C 108 98 110 110 108 118 Z" fill="url(#blob-grad)"/>
    <!-- Peeking eyes -->
    <circle cx="72" cy="100" r="4.5" fill="#064e3b"/>
    <circle cx="74" cy="98" r="1.5" fill="#ffffff"/>
    <circle cx="88" cy="100" r="4.5" fill="#064e3b"/>
    <circle cx="90" cy="98" r="1.5" fill="#ffffff"/>
  </g>
  <text x="80" y="146" font-family="monospace" font-size="10" font-weight="bold" fill="#94a3b8" text-anchor="middle">404 SUNK</text>
</svg>