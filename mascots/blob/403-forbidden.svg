<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <linearGradient id="jelly-red-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fca5a5"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>
    <filter id="jelly-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#ef4444" flood-opacity="0.3"/>
    </filter>
  </defs>
  <style>
    @keyframes sternJelly {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-4px); }
    }
    .head-stern { animation: sternJelly 2s ease-in-out infinite; }
  </style>

  <ellipse cx="80" cy="148" rx="34" ry="6" fill="#000000" opacity="0.18"/>

  <g class="head-stern">
    <path d="M 32 85 C 32 46 54 32 80 32 C 106 32 128 46 128 85 C 128 118 116 130 96 130 C 84 130 80 124 74 124 C 68 124 64 130 52 130 C 36 130 32 118 32 85 Z" 
          fill="url(#jelly-red-grad)" stroke="#b91c1c" stroke-width="2.5" filter="url(#jelly-glow)"/>

    <path d="M 44 46 Q 80 36 112 46 Q 102 54 48 54 Z" fill="#ffffff" opacity="0.35"/>

    <!-- Stern flat line eyes (- -) -->
    <line x1="52" y1="80" x2="68" y2="80" stroke="#7f1d1d" stroke-width="4.5" stroke-linecap="round"/>
    <line x1="92" y1="80" x2="108" y2="80" stroke="#7f1d1d" stroke-width="4.5" stroke-linecap="round"/>

    <!-- Stern flat mouth -->
    <line x1="74" y1="96" x2="86" y2="96" stroke="#7f1d1d" stroke-width="3" stroke-linecap="round"/>
  </g>
  <line x1="24" y1="140" x2="136" y2="140" stroke="#ef4444" stroke-width="2" stroke-dasharray="6 3"/>
</svg>