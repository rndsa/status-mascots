<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <linearGradient id="jelly-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#6ee7b7"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="jelly-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#059669" flood-opacity="0.3"/>
    </filter>
  </defs>
  <style>
    @keyframes tiltJelly {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(-15deg); }
    }
    @keyframes qmarkBob {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-7px) rotate(4deg); }
    }
    .head-tilt { animation: tiltJelly 2.6s ease-in-out infinite; transform-origin: 80px 145px; }
    .qmark-box { animation: qmarkBob 2s ease-in-out infinite; transform-origin: 130px 30px; }
  </style>

  <ellipse cx="80" cy="148" rx="34" ry="6" fill="#000000" opacity="0.18"/>

  <g class="qmark-box">
    <ellipse cx="130" cy="30" rx="14" ry="14" fill="#141722" stroke="#10b981" stroke-width="2"/>
    <text x="130" y="38" font-family="-apple-system, sans-serif" font-size="20" font-weight="900" fill="#10b981" text-anchor="middle">?</text>
  </g>

  <g class="head-tilt">
    <path d="M 32 85 C 32 46 54 32 80 32 C 106 32 128 46 128 85 C 128 118 116 130 96 130 C 84 130 80 124 74 124 C 68 124 64 130 52 130 C 36 130 32 118 32 85 Z" 
          fill="url(#jelly-grad)" stroke="#10b981" stroke-width="2.5" filter="url(#jelly-glow)"/>

    <path d="M 44 46 Q 80 36 112 46 Q 102 54 48 54 Z" fill="#ffffff" opacity="0.35"/>

    <!-- Puzzled Eyes: Left spiral @, Right dot . -->
    <path d="M 62 80 A 4 4 0 1 1 58 84 A 7 7 0 1 1 67 82" fill="none" stroke="#064e3b" stroke-width="2.8" stroke-linecap="round"/>
    <ellipse cx="98" cy="84" rx="6" ry="8" fill="#064e3b"/>
    <circle cx="100" cy="82" r="2.2" fill="#ffffff"/>

    <!-- Puzzled small O mouth -->
    <circle cx="80" cy="94" r="4.5" fill="#064e3b"/>
  </g>
</svg>