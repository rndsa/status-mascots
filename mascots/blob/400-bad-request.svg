<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <linearGradient id="blob-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
  </defs>
  <style>
    @keyframes jellyTilt {
      0%, 100% { transform: skewX(0deg); }
      50% { transform: skewX(-16deg); }
    }
    .wobble { animation: jellyTilt 2s ease-in-out infinite; transform-origin: 80px 125px; }
  </style>

  <g class="wobble">
    <path d="M 45 115 C 35 115 35 90 48 70 C 60 50 100 50 112 70 C 125 90 125 115 115 115 C 95 125 65 125 45 115 Z" fill="url(#blob-grad)" stroke="#047857" stroke-width="2.5"/>
    <!-- Confused Spiral Eye -->
    <circle cx="64" cy="85" r="5" fill="none" stroke="#064e3b" stroke-width="2"/>
    <circle cx="88" cy="85" r="3" fill="#064e3b"/>
    <!-- Wavy mouth -->
    <path d="M 72 94 Q 76 90 80 94" fill="none" stroke="#064e3b" stroke-width="2"/>
    <text x="115" y="55" font-family="sans-serif" font-size="20" font-weight="900" fill="#047857">?</text>
  </g>
</svg>