<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <style>
      @keyframes dizzyRoll {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      .spiral-eye { animation: dizzyRoll 2s linear infinite; transform-origin: center; }
    </style>
  </defs>
  <!-- Cracked Antenna -->
  <path d="M60 28 L56 18 L64 12" stroke="#ef4444" stroke-width="3" fill="none"/>
  <!-- Smoke clouds -->
  <circle cx="50" cy="8" r="5" fill="#94a3b8" opacity="0.6"/>
  <circle cx="64" cy="4" r="6" fill="#cbd5e1" opacity="0.5"/>
  <!-- Helmet with Crack -->
  <rect x="24" y="28" width="72" height="66" rx="24" fill="#f8fafc" stroke="#dc2626" stroke-width="2"/>
  <path d="M42 28 L46 38 L40 44" stroke="#dc2626" stroke-width="2" fill="none"/>
  <!-- Visor -->
  <rect x="30" y="36" width="60" height="42" rx="14" fill="#0f172a"/>
  <!-- Spiral Dizzy Eyes (@ @) -->
  <g transform="translate(44, 56)">
    <circle class="spiral-eye" r="6" stroke="#f87171" stroke-width="2.5" stroke-dasharray="8 4" fill="none"/>
  </g>
  <g transform="translate(76, 56)">
    <circle class="spiral-eye" r="6" stroke="#f87171" stroke-width="2.5" stroke-dasharray="8 4" fill="none"/>
  </g>
  <!-- Wobbly mouth -->
  <path d="M52 68 Q56 63 60 68 T68 68" stroke="#f87171" stroke-width="2" fill="none"/>
</svg>