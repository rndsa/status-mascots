<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <style>
      @keyframes headShakeAnim {
        0% { transform: translateX(0); }
        15% { transform: translateX(-12px) rotate(-10deg); }
        30% { transform: translateX(11px) rotate(9deg); }
        45% { transform: translateX(-8px) rotate(-6deg); }
        60% { transform: translateX(6px) rotate(5deg); }
        75% { transform: translateX(-3px) rotate(-2deg); }
        100% { transform: translateX(0) rotate(0deg); }
      }
      .bot-geleng { animation: headShakeAnim 0.75s ease-in-out infinite; transform-origin: 60px 85px; }
    </style>
  </defs>
  <g class="bot-geleng">
    <!-- Antenna Red -->
    <line x1="60" y1="32" x2="60" y2="12" stroke="#3a3f50" stroke-width="4" stroke-linecap="round"/>
    <circle cx="60" cy="10" r="5" fill="#ff4d4d"/>
    <!-- Ears -->
    <rect x="18" y="44" width="8" height="32" rx="4" fill="#222634"/>
    <rect x="94" y="44" width="8" height="32" rx="4" fill="#222634"/>
    <!-- Helmet with soft coral tint -->
    <rect x="24" y="28" width="72" height="66" rx="24" fill="#ffffff" stroke="#ff4d4d" stroke-width="2.5"/>
    <!-- Visor -->
    <rect x="30" y="36" width="60" height="42" rx="14" fill="#10131a"/>
    <!-- Sad / Cross Eyes (> <) -->
    <line x1="38" y1="50" x2="48" y2="60" stroke="#ff4d4d" stroke-width="3" stroke-linecap="round"/>
    <line x1="48" y1="50" x2="38" y2="60" stroke="#ff4d4d" stroke-width="3" stroke-linecap="round"/>
    <line x1="72" y1="50" x2="82" y2="60" stroke="#ff4d4d" stroke-width="3" stroke-linecap="round"/>
    <line x1="82" y1="50" x2="72" y2="60" stroke="#ff4d4d" stroke-width="3" stroke-linecap="round"/>
    <!-- Pout mouth -->
    <path d="M54 68 Q60 63 66 68" stroke="#ff4d4d" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <!-- Sweat drop on side -->
    <path d="M96 34 C94 30, 98 24, 98 24 C98 24, 102 30, 100 34 C99 36, 97 36, 96 34 Z" fill="#00f0ff"/>
  </g>
</svg>