<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <linearGradient id="r-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
  </defs>
  <style>
    @keyframes siren-flash { 0%, 100% { fill: #ef4444; } 50% { fill: #ffffff; } }
    .siren { animation: siren-flash 0.8s infinite; }
  </style>
  <g>
    <!-- Red Siren on Top -->
    <path d="M 72 32 L 88 32 L 85 20 Q 80 18 75 20 Z" class="siren"/>
    <rect x="70" y="32" width="20" height="6" rx="2" fill="#475569"/>
    <!-- Head -->
    <rect x="38" y="40" width="84" height="70" rx="26" fill="url(#r-grad)" stroke="#cbd5e1" stroke-width="2.5"/>
    <rect x="47" y="52" width="66" height="42" rx="16" fill="#0f172a"/>
    <!-- Strict Stop Eyes (Flat Lines - -) -->
    <line x1="58" y1="72" x2="72" y2="72" stroke="#ef4444" stroke-width="4" stroke-linecap="round"/>
    <line x1="88" y1="72" x2="102" y2="72" stroke="#ef4444" stroke-width="4" stroke-linecap="round"/>
    <!-- Firm mouth -->
    <line x1="75" y1="84" x2="85" y2="84" stroke="#ef4444" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Body -->
    <rect x="62" y="112" width="36" height="24" rx="10" fill="url(#r-grad)" stroke="#cbd5e1" stroke-width="2"/>
    <!-- Hands crossed STOP gesture -->
    <line x1="55" y1="125" x2="105" y2="115" stroke="#ef4444" stroke-width="4" stroke-linecap="round"/>
    <line x1="55" y1="115" x2="105" y2="125" stroke="#ef4444" stroke-width="4" stroke-linecap="round"/>
  </g>
</svg>