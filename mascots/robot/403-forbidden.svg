<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <linearGradient id="astro-head-403" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#fee2e2"/>
    </linearGradient>
    <linearGradient id="astro-visor-403" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e0505"/>
      <stop offset="100%" stop-color="#0a0101"/>
    </linearGradient>
    <filter id="astro-shadow-403" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#ef4444" flood-opacity="0.35"/>
    </filter>
  </defs>
  <style>
    @keyframes sirenSpin {
      0%, 100% { fill: #ef4444; filter: drop-shadow(0 0 8px #ef4444); }
      50% { fill: #991b1b; filter: none; }
    }
    @keyframes sternStance {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-4px); }
    }
    @keyframes laserFlicker {
      0%, 100% { opacity: 0.8; }
      50% { opacity: 0.3; }
    }
    .siren-top { animation: sirenSpin 0.7s infinite ease-in-out; }
    .head-stern { animation: sternStance 2s ease-in-out infinite; }
    .laser-line { animation: laserFlicker 1.2s infinite; }
  </style>

  <ellipse cx="80" cy="148" rx="34" ry="6" fill="#000000" opacity="0.18"/>

  <g class="head-stern">
    <!-- Siren Light Beacon on top -->
    <path d="M 72 24 L 88 24 L 85 12 L 75 12 Z" class="siren-top"/>
    <rect x="70" y="24" width="20" height="5" rx="1.5" fill="#475569"/>

    <rect x="22" y="70" width="8" height="28" rx="4" fill="#ef4444"/>
    <rect x="130" y="70" width="8" height="28" rx="4" fill="#ef4444"/>

    <rect x="28" y="38" width="104" height="92" rx="34" fill="url(#astro-head-403)" stroke="#ef4444" stroke-width="2.5" filter="url(#astro-shadow-403)"/>

    <rect x="38" y="54" width="84" height="60" rx="24" fill="url(#astro-visor-403)" stroke="#ef4444" stroke-width="1.8"/>

    <!-- Stern flat line eyes (- -) with sharp laser glow -->
    <line x1="52" y1="80" x2="68" y2="80" stroke="#ef4444" stroke-width="4.5" stroke-linecap="round"/>
    <line x1="92" y1="80" x2="108" y2="80" stroke="#ef4444" stroke-width="4.5" stroke-linecap="round"/>

    <line x1="74" y1="96" x2="86" y2="96" stroke="#ef4444" stroke-width="3" stroke-linecap="round"/>

    <!-- Crossed Arms Gesture (🙅) Foreground -->
    <g>
      <!-- Arm 1 (diagonal left to right) -->
      <line x1="60" y1="104" x2="100" y2="124" stroke="#ffffff" stroke-width="8" stroke-linecap="round"/>
      <line x1="60" y1="104" x2="100" y2="124" stroke="#ef4444" stroke-width="2" stroke-linecap="round"/>
      <!-- Arm 2 (diagonal right to left) -->
      <line x1="100" y1="104" x2="60" y2="124" stroke="#ffffff" stroke-width="8" stroke-linecap="round"/>
      <line x1="100" y1="104" x2="60" y2="124" stroke="#ef4444" stroke-width="2" stroke-linecap="round"/>
    </g>
  </g>

  <!-- Red Security Barrier Tape at Bottom -->
  <line class="laser-line" x1="20" y1="138" x2="140" y2="138" stroke="#ef4444" stroke-width="2.5" stroke-dasharray="6 3"/>
  <text x="80" y="146" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace" font-size="9" font-weight="800" fill="#ef4444" letter-spacing="1" text-anchor="middle">FORBIDDEN • 403</text>
</svg>