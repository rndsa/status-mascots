<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <linearGradient id="astro-head-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="astro-visor-dark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#180505"/>
      <stop offset="100%" stop-color="#050202"/>
    </linearGradient>
    <filter id="astro-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#020617" flood-opacity="0.25"/>
    </filter>
  </defs>
  <style>
    @keyframes sirenSpinLight {
      0%, 100% { fill: #ef4444; filter: drop-shadow(0 0 8px #ef4444); }
      50% { fill: #7f1d1d; filter: none; }
    }
    @keyframes sternVibe {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-4px); }
    }
    .siren-top { animation: sirenSpinLight 0.6s infinite ease-in-out; }
    .head-stern { animation: sternVibe 2s ease-in-out infinite; }
  </style>

  <ellipse cx="80" cy="148" rx="34" ry="6" fill="#000000" opacity="0.18"/>

  <g class="head-stern">
    <!-- Siren Light Beacon on top -->
    <path d="M 72 26 L 88 26 L 85 14 L 75 14 Z" class="siren-top"/>
    <rect x="70" y="26" width="20" height="5" rx="1.5" fill="#475569"/>

    <rect x="22" y="70" width="8" height="28" rx="4" fill="#94a3b8"/>
    <rect x="130" y="70" width="8" height="28" rx="4" fill="#94a3b8"/>

    <rect x="28" y="38" width="104" height="92" rx="34" fill="url(#astro-head-grad)" stroke="#f87171" stroke-width="2.5" filter="url(#astro-shadow)"/>
    <rect x="38" y="54" width="84" height="60" rx="24" fill="url(#astro-visor-dark)" stroke="#dc2626" stroke-width="1.5"/>

    <!-- Stern flat line eyes (- -) -->
    <line x1="52" y1="80" x2="68" y2="80" stroke="#ef4444" stroke-width="4.5" stroke-linecap="round"/>
    <line x1="92" y1="80" x2="108" y2="80" stroke="#ef4444" stroke-width="4.5" stroke-linecap="round"/>

    <!-- Flat stern mouth -->
    <line x1="74" y1="96" x2="86" y2="96" stroke="#ef4444" stroke-width="3" stroke-linecap="round"/>

    <!-- Visor Laser Scan Bar -->
    <line x1="42" y1="88" x2="118" y2="88" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="4 2" opacity="0.7"/>
  </g>
</svg>