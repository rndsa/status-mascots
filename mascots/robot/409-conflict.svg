<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <linearGradient id="astro-head-409" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#fee2e2"/>
    </linearGradient>
    <linearGradient id="astro-visor-409" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <filter id="astro-shadow-409" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#ef4444" flood-opacity="0.3"/>
    </filter>
  </defs>
  <style>
    @keyframes panicShiver {
      0%, 100% { transform: rotate(0deg) scale(1); }
      15% { transform: rotate(-8deg) scale(1.03); }
      30% { transform: rotate(8deg) scale(0.97); }
      45% { transform: rotate(-6deg) scale(1.02); }
      60% { transform: rotate(5deg) scale(0.98); }
      75% { transform: rotate(-3deg) scale(1.01); }
    }
    @keyframes sweatDripFast {
      0% { transform: translateY(0); opacity: 0; }
      50% { opacity: 1; }
      100% { transform: translateY(22px); opacity: 0; }
    }
    .head-panic { animation: panicShiver 0.7s ease-in-out infinite; transform-origin: 80px 145px; }
    .sweat-fall { animation: sweatDripFast 1s infinite; }
  </style>

  <ellipse cx="80" cy="148" rx="34" ry="6" fill="#000000" opacity="0.18"/>

  <g class="head-panic">
    <rect x="78" y="14" width="4" height="26" rx="2" fill="#ef4444"/>
    <circle cx="80" cy="14" r="8" fill="#ef4444"/>

    <rect x="22" y="70" width="8" height="28" rx="4" fill="#94a3b8"/>
    <rect x="130" y="70" width="8" height="28" rx="4" fill="#94a3b8"/>

    <rect x="28" y="38" width="104" height="92" rx="34" fill="url(#astro-head-409)" stroke="#ef4444" stroke-width="2.5" filter="url(#astro-shadow-409)"/>

    <rect x="38" y="54" width="84" height="60" rx="24" fill="url(#astro-visor-409)"/>

    <!-- Angry Squeezed X Eyes (> <) -->
    <path d="M 50 76 L 62 84 L 50 92" fill="none" stroke="#ef4444" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 110 76 L 98 84 L 110 92" fill="none" stroke="#ef4444" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Panicked quivering mouth -->
    <path d="M 72 95 Q 76 90 80 95 Q 84 100 88 95" fill="none" stroke="#ef4444" stroke-width="3" stroke-linecap="round"/>

    <!-- Giant Anime Sweat Droplets -->
    <g class="sweat-fall" transform="translate(122, 60)">
      <path d="M 0 -8 Q 6 0 0 5 Q -6 0 0 -8 Z" fill="#38bdf8"/>
    </g>

    <!-- Hands Clutching Both Sides of Head in Panic! -->
    <rect x="18" y="72" width="12" height="18" rx="5" fill="#ffffff" stroke="#ef4444" stroke-width="1.8"/>
    <rect x="130" y="72" width="12" height="18" rx="5" fill="#ffffff" stroke="#ef4444" stroke-width="1.8"/>
  </g>

  <text x="80" y="146" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace" font-size="9" font-weight="800" fill="#ef4444" letter-spacing="1" text-anchor="middle">CONFLICT • 409</text>
</svg>