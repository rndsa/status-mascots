<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <linearGradient id="astro-head-offline" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <linearGradient id="astro-visor-offline" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <filter id="astro-shadow-off" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#475569" flood-opacity="0.3"/>
    </filter>
  </defs>
  <style>
    @keyframes searchWifi {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-4px); }
    }
    @keyframes wifiCrossBlink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }
    .head-offline { animation: searchWifi 3s ease-in-out infinite; }
    .wifi-cross { animation: wifiCrossBlink 1.5s infinite; }
  </style>

  <ellipse cx="80" cy="148" rx="34" ry="6" fill="#000000" opacity="0.18"/>

  <!-- Crossed Out WiFi Signal Symbol above Head -->
  <g class="wifi-cross" transform="translate(64, 8)">
    <path d="M 2 12 A 20 20 0 0 1 30 12" fill="none" stroke="#ef4444" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 8 18 A 12 12 0 0 1 24 18" fill="none" stroke="#ef4444" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="16" cy="24" r="2.5" fill="#ef4444"/>
    <line x1="2" y1="4" x2="30" y2="26" stroke="#ef4444" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <g class="head-offline">
    <rect x="78" y="24" width="4" height="16" rx="2" fill="#64748b"/>

    <rect x="22" y="70" width="8" height="28" rx="4" fill="#64748b"/>
    <rect x="130" y="70" width="8" height="28" rx="4" fill="#64748b"/>

    <rect x="28" y="38" width="104" height="92" rx="34" fill="url(#astro-head-offline)" stroke="#64748b" stroke-width="2.5" filter="url(#astro-shadow-off)"/>

    <rect x="38" y="54" width="84" height="60" rx="24" fill="url(#astro-visor-offline)"/>

    <!-- Puzzled Searching Eyes Looking Up -->
    <ellipse cx="62" cy="78" rx="6" ry="8" fill="#94a3b8"/>
    <circle cx="64" cy="74" r="2.2" fill="#ffffff"/>

    <ellipse cx="98" cy="78" rx="6" ry="8" fill="#94a3b8"/>
    <circle cx="100" cy="74" r="2.2" fill="#ffffff"/>

    <line x1="74" y1="96" x2="86" y2="96" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <text x="80" y="146" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace" font-size="9" font-weight="800" fill="#64748b" letter-spacing="1" text-anchor="middle">OFFLINE / NO NETWORK</text>
</svg>