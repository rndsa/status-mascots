<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <linearGradient id="astro-head-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="astro-visor-glass" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <filter id="astro-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#020617" flood-opacity="0.25"/>
    </filter>
  </defs>
  <style>
    @keyframes radarSpin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes eyesLookLR {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-6px); }
      75% { transform: translateX(6px); }
    }
    .radar-sweep { animation: radarSpin 3s linear infinite; transform-origin: 80px 20px; }
    .eyes-roam { animation: eyesLookLR 2.8s ease-in-out infinite; }
  </style>

  <ellipse cx="80" cy="148" rx="34" ry="6" fill="#000000" opacity="0.18"/>

  <!-- Antenna with Radar Dish -->
  <rect x="78" y="16" width="4" height="24" rx="2" fill="#94a3b8"/>
  <ellipse cx="80" cy="16" rx="14" ry="5" fill="#64748b"/>
  <g class="radar-sweep">
    <line x1="80" y1="16" x2="94" y2="16" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <rect x="22" y="70" width="8" height="28" rx="4" fill="#94a3b8"/>
  <rect x="130" y="70" width="8" height="28" rx="4" fill="#94a3b8"/>

  <rect x="28" y="38" width="104" height="92" rx="34" fill="url(#astro-head-grad)" stroke="#cbd5e1" stroke-width="2.5" filter="url(#astro-shadow)"/>
  <rect x="38" y="54" width="84" height="60" rx="24" fill="url(#astro-visor-glass)"/>

  <!-- Roaming Eyes Looking Left & Right -->
  <g class="eyes-roam">
    <ellipse cx="62" cy="84" rx="7" ry="8.5" fill="#38bdf8"/>
    <circle cx="64" cy="82" r="2.5" fill="#ffffff"/>

    <ellipse cx="98" cy="84" rx="7" ry="8.5" fill="#38bdf8"/>
    <circle cx="100" cy="82" r="2.5" fill="#ffffff"/>
  </g>

  <!-- Small confused mouth -->
  <ellipse cx="80" cy="96" rx="3.5" ry="4.5" fill="#38bdf8"/>
  <text x="80" y="146" font-family="monospace" font-size="10" font-weight="bold" fill="#64748b" text-anchor="middle">SEARCHING 404</text>
</svg>