<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <linearGradient id="r-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <radialGradient id="beam" cx="0%" cy="50%" r="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <style>
    @keyframes sweep { 0%, 100% { transform: rotate(-8deg); } 50% { transform: rotate(10deg); } }
    @keyframes look { 0%, 100% { transform: translateX(-3px); } 50% { transform: translateX(4px); } }
    .torch-sweep { animation: sweep 3s ease-in-out infinite; transform-origin: 110px 115px; }
    .eyes-look { animation: look 2.5s ease-in-out infinite; }
  </style>
  <g>
    <!-- Head -->
    <rect x="38" y="40" width="84" height="70" rx="26" fill="url(#r-grad)" stroke="#cbd5e1" stroke-width="2.5"/>
    <rect x="47" y="52" width="66" height="42" rx="16" fill="#0f172a"/>
    <!-- Eyes peering left and right -->
    <g class="eyes-look">
      <ellipse cx="66" cy="72" rx="6" ry="7" fill="#38bdf8"/>
      <circle cx="68" cy="70" r="2.5" fill="#ffffff"/>
      <ellipse cx="94" cy="72" rx="6" ry="7" fill="#38bdf8"/>
      <circle cx="96" cy="70" r="2.5" fill="#ffffff"/>
      <!-- Tiny O mouth -->
      <circle cx="80" cy="82" r="3" fill="none" stroke="#38bdf8" stroke-width="2"/>
    </g>
    <!-- Body -->
    <rect x="62" y="112" width="36" height="24" rx="10" fill="url(#r-grad)" stroke="#cbd5e1" stroke-width="2"/>
    <ellipse cx="50" cy="120" rx="6" ry="8" fill="#94a3b8"/>
    <!-- Flashlight & Light Cone -->
    <g class="torch-sweep">
      <polygon points="115,115 155,95 155,135" fill="url(#beam)"/>
      <rect x="105" y="110" width="14" height="8" rx="2" fill="#f59e0b"/>
    </g>
  </g>
</svg>