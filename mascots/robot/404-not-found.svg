<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <linearGradient id="astro-head-404" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <linearGradient id="astro-visor-404" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
  </defs>
  <style>
    @keyframes astroGhostFade {
      0%, 100% { opacity: 0.95; }
      50% { opacity: 0.28; }
    }
    @keyframes eyeScanLR {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-8px); }
      75% { transform: translateX(8px); }
    }
    @keyframes radarSpin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    .head-ghost { animation: astroGhostFade 3.2s ease-in-out infinite; }
    .scan-eyes { animation: eyeScanLR 2.6s ease-in-out infinite; }
    .radar-dish { animation: radarSpin 4s linear infinite; transform-origin: 80px 14px; }
  </style>

  <ellipse cx="80" cy="148" rx="34" ry="6" fill="#000000" opacity="0.18"/>

  <g class="head-ghost">
    <!-- Spinning Radar Dish atop Antenna -->
    <rect x="78" y="14" width="4" height="26" rx="2" fill="#94a3b8"/>
    <g class="radar-dish">
      <path d="M 68 14 A 12 12 0 0 1 92 14 Z" fill="#64748b"/>
      <line x1="80" y1="14" x2="80" y2="4" stroke="#38bdf8" stroke-width="2"/>
    </g>

    <rect x="22" y="70" width="8" height="28" rx="4" fill="#94a3b8"/>
    <rect x="130" y="70" width="8" height="28" rx="4" fill="#94a3b8"/>

    <rect x="28" y="38" width="104" height="92" rx="34" fill="url(#astro-head-404)" stroke="#94a3b8" stroke-width="2.5"/>

    <rect x="38" y="54" width="84" height="60" rx="24" fill="url(#astro-visor-404)"/>

    <!-- Roaming Search Eyes (Looking Left-Right) -->
    <g class="scan-eyes">
      <ellipse cx="62" cy="84" rx="7" ry="9" fill="#38bdf8"/>
      <circle cx="64" cy="81" r="2.5" fill="#ffffff"/>

      <ellipse cx="98" cy="84" rx="7" ry="9" fill="#38bdf8"/>
      <circle cx="100" cy="81" r="2.5" fill="#ffffff"/>
    </g>

    <!-- O-shaped mouth -->
    <ellipse cx="80" cy="98" rx="4" ry="5" fill="#38bdf8"/>
  </g>

  <!-- Magnifying Glass Search Graphic -->
  <g transform="translate(112, 100)">
    <circle cx="12" cy="12" r="10" fill="none" stroke="#38bdf8" stroke-width="2.5"/>
    <line x1="19" y1="19" x2="28" y2="28" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>
  </g>

  <text x="80" y="146" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace" font-size="9" font-weight="800" fill="#64748b" letter-spacing="1" text-anchor="middle">NOT FOUND • 404</text>
</svg>