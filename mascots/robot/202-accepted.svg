<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <linearGradient id="astro-head-202" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e0f2fe"/>
    </linearGradient>
    <linearGradient id="astro-visor-202" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <filter id="astro-shadow-202" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#0284c7" flood-opacity="0.25"/>
    </filter>
  </defs>
  <style>
    @keyframes calmFloat {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-5px); }
    }
    @keyframes gearSpin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    .head-calm { animation: calmFloat 2.8s ease-in-out infinite; }
    .hologram-gear { animation: gearSpin 6s linear infinite; transform-origin: 124px 108px; }
  </style>

  <ellipse cx="80" cy="148" rx="34" ry="6" fill="#000000" opacity="0.18"/>

  <g class="head-calm">
    <rect x="78" y="14" width="4" height="26" rx="2" fill="#94a3b8"/>
    <circle cx="80" cy="14" r="7" fill="#38bdf8"/>

    <rect x="22" y="70" width="8" height="28" rx="4" fill="#38bdf8"/>
    <rect x="130" y="70" width="8" height="28" rx="4" fill="#38bdf8"/>

    <rect x="28" y="38" width="104" height="92" rx="34" fill="url(#astro-head-202)" stroke="#38bdf8" stroke-width="2.5" filter="url(#astro-shadow-202)"/>

    <rect x="38" y="54" width="84" height="60" rx="24" fill="url(#astro-visor-202)"/>

    <!-- Calm Patient Eyes (^ ^) -->
    <path d="M 52 84 Q 62 74 72 84" fill="none" stroke="#38bdf8" stroke-width="4" stroke-linecap="round"/>
    <path d="M 88 84 Q 98 74 108 84" fill="none" stroke="#38bdf8" stroke-width="4" stroke-linecap="round"/>

    <ellipse cx="48" cy="98" rx="6" ry="3.5" fill="#f43f5e" opacity="0.6"/>
    <ellipse cx="112" cy="98" rx="6" ry="3.5" fill="#f43f5e" opacity="0.6"/>

    <path d="M 75 96 Q 80 101 85 96" fill="none" stroke="#38bdf8" stroke-width="2.8" stroke-linecap="round"/>
  </g>

  <!-- ROTATING HOLOGRAPHIC GEAR (PROCESSING / QUEUED) -->
  <g class="hologram-gear">
    <circle cx="124" cy="108" r="14" fill="#0c4a6e" stroke="#38bdf8" stroke-width="2" opacity="0.9"/>
    <circle cx="124" cy="108" r="6" fill="#082f49" stroke="#38bdf8" stroke-width="1.5"/>
    <!-- Gear Cogs -->
    <rect x="122" y="90" width="4" height="5" rx="1" fill="#38bdf8"/>
    <rect x="122" y="121" width="4" height="5" rx="1" fill="#38bdf8"/>
    <rect x="106" y="106" width="5" height="4" rx="1" fill="#38bdf8"/>
    <rect x="137" y="106" width="5" height="4" rx="1" fill="#38bdf8"/>
  </g>

  <text x="80" y="146" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace" font-size="9" font-weight="800" fill="#38bdf8" letter-spacing="1" text-anchor="middle">PROCESSING • 202</text>
</svg>