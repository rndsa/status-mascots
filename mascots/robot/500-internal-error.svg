<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <linearGradient id="crash-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <style>
    @keyframes smokePuff {
      0% { transform: translateY(0) scale(0.6); opacity: 0; }
      40% { opacity: 0.8; }
      100% { transform: translateY(-18px) scale(1.3); opacity: 0; }
    }
    @keyframes spiralSpin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes sparkFlicker {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.2; transform: scale(0.6); }
    }
    .smoke-puff-1 { animation: smokePuff 2s ease-out infinite; transform-origin: 58px 30px; }
    .smoke-puff-2 { animation: smokePuff 2s ease-out infinite 0.8s; transform-origin: 94px 26px; }
    .spiral-l { animation: spiralSpin 3s linear infinite; transform-origin: 66px 73px; }
    .spiral-r { animation: spiralSpin 3s linear infinite; transform-origin: 94px 73px; }
    .spark { animation: sparkFlicker 0.4s infinite; }
  </style>

  <!-- Billowing Smoke Clouds -->
  <circle cx="58" cy="30" r="9" fill="#94a3b8" class="smoke-puff-1"/>
  <circle cx="94" cy="26" r="11" fill="#cbd5e1" class="smoke-puff-2"/>

  <!-- Broken Bent Antenna with Sparks -->
  <line x1="78" y1="42" x2="86" y2="28" stroke="#94a3b8" stroke-width="3.5" stroke-linecap="round"/>
  <polygon points="86,28 92,23 88,33 94,31" fill="#facc15" class="spark"/>

  <!-- Cracked Damaged Helmet -->
  <rect x="38" y="40" width="84" height="72" rx="28" fill="url(#crash-grad)" stroke="#ef4444" stroke-width="2.5"/>
  <!-- Fracture Crack -->
  <path d="M 60 40 L 66 52 L 62 60" stroke="#f87171" stroke-width="2.5" fill="none"/>

  <!-- Blackout Visor -->
  <rect x="47" y="52" width="66" height="44" rx="18" fill="#020617"/>

  <!-- Dizzy Rotating Spiral Eyes (@ @) -->
  <g class="spiral-l">
    <path d="M 66 67 A 6 6 0 1 0 72 73 A 4 4 0 1 0 68 70" fill="none" stroke="#f87171" stroke-width="2.5"/>
  </g>
  <g class="spiral-r">
    <path d="M 94 67 A 6 6 0 1 0 100 73 A 4 4 0 1 0 96 70" fill="none" stroke="#f87171" stroke-width="2.5"/>
  </g>

  <!-- Glitched Mouth Zigzag -->
  <path d="M 72 85 L 76 82 L 80 86 L 84 82 L 88 85" fill="none" stroke="#f87171" stroke-width="2.5"/>

  <!-- Torso -->
  <rect x="63" y="112" width="34" height="22" rx="10" fill="url(#crash-grad)" stroke="#ef4444" stroke-width="2"/>
  <ellipse cx="50" cy="120" rx="5.5" ry="7" fill="#64748b"/>
  <ellipse cx="110" cy="120" rx="5.5" ry="7" fill="#64748b"/>
</svg>