<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <linearGradient id="astro-head-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <linearGradient id="astro-visor-glass" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <filter id="astro-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#020617" flood-opacity="0.25"/>
    </filter>
  </defs>
  <style>
    @keyframes crashSmoke {
      0% { transform: translateY(0) scale(0.6); opacity: 0.8; }
      100% { transform: translateY(-16px) scale(1.2); opacity: 0; }
    }
    @keyframes sparkFlick {
      0%, 100% { opacity: 0; }
      50% { opacity: 1; }
    }
    .smoke-puff { animation: crashSmoke 1.6s infinite ease-out; }
    .sparks { animation: sparkFlick 0.4s infinite; }
  </style>

  <ellipse cx="80" cy="148" rx="34" ry="6" fill="#000000" opacity="0.18"/>

  <!-- Smoke puffing out from crack -->
  <circle cx="105" cy="30" r="7" fill="#64748b" opacity="0.6" class="smoke-puff"/>
  <circle cx="112" cy="20" r="10" fill="#475569" opacity="0.4" class="smoke-puff"/>

  <!-- Broken Antenna with sparks -->
  <g class="sparks">
    <polygon points="78,16 84,10 80,18 86,12" fill="#facc15"/>
  </g>
  <line x1="78" y1="26" x2="84" y2="18" stroke="#94a3b8" stroke-width="4" stroke-linecap="round"/>

  <rect x="22" y="70" width="8" height="28" rx="4" fill="#94a3b8"/>
  <rect x="130" y="70" width="8" height="28" rx="4" fill="#94a3b8"/>

  <rect x="28" y="38" width="104" height="92" rx="34" fill="url(#astro-head-grad)" stroke="#64748b" stroke-width="2.5" filter="url(#astro-shadow)"/>

  <!-- Cracked Visor -->
  <rect x="38" y="54" width="84" height="60" rx="24" fill="url(#astro-visor-glass)"/>
  <!-- Zigzag crack lines -->
  <polyline points="95,54 100,68 94,80 102,96" fill="none" stroke="#ef4444" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Spiral Dizzy Eyes (@ @) -->
  <path d="M 62 82 A 3.5 3.5 0 1 1 57 86 A 6 6 0 1 1 66 83" fill="none" stroke="#ef4444" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 98 82 A 3.5 3.5 0 1 1 93 86 A 6 6 0 1 1 102 83" fill="none" stroke="#ef4444" stroke-width="2.5" stroke-linecap="round"/>

  <text x="80" y="146" font-family="monospace" font-size="10" font-weight="bold" fill="#ef4444" text-anchor="middle">KERNEL CRASH (500)</text>
</svg>