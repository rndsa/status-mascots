<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <linearGradient id="astro-head-500" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#fca5a5"/>
    </linearGradient>
    <linearGradient id="astro-visor-500" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#180303"/>
      <stop offset="100%" stop-color="#050101"/>
    </linearGradient>
  </defs>
  <style>
    @keyframes shiverDizzy {
      0%, 100% { transform: rotate(0deg) translate(0, 0); }
      20% { transform: rotate(-4deg) translate(-2px, 1px); }
      40% { transform: rotate(4deg) translate(2px, -1px); }
      60% { transform: rotate(-3deg) translate(-1px, 2px); }
      80% { transform: rotate(3deg) translate(1px, -2px); }
    }
    @keyframes smokePuff {
      0% { transform: translateY(0) scale(0.6); opacity: 0; }
      50% { opacity: 0.8; }
      100% { transform: translateY(-24px) scale(1.4); opacity: 0; }
    }
    @keyframes electricSpark {
      0%, 100% { opacity: 0; }
      50% { opacity: 1; }
    }
    .head-dizzy { animation: shiverDizzy 0.4s infinite; transform-origin: 80px 145px; }
    .smoke-1 { animation: smokePuff 2s infinite ease-out; transform-origin: 50px 25px; }
    .smoke-2 { animation: smokePuff 2s infinite ease-out 0.8s; transform-origin: 105px 25px; }
    .spark-zap { animation: electricSpark 0.25s infinite; }
  </style>

  <ellipse cx="80" cy="148" rx="34" ry="6" fill="#000000" opacity="0.18"/>

  <!-- Dark Smoke Clouds Rising -->
  <g class="smoke-1">
    <circle cx="50" cy="22" r="8" fill="#475569" opacity="0.7"/>
    <circle cx="56" cy="18" r="6" fill="#64748b" opacity="0.7"/>
  </g>
  <g class="smoke-2">
    <circle cx="106" cy="20" r="9" fill="#475569" opacity="0.7"/>
    <circle cx="112" cy="16" r="7" fill="#64748b" opacity="0.7"/>
  </g>

  <!-- Yellow Electric Sparks -->
  <g class="spark-zap">
    <polyline points="32,28 38,36 34,40 42,48" fill="none" stroke="#facc15" stroke-width="2.5" stroke-linecap="round"/>
    <polyline points="126,26 120,34 124,38 116,46" fill="none" stroke="#facc15" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <g class="head-dizzy">
    <!-- Broken Crooked Antenna -->
    <path d="M 78 40 L 78 26 L 86 16" fill="none" stroke="#ef4444" stroke-width="4" stroke-linecap="round"/>
    <circle cx="86" cy="16" r="5" fill="#ef4444"/>

    <rect x="22" y="70" width="8" height="28" rx="4" fill="#ef4444"/>
    <rect x="130" y="70" width="8" height="28" rx="4" fill="#ef4444"/>

    <rect x="28" y="38" width="104" height="92" rx="34" fill="url(#astro-head-500)" stroke="#ef4444" stroke-width="2.5"/>

    <!-- Helmet Crack Mark -->
    <path d="M 44 48 L 52 58 L 48 64 L 56 72" fill="none" stroke="#ef4444" stroke-width="2.5" stroke-linecap="round"/>

    <rect x="38" y="54" width="84" height="60" rx="24" fill="url(#astro-visor-500)" stroke="#ef4444" stroke-width="1.5"/>

    <!-- Spiral Dizzy Eyes (@_@) -->
    <path d="M 62 82 A 3 3 0 1 1 58 85 A 6 6 0 1 1 66 83" fill="none" stroke="#ef4444" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 98 82 A 3 3 0 1 1 94 85 A 6 6 0 1 1 102 83" fill="none" stroke="#ef4444" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Agaped O-mouth in shock -->
    <ellipse cx="80" cy="98" rx="6" ry="8" fill="#ef4444"/>
  </g>

  <text x="80" y="146" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace" font-size="9" font-weight="800" fill="#ef4444" letter-spacing="1" text-anchor="middle">INTERNAL ERROR • 500</text>
</svg>