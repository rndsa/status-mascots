<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <linearGradient id="r-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>
  <style>
    @keyframes float { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-7px); } }
    @keyframes wink { 0%, 90%, 100% { transform: scaleY(1); } 95% { transform: scaleY(0.1); } }
    @keyframes pulse { 0%, 100% { transform: scale(1); opacity: 0.9; } 50% { transform: scale(1.3); opacity: 1; } }
    @keyframes ear-wiggle { 0%, 100% { transform: rotate(0deg); } 50% { transform: rotate(8deg); } }
    .bot { animation: float 3s ease-in-out infinite; transform-origin: center bottom; }
    .eye-wink { transform-origin: 94px 74px; animation: wink 4s infinite; }
    .led { animation: pulse 1.8s infinite; transform-origin: 80px 24px; }
    .ear-r { transform-origin: 122px 75px; animation: ear-wiggle 2.5s ease-in-out infinite; }
  </style>
  <g class="bot">
    <!-- Antenna -->
    <rect x="78" y="27" width="4" height="18" rx="2" fill="#94a3b8"/>
    <circle cx="80" cy="24" r="6" fill="#38bdf8" class="led"/>
    <!-- Ears -->
    <rect x="33" y="66" width="7" height="18" rx="3.5" fill="#94a3b8"/>
    <rect x="120" y="66" width="7" height="18" rx="3.5" fill="#94a3b8" class="ear-r"/>
    <!-- Head / Helmet -->
    <rect x="38" y="40" width="84" height="70" rx="26" fill="url(#r-grad)" stroke="#cbd5e1" stroke-width="2.5" filter="url(#shadow)"/>
    <!-- Visor -->
    <rect x="47" y="52" width="66" height="42" rx="16" fill="#0f172a"/>
    <rect x="52" y="56" width="56" height="14" rx="7" fill="#1e293b" opacity="0.6"/>
    <!-- Eyes (Cute Happy Winking) -->
    <!-- Left Eye: Happy Arc -->
    <path d="M 59 75 Q 66 65 73 75" fill="none" stroke="#38bdf8" stroke-width="3.5" stroke-linecap="round"/>
    <!-- Right Eye: Winking Sparkle -->
    <g class="eye-wink">
      <ellipse cx="94" cy="74" rx="6" ry="7.5" fill="#38bdf8"/>
      <circle cx="96" cy="71" r="2.5" fill="#ffffff"/>
    </g>
    <!-- Kawaii Cheeks -->
    <ellipse cx="55" cy="85" rx="5" ry="3" fill="#f43f5e" opacity="0.7"/>
    <ellipse cx="105" cy="85" rx="5" ry="3" fill="#f43f5e" opacity="0.7"/>
    <!-- Tiny Smile -->
    <path d="M 76 81 Q 80 85 84 81" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
    <!-- Body Chibi -->
    <rect x="62" y="112" width="36" height="24" rx="10" fill="url(#r-grad)" stroke="#cbd5e1" stroke-width="2"/>
    <circle cx="80" cy="122" r="4" fill="#38bdf8"/>
    <!-- Hands waving -->
    <ellipse cx="54" cy="120" rx="5" ry="7" fill="#94a3b8"/>
    <ellipse cx="106" cy="116" rx="5" ry="7" fill="#94a3b8" transform="rotate(-20 106 116)"/>
  </g>
</svg>