<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <linearGradient id="astro-head-200" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="astro-visor-200" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="astro-hand-200" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <filter id="astro-shadow-200" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#020617" flood-opacity="0.25"/>
    </filter>
    <filter id="hand-shadow-200" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <style>
    @keyframes astroFloat {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-7px) rotate(1.5deg); }
    }
    @keyframes antennaBob {
      0%, 100% { transform: rotate(0deg); }
      25% { transform: rotate(-8deg); }
      75% { transform: rotate(8deg); }
    }
    @keyframes ledPulseCyan {
      0%, 100% { fill: #38bdf8; filter: drop-shadow(0 0 3px #38bdf8); }
      50% { fill: #0284c7; filter: none; }
    }
    @keyframes eyeBlinkAstro {
      0%, 92%, 100% { transform: scaleY(1); }
      96% { transform: scaleY(0.08); }
    }
    @keyframes thumbsUpBob {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-5px) rotate(-4deg); }
    }
    .head-astro { animation: astroFloat 3s ease-in-out infinite; transform-origin: 80px 145px; }
    .antenna-astro { animation: antennaBob 2.2s ease-in-out infinite; transform-origin: 80px 38px; }
    .led-bulb { animation: ledPulseCyan 2s infinite ease-in-out; }
    .blink-eye { animation: eyeBlinkAstro 3.6s infinite; transform-origin: 62px 85px; }
    .hand-thumb { animation: thumbsUpBob 2.5s ease-in-out infinite; transform-origin: 122px 115px; }
  </style>

  <ellipse cx="80" cy="148" rx="34" ry="6" fill="#000000" opacity="0.18"/>

  <g class="head-astro">
    <!-- Antenna with glowing cyan orb -->
    <g class="antenna-astro">
      <rect x="78" y="14" width="4" height="26" rx="2" fill="#94a3b8"/>
      <circle cx="80" cy="14" r="8" class="led-bulb"/>
      <circle cx="82.5" cy="11.5" r="2.8" fill="#ffffff" opacity="0.8"/>
    </g>

    <!-- Side Audio Ear Pods -->
    <rect x="22" y="70" width="8" height="28" rx="4" fill="#94a3b8"/>
    <rect x="130" y="70" width="8" height="28" rx="4" fill="#94a3b8"/>

    <!-- White Ceramic Rounded Squircle Helmet -->
    <rect x="28" y="38" width="104" height="92" rx="34" fill="url(#astro-head-200)" stroke="#cbd5e1" stroke-width="2.5" filter="url(#astro-shadow-200)"/>

    <!-- Obsidian Glossy Visor -->
    <rect x="38" y="54" width="84" height="60" rx="24" fill="url(#astro-visor-200)"/>
    <path d="M 44 60 Q 80 52 116 60 Q 114 74 46 74 Z" fill="#ffffff" opacity="0.08"/>

    <!-- Cheerful Winking Cyan Eyes (^ -) -->
    <!-- Left Winking Arc -->
    <g class="blink-eye">
      <path d="M 52 86 Q 62 74 72 86" fill="none" stroke="#38bdf8" stroke-width="4.5" stroke-linecap="round"/>
    </g>
    <!-- Right Big Anime Eye -->
    <g>
      <ellipse cx="98" cy="84" rx="7.5" ry="9.5" fill="#38bdf8"/>
      <circle cx="101" cy="80.5" r="3" fill="#ffffff"/>
      <circle cx="95.5" cy="87.5" r="1.5" fill="#ffffff"/>
    </g>

    <!-- Pink Cheeks -->
    <ellipse cx="48" cy="100" rx="6" ry="3.5" fill="#f43f5e" opacity="0.6"/>
    <ellipse cx="112" cy="100" rx="6" ry="3.5" fill="#f43f5e" opacity="0.6"/>

    <!-- Happy Cyan Smile -->
    <path d="M 75 95 Q 80 101 85 95" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- FOREGROUND FLOATING ROBOTIC THUMBS UP HAND -->
  <g class="hand-thumb">
    <g filter="url(#hand-shadow-200)">
      <!-- Fist Body -->
      <rect x="110" y="106" width="22" height="18" rx="7" fill="url(#astro-hand-200)" stroke="#94a3b8" stroke-width="1.8"/>
      <!-- Thumbs Up Digit -->
      <rect x="110" y="93" width="7.5" height="17" rx="3.5" fill="#ffffff" stroke="#94a3b8" stroke-width="1.8" transform="rotate(-15 113 101)"/>
      <circle cx="111" cy="95" r="1.5" fill="#38bdf8"/>
      <!-- Knuckle Separators -->
      <line x1="117" y1="112" x2="128" y2="112" stroke="#94a3b8" stroke-width="1.2" stroke-linecap="round"/>
      <line x1="117" y1="117" x2="128" y2="117" stroke="#94a3b8" stroke-width="1.2" stroke-linecap="round"/>
    </g>
  </g>

  <text x="80" y="146" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace" font-size="9" font-weight="800" fill="#38bdf8" letter-spacing="1" text-anchor="middle">SUCCESS • 200</text>
</svg>