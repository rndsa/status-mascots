<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <linearGradient id="astro-head-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="astro-visor-glass" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <filter id="astro-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#020617" flood-opacity="0.25"/>
    </filter>
  </defs>
  <style>
    @keyframes headBob {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-7px) rotate(1.5deg); }
    }
    @keyframes antennaWiggle {
      0%, 100% { transform: rotate(0deg); }
      25% { transform: rotate(-8deg); }
      75% { transform: rotate(8deg); }
    }
    @keyframes ledGlow {
      0%, 100% { fill: #38bdf8; filter: drop-shadow(0 0 3px #38bdf8); }
      50% { fill: #0284c7; filter: none; }
    }
    @keyframes eyeBlinkAstro {
      0%, 92%, 100% { transform: scaleY(1); }
      96% { transform: scaleY(0.08); }
    }
    .astro-head-group { animation: headBob 3s ease-in-out infinite; transform-origin: 80px 145px; }
    .antenna-group { animation: antennaWiggle 2.2s ease-in-out infinite; transform-origin: 80px 38px; }
    .led-bulb { animation: ledGlow 2s infinite ease-in-out; }
    .blinking-eye { animation: eyeBlinkAstro 3.6s infinite; transform-origin: 62px 85px; }
  </style>

  <ellipse cx="80" cy="148" rx="34" ry="6" fill="#000000" opacity="0.18"/>

  <g class="astro-head-group">
    <g class="antenna-group">
      <rect x="78" y="14" width="4" height="26" rx="2" fill="#94a3b8"/>
      <circle cx="80" cy="14" r="8" class="led-bulb"/>
      <circle cx="82.5" cy="11.5" r="2.8" fill="#ffffff" opacity="0.8"/>
    </g>

    <rect x="22" y="70" width="8" height="28" rx="4" fill="#94a3b8"/>
    <rect x="130" y="70" width="8" height="28" rx="4" fill="#94a3b8"/>

    <rect x="28" y="38" width="104" height="92" rx="34" fill="url(#astro-head-grad)" stroke="#cbd5e1" stroke-width="2.5" filter="url(#astro-shadow)"/>

    <rect x="38" y="54" width="84" height="60" rx="24" fill="url(#astro-visor-glass)"/>
    <path d="M 44 60 Q 80 52 116 60 Q 114 74 46 74 Z" fill="#ffffff" opacity="0.08"/>

    <g class="blinking-eye">
      <path d="M 52 86 Q 62 74 72 86" fill="none" stroke="#38bdf8" stroke-width="4.5" stroke-linecap="round"/>
    </g>

    <g>
      <ellipse cx="98" cy="84" rx="7.5" ry="9.5" fill="#38bdf8"/>
      <circle cx="101" cy="80.5" r="3" fill="#ffffff"/>
      <circle cx="95.5" cy="87.5" r="1.5" fill="#ffffff"/>
    </g>

    <ellipse cx="48" cy="100" rx="6" ry="3.5" fill="#f43f5e" opacity="0.6"/>
    <ellipse cx="112" cy="100" rx="6" ry="3.5" fill="#f43f5e" opacity="0.6"/>

    <path d="M 75 95 Q 80 101 85 95" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>
  </g>
</svg>