<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <linearGradient id="astro-head-504" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#fee2e2"/>
    </linearGradient>
    <linearGradient id="astro-visor-504" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e0808"/>
      <stop offset="100%" stop-color="#0a0202"/>
    </linearGradient>
    <filter id="astro-shadow-504" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#ef4444" flood-opacity="0.25"/>
    </filter>
  </defs>
  <style>
    @keyframes anxiousWobble {
      0%, 100% { transform: translateY(0); }
      25% { transform: translateY(-3px) rotate(-2deg); }
      75% { transform: translateY(-3px) rotate(2deg); }
    }
    @keyframes hourglassSpin {
      0%, 80% { transform: rotate(0deg); }
      90%, 100% { transform: rotate(180deg); }
    }
    .head-anxious { animation: anxiousWobble 2s ease-in-out infinite; }
    .hourglass-rot { animation: hourglassSpin 3s cubic-bezier(0.4, 0, 0.2, 1) infinite; transform-origin: 122px 110px; }
  </style>

  <ellipse cx="80" cy="148" rx="34" ry="6" fill="#000000" opacity="0.18"/>

  <g class="head-anxious">
    <rect x="78" y="14" width="4" height="26" rx="2" fill="#ef4444"/>
    <circle cx="80" cy="14" r="7" fill="#ef4444"/>

    <rect x="22" y="70" width="8" height="28" rx="4" fill="#ef4444"/>
    <rect x="130" y="70" width="8" height="28" rx="4" fill="#ef4444"/>

    <rect x="28" y="38" width="104" height="92" rx="34" fill="url(#astro-head-504)" stroke="#ef4444" stroke-width="2.5" filter="url(#astro-shadow-504)"/>

    <rect x="38" y="54" width="84" height="60" rx="24" fill="url(#astro-visor-504)"/>

    <!-- Anxious Eyes glancing right toward the hourglass -->
    <ellipse cx="64" cy="82" rx="7" ry="9" fill="#ef4444"/>
    <circle cx="67" cy="80" r="2.5" fill="#ffffff"/>

    <ellipse cx="100" cy="82" rx="7" ry="9" fill="#ef4444"/>
    <circle cx="103" cy="80" r="2.5" fill="#ffffff"/>

    <!-- Wobbly mouth -->
    <path d="M 74 98 Q 78 94 82 98 Q 86 102 90 98" fill="none" stroke="#ef4444" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Anime Sweat Bead -->
    <path d="M 118 64 Q 123 70 119 74 Q 115 70 118 64 Z" fill="#38bdf8"/>
  </g>

  <!-- FOREGROUND ROTATING HOURGLASS -->
  <g class="hourglass-rot">
    <polygon points="112,96 132,96 122,110" fill="#facc15" stroke="#ca8a04" stroke-width="1.5"/>
    <polygon points="122,110 132,124 112,124" fill="#facc15" stroke="#ca8a04" stroke-width="1.5"/>
    <line x1="110" y1="96" x2="134" y2="96" stroke="#ca8a04" stroke-width="2"/>
    <line x1="110" y1="124" x2="134" y2="124" stroke="#ca8a04" stroke-width="2"/>
  </g>

  <text x="80" y="146" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace" font-size="9" font-weight="800" fill="#ef4444" letter-spacing="1" text-anchor="middle">GATEWAY TIMEOUT • 504</text>
</svg>