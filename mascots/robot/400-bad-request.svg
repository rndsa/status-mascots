<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <linearGradient id="r-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
  </defs>
  <style>
    @keyframes tilt { 0%, 100% { transform: rotate(0deg); } 50% { transform: rotate(-12deg); } }
    @keyframes q-float { 0%, 100% { transform: translateY(0) rotate(5deg); } 50% { transform: translateY(-6px) rotate(-5deg); } }
    .bot-head { animation: tilt 2.8s ease-in-out infinite; transform-origin: 80px 105px; }
    .q-mark { animation: q-float 2.2s ease-in-out infinite; transform-origin: 125px 35px; }
  </style>
  <g class="bot-head">
    <!-- Antenna tilted -->
    <rect x="78" y="27" width="4" height="18" rx="2" fill="#94a3b8"/>
    <circle cx="80" cy="24" r="6" fill="#f59e0b"/>
    <!-- Head -->
    <rect x="38" y="40" width="84" height="70" rx="26" fill="url(#r-grad)" stroke="#cbd5e1" stroke-width="2.5"/>
    <rect x="47" y="52" width="66" height="42" rx="16" fill="#0f172a"/>
    <!-- Confused Asymmetrical Eyes -->
    <circle cx="66" cy="72" r="7" fill="#f59e0b"/>
    <circle cx="68" cy="70" r="2.5" fill="#ffffff"/>
    <ellipse cx="94" cy="73" rx="4" ry="4" fill="#f59e0b"/>
    <!-- Wavy mouth -->
    <path d="M 74 83 Q 77 80 80 83 T 86 83" fill="none" stroke="#f59e0b" stroke-width="2" stroke-linecap="round"/>
    <ellipse cx="55" cy="85" rx="5" ry="3" fill="#f59e0b" opacity="0.4"/>
    <ellipse cx="105" cy="85" rx="5" ry="3" fill="#f59e0b" opacity="0.4"/>
  </g>
  <!-- Body -->
  <rect x="62" y="114" width="36" height="24" rx="10" fill="url(#r-grad)" stroke="#cbd5e1" stroke-width="2"/>
  <ellipse cx="50" cy="120" rx="6" ry="8" fill="#94a3b8"/>
  <ellipse cx="110" cy="120" rx="6" ry="8" fill="#94a3b8"/>
  <!-- Floating Question Mark -->
  <g class="q-mark">
    <text x="122" y="40" font-family="-apple-system, sans-serif" font-size="28" font-weight="900" fill="#f59e0b">?</text>
  </g>
</svg>