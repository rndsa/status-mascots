<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <linearGradient id="astro-head-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="astro-visor-glass" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <filter id="astro-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#020617" flood-opacity="0.25"/>
    </filter>
  </defs>
  <style>
    @keyframes headTiltConfused {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(-15deg); }
    }
    @keyframes qmarkBob {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-7px) rotate(4deg); }
    }
    .head-tilt { animation: headTiltConfused 2.6s ease-in-out infinite; transform-origin: 80px 145px; }
    .qmark-box { animation: qmarkBob 2s ease-in-out infinite; transform-origin: 130px 32px; }
  </style>

  <ellipse cx="80" cy="148" rx="34" ry="6" fill="#000000" opacity="0.18"/>

  <g class="qmark-box">
    <ellipse cx="130" cy="32" rx="14" ry="14" fill="#141722" stroke="#facc15" stroke-width="2"/>
    <text x="130" y="40" font-family="-apple-system, sans-serif" font-size="20" font-weight="900" fill="#facc15" text-anchor="middle">?</text>
  </g>

  <g class="head-tilt">
    <!-- Antenna tilted -->
    <rect x="78" y="14" width="4" height="26" rx="2" fill="#94a3b8"/>
    <circle cx="80" cy="14" r="8" fill="#eab308"/>

    <rect x="22" y="70" width="8" height="28" rx="4" fill="#94a3b8"/>
    <rect x="130" y="70" width="8" height="28" rx="4" fill="#94a3b8"/>

    <rect x="28" y="38" width="104" height="92" rx="34" fill="url(#astro-head-grad)" stroke="#cbd5e1" stroke-width="2.5" filter="url(#astro-shadow)"/>
    <rect x="38" y="54" width="84" height="60" rx="24" fill="url(#astro-visor-glass)"/>

    <!-- Puzzled Eyes: Left is spiral @, Right is dot . -->
    <path d="M 62 80 A 4 4 0 1 1 58 84 A 7 7 0 1 1 67 82" fill="none" stroke="#38bdf8" stroke-width="2.8" stroke-linecap="round"/>
    <ellipse cx="98" cy="84" rx="6" ry="8" fill="#38bdf8"/>
    <circle cx="100" cy="82" r="2.2" fill="#ffffff"/>

    <!-- Puzzled O mouth -->
    <circle cx="80" cy="95" r="4.5" fill="#38bdf8"/>
  </g>
</svg>