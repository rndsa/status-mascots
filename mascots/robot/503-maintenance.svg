<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <linearGradient id="astro-head-503" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#fef08a"/>
    </linearGradient>
    <linearGradient id="astro-visor-503" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <filter id="astro-shadow-503" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#020617" flood-opacity="0.25"/>
    </filter>
  </defs>
  <style>
    @keyframes workNodding {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-5px); }
    }
    @keyframes wrenchTurn {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(-25deg); }
    }
    .head-work { animation: workNodding 1.8s ease-in-out infinite; }
    .wrench-hand { animation: wrenchTurn 1.8s ease-in-out infinite; transform-origin: 125px 115px; }
  </style>

  <ellipse cx="80" cy="148" rx="34" ry="6" fill="#000000" opacity="0.18"/>

  <g class="head-work">
    <rect x="22" y="70" width="8" height="28" rx="4" fill="#94a3b8"/>
    <rect x="130" y="70" width="8" height="28" rx="4" fill="#94a3b8"/>

    <rect x="28" y="38" width="104" height="92" rx="34" fill="url(#astro-head-503)" stroke="#eab308" stroke-width="2.5" filter="url(#astro-shadow-503)"/>

    <!-- Yellow Safety Hard Hat Dome atop Helmet -->
    <path d="M 26 50 C 26 22 134 22 134 50 Z" fill="#eab308" stroke="#ca8a04" stroke-width="2"/>
    <ellipse cx="80" cy="50" rx="55" ry="6" fill="#facc15"/>
    <!-- Center hard hat ridge -->
    <rect x="76" y="24" width="8" height="26" rx="4" fill="#ca8a04"/>

    <rect x="38" y="60" width="84" height="54" rx="22" fill="url(#astro-visor-503)"/>

    <!-- Confident Industrious Eyes (^ ^) -->
    <path d="M 52 84 Q 62 72 72 84" fill="none" stroke="#eab308" stroke-width="4.5" stroke-linecap="round"/>
    <path d="M 88 84 Q 98 72 108 84" fill="none" stroke="#eab308" stroke-width="4.5" stroke-linecap="round"/>

    <!-- Cheerful Smile -->
    <path d="M 74 96 Q 80 102 86 96" fill="none" stroke="#eab308" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- FOREGROUND FLOATING ROBOTIC HAND TURNING HIGH-TECH WRENCH -->
  <g class="wrench-hand">
    <!-- Wrench Body -->
    <g transform="translate(108, 92)">
      <rect x="12" y="6" width="6" height="26" rx="3" fill="#94a3b8" stroke="#64748b" stroke-width="1.2" transform="rotate(-30 15 19)"/>
      <!-- Wrench Head -->
      <path d="M 22 4 C 20 0 14 0 12 4 L 16 8 Z" fill="#64748b"/>
    </g>
    <!-- Robotic Fist Holding Wrench -->
    <circle cx="125" cy="112" r="9" fill="#ffffff" stroke="#94a3b8" stroke-width="1.8"/>
    <circle cx="125" cy="112" r="3" fill="#eab308"/>
  </g>

  <text x="80" y="146" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace" font-size="9" font-weight="800" fill="#eab308" letter-spacing="1" text-anchor="middle">MAINTENANCE • 503</text>
</svg>