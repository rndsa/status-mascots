<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <linearGradient id="body-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="visor-glass" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
  </defs>
  <style>
    @keyframes wrenchTap {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(-22deg); }
    }
    @keyframes workNod {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-4px); }
    }
    .wrench-tool { animation: wrenchTap 1.2s ease-in-out infinite; transform-origin: 110px 120px; }
    .bot-work { animation: workNod 2s ease-in-out infinite; }
  </style>

  <g class="bot-work">
    <!-- Yellow Builder Hardhat -->
    <path d="M 44 44 Q 80 18 116 44 Z" fill="#eab308"/>
    <rect x="38" y="42" width="84" height="8" rx="4" fill="#ca8a04"/>
    <!-- LED Spotlight on helmet -->
    <ellipse cx="80" cy="36" rx="6" ry="4" fill="#fef08a"/>

    <!-- Helmet -->
    <rect x="38" y="46" width="84" height="66" rx="26" fill="url(#body-grad)" stroke="#cbd5e1" stroke-width="2.5"/>
    <rect x="47" y="56" width="66" height="42" rx="16" fill="url(#visor-glass)"/>

    <!-- Focused Determined Eyes -->
    <circle cx="66" cy="74" r="6" fill="#38bdf8"/>
    <circle cx="68.5" cy="72" r="2.5" fill="#ffffff"/>
    <circle cx="94" cy="74" r="6" fill="#38bdf8"/>
    <circle cx="96.5" cy="72" r="2.5" fill="#ffffff"/>

    <!-- Confident Smile -->
    <path d="M 76 84 Q 80 88 84 84" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Torso -->
    <rect x="63" y="112" width="34" height="22" rx="10" fill="url(#body-grad)" stroke="#cbd5e1" stroke-width="2"/>
    <ellipse cx="50" cy="120" rx="5.5" ry="7" fill="#94a3b8"/>

    <!-- Hand with Animated Tapping Wrench -->
    <g class="wrench-tool">
      <ellipse cx="110" cy="118" rx="5.5" ry="7" fill="#94a3b8"/>
      <!-- Steel Wrench -->
      <line x1="110" y1="118" x2="132" y2="98" stroke="#94a3b8" stroke-width="5" stroke-linecap="round"/>
      <path d="M 128 94 A 7 7 0 1 1 138 104 L 132 98 Z" fill="#64748b"/>
    </g>
  </g>
</svg>