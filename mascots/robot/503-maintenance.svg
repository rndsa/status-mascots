<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <linearGradient id="astro-head-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="astro-visor-glass" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="hardhat-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#facc15"/>
      <stop offset="100%" stop-color="#eab308"/>
    </linearGradient>
    <filter id="astro-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#020617" flood-opacity="0.25"/>
    </filter>
  </defs>
  <style>
    @keyframes workNod {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-5px); }
    }
    .head-work { animation: workNod 1.8s ease-in-out infinite; }
  </style>

  <ellipse cx="80" cy="148" rx="34" ry="6" fill="#000000" opacity="0.18"/>

  <g class="head-work">
    <!-- Yellow Builder Hardhat on top of Helmet -->
    <path d="M 40 44 C 40 22 120 22 120 44 Z" fill="url(#hardhat-grad)" stroke="#ca8a04" stroke-width="2"/>
    <rect x="34" y="42" width="92" height="6" rx="3" fill="#ca8a04"/>
    <!-- Hardhat Crest -->
    <rect x="76" y="24" width="8" height="18" rx="2" fill="#fef08a"/>

    <rect x="22" y="70" width="8" height="28" rx="4" fill="#94a3b8"/>
    <rect x="130" y="70" width="8" height="28" rx="4" fill="#94a3b8"/>

    <rect x="28" y="38" width="104" height="92" rx="34" fill="url(#astro-head-grad)" stroke="#cbd5e1" stroke-width="2.5" filter="url(#astro-shadow)"/>
    <rect x="38" y="54" width="84" height="60" rx="24" fill="url(#astro-visor-glass)"/>

    <!-- Confident smiling eyes (^ ^) -->
    <path d="M 52 85 Q 62 72 72 85" fill="none" stroke="#38bdf8" stroke-width="4.5" stroke-linecap="round"/>
    <path d="M 88 85 Q 98 72 108 85" fill="none" stroke="#38bdf8" stroke-width="4.5" stroke-linecap="round"/>

    <!-- Confident grin -->
    <path d="M 75 96 Q 80 102 85 96" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>
  </g>
  <text x="80" y="146" font-family="monospace" font-size="10" font-weight="bold" fill="#eab308" text-anchor="middle">MAINTENANCE (503)</text>
</svg>