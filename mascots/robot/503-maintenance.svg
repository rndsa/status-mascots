<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <linearGradient id="r-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
  </defs>
  <style>
    @keyframes fix-tap { 0%, 100% { transform: rotate(0deg); } 50% { transform: rotate(-18deg); } }
    .wrench-hand { animation: fix-tap 1.4s ease-in-out infinite; transform-origin: 110px 115px; }
  </style>
  <g>
    <!-- Construction Hardhat Yellow -->
    <path d="M 45 44 Q 80 20 115 44 Z" fill="#eab308"/>
    <rect x="40" y="42" width="80" height="7" rx="3.5" fill="#ca8a04"/>
    <!-- Head -->
    <rect x="38" y="46" width="84" height="66" rx="24" fill="url(#r-grad)" stroke="#cbd5e1" stroke-width="2.5"/>
    <rect x="47" y="56" width="66" height="40" rx="15" fill="#0f172a"/>
    <!-- Determined / Cute Focused Eyes -->
    <circle cx="66" cy="74" r="6" fill="#38bdf8"/>
    <circle cx="68" cy="72" r="2.5" fill="#ffffff"/>
    <circle cx="94" cy="74" r="6" fill="#38bdf8"/>
    <circle cx="96" cy="72" r="2.5" fill="#ffffff"/>
    <!-- Confident Smile -->
    <path d="M 76 83 Q 80 87 84 83" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
    <!-- Body -->
    <rect x="62" y="114" width="36" height="24" rx="10" fill="url(#r-grad)" stroke="#cbd5e1" stroke-width="2"/>
    <!-- Left Hand -->
    <ellipse cx="50" cy="122" rx="6" ry="7" fill="#94a3b8"/>
    <!-- Right Hand with Wrench -->
    <g class="wrench-hand">
      <ellipse cx="110" cy="120" rx="6" ry="7" fill="#94a3b8"/>
      <!-- Wrench -->
      <line x1="110" y1="120" x2="132" y2="100" stroke="#94a3b8" stroke-width="5" stroke-linecap="round"/>
      <path d="M 128 96 A 7 7 0 1 1 138 106 L 132 100 Z" fill="#64748b"/>
    </g>
  </g>
</svg>