<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <linearGradient id="astro-head-2fa" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e0f2fe"/>
    </linearGradient>
    <linearGradient id="astro-visor-2fa" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#082f49"/>
      <stop offset="100%" stop-color="#021422"/>
    </linearGradient>
    <filter id="astro-shadow-2fa" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#0284c7" flood-opacity="0.3"/>
    </filter>
  </defs>
  <style>
    @keyframes shieldBob {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-5px); }
    }
    @keyframes shieldGlow {
      0%, 100% { opacity: 0.85; filter: drop-shadow(0 0 4px #38bdf8); }
      50% { opacity: 1; filter: drop-shadow(0 0 10px #38bdf8); }
    }
    .head-auth { animation: shieldBob 3s ease-in-out infinite; }
    .shield-hologram { animation: shieldGlow 2s ease-in-out infinite; }
  </style>

  <ellipse cx="80" cy="148" rx="34" ry="6" fill="#000000" opacity="0.18"/>

  <g class="head-auth">
    <rect x="78" y="14" width="4" height="26" rx="2" fill="#38bdf8"/>
    <circle cx="80" cy="14" r="8" fill="#38bdf8"/>

    <rect x="22" y="70" width="8" height="28" rx="4" fill="#38bdf8"/>
    <rect x="130" y="70" width="8" height="28" rx="4" fill="#38bdf8"/>

    <rect x="28" y="38" width="104" height="92" rx="34" fill="url(#astro-head-2fa)" stroke="#38bdf8" stroke-width="2.5" filter="url(#astro-shadow-2fa)"/>

    <rect x="38" y="54" width="84" height="60" rx="24" fill="url(#astro-visor-2fa)"/>

    <!-- Sharp Alert Confident Eyes -->
    <path d="M 52 82 Q 62 72 72 82" fill="none" stroke="#38bdf8" stroke-width="4.5" stroke-linecap="round"/>
    <path d="M 88 82 Q 98 72 108 82" fill="none" stroke="#38bdf8" stroke-width="4.5" stroke-linecap="round"/>

    <!-- Confident Smile -->
    <path d="M 75 96 Q 80 101 85 96" fill="none" stroke="#38bdf8" stroke-width="2.8" stroke-linecap="round"/>
  </g>

  <!-- FOREGROUND 2FA SECURITY SHIELD (HOLOGRAPHIC 6-DIGIT OTP) -->
  <g class="shield-hologram" transform="translate(62, 94)">
    <path d="M 18 0 L 36 6 C 36 22 18 32 18 32 C 18 32 0 22 0 6 Z" fill="#0369a1" stroke="#38bdf8" stroke-width="2"/>
    <!-- Padlock on Shield -->
    <rect x="13" y="14" width="10" height="9" rx="2" fill="#ffffff"/>
    <path d="M 15 14 L 15 10 C 15 7 21 7 21 10 L 21 14" fill="none" stroke="#ffffff" stroke-width="1.8"/>
  </g>

  <text x="80" y="146" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace" font-size="9" font-weight="800" fill="#38bdf8" letter-spacing="1" text-anchor="middle">2FA / OTP VERIFY</text>
</svg>