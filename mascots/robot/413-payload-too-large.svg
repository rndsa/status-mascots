<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <linearGradient id="astro-head-413" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#fee2e2"/>
    </linearGradient>
    <linearGradient id="weight-metal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <filter id="astro-shadow-413" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#ef4444" flood-opacity="0.3"/>
    </filter>
  </defs>
  <style>
    @keyframes squashedStruggle {
      0%, 100% { transform: translateY(6px) scale(1.08, 0.92); }
      50% { transform: translateY(4px) scale(1.04, 0.96); }
    }
    .head-squash { animation: squashedStruggle 1s ease-in-out infinite; transform-origin: 80px 145px; }
  </style>

  <ellipse cx="80" cy="148" rx="38" ry="6" fill="#000000" opacity="0.25"/>

  <g class="head-squash">
    <!-- Bent Antenna under heavy weight -->
    <path d="M 78 40 Q 80 34 88 34" fill="none" stroke="#ef4444" stroke-width="3" stroke-linecap="round"/>

    <rect x="22" y="70" width="8" height="28" rx="4" fill="#ef4444"/>
    <rect x="130" y="70" width="8" height="28" rx="4" fill="#ef4444"/>

    <!-- Squashed Wide Helmet -->
    <rect x="24" y="42" width="112" height="86" rx="32" fill="url(#astro-head-413)" stroke="#ef4444" stroke-width="2.5" filter="url(#astro-shadow-413)"/>

    <rect x="34" y="56" width="92" height="56" rx="22" fill="#180404" stroke="#ef4444" stroke-width="1.5"/>

    <!-- Strained Squeezed Eyes (> <) -->
    <path d="M 50 78 L 62 86 L 50 94" fill="none" stroke="#ef4444" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 110 78 L 98 86 L 110 94" fill="none" stroke="#ef4444" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>

    <path d="M 72 98 Q 80 94 88 98" fill="none" stroke="#ef4444" stroke-width="3" stroke-linecap="round"/>

    <!-- Giant Heavy Weight Bar / File on Head -->
    <polygon points="46,14 114,14 122,34 38,34" fill="url(#weight-metal)" stroke="#94a3b8" stroke-width="2"/>
    <text x="80" y="28" font-family="-apple-system, sans-serif" font-size="11" font-weight="900" fill="#f87171" text-anchor="middle">100 MB</text>
  </g>

  <text x="80" y="146" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace" font-size="9" font-weight="800" fill="#ef4444" letter-spacing="1" text-anchor="middle">PAYLOAD TOO LARGE • 413</text>
</svg>