<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <linearGradient id="astro-head-banned" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#fee2e2"/>
    </linearGradient>
    <linearGradient id="astro-visor-banned" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1c0404"/>
      <stop offset="100%" stop-color="#050101"/>
    </linearGradient>
    <filter id="astro-shadow-ban" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#ef4444" flood-opacity="0.35"/>
    </filter>
  </defs>
  <style>
    @keyframes jailPulse {
      0%, 100% { opacity: 0.9; }
      50% { opacity: 0.4; }
    }
    @keyframes sadDroop {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(3px); }
    }
    .head-banned { animation: sadDroop 2s ease-in-out infinite; }
    .jail-bars { animation: jailPulse 1.2s infinite; }
  </style>

  <ellipse cx="80" cy="148" rx="34" ry="6" fill="#000000" opacity="0.18"/>

  <g class="head-banned">
    <rect x="78" y="14" width="4" height="26" rx="2" fill="#ef4444"/>
    <circle cx="80" cy="14" r="7" fill="#ef4444"/>

    <rect x="22" y="70" width="8" height="28" rx="4" fill="#ef4444"/>
    <rect x="130" y="70" width="8" height="28" rx="4" fill="#ef4444"/>

    <rect x="28" y="38" width="104" height="92" rx="34" fill="url(#astro-head-banned)" stroke="#ef4444" stroke-width="2.5" filter="url(#astro-shadow-ban)"/>

    <rect x="38" y="54" width="84" height="60" rx="24" fill="url(#astro-visor-banned)" stroke="#ef4444" stroke-width="1.5"/>

    <!-- Sad Glum Eyes (> <) -->
    <path d="M 52 82 L 64 88 L 52 94" fill="none" stroke="#ef4444" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 108 82 L 96 88 L 108 94" fill="none" stroke="#ef4444" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Downward frown mouth -->
    <path d="M 74 100 Q 80 94 86 100" fill="none" stroke="#ef4444" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- FOREGROUND RED LASER PRISON BARS (ACCOUNT BANNED) -->
  <g class="jail-bars">
    <line x1="44" y1="30" x2="44" y2="136" stroke="#ef4444" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="68" y1="30" x2="68" y2="136" stroke="#ef4444" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="92" y1="30" x2="92" y2="136" stroke="#ef4444" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="116" y1="30" x2="116" y2="136" stroke="#ef4444" stroke-width="3.5" stroke-linecap="round"/>
    <!-- Top & Bottom Frame Bars -->
    <line x1="36" y1="34" x2="124" y2="34" stroke="#ef4444" stroke-width="4" stroke-linecap="round"/>
    <line x1="36" y1="132" x2="124" y2="132" stroke="#ef4444" stroke-width="4" stroke-linecap="round"/>
  </g>

  <text x="80" y="146" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace" font-size="9" font-weight="800" fill="#ef4444" letter-spacing="1" text-anchor="middle">ACCOUNT SUSPENDED</text>
</svg>