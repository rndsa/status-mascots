<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <linearGradient id="astro-head-red" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#fed7aa"/>
    </linearGradient>
    <linearGradient id="astro-visor-hot" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#431407"/>
      <stop offset="100%" stop-color="#1c0702"/>
    </linearGradient>
    <filter id="astro-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#020617" flood-opacity="0.25"/>
    </filter>
  </defs>
  <style>
    @keyframes fastFan {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes pantingBreath {
      0%, 100% { transform: scale(1, 1); }
      50% { transform: scale(1.04, 0.96); }
    }
    .fan-spin { animation: fastFan 0.15s linear infinite; transform-origin: 80px 14px; }
    .head-pant { animation: pantingBreath 0.5s ease-in-out infinite; transform-origin: 80px 145px; }
  </style>

  <ellipse cx="80" cy="148" rx="34" ry="6" fill="#000000" opacity="0.18"/>

  <g class="head-pant">
    <!-- Spinning Cooling Propeller/Fan on top -->
    <rect x="78" y="14" width="4" height="26" rx="2" fill="#94a3b8"/>
    <g class="fan-spin">
      <ellipse cx="80" cy="14" rx="18" ry="4" fill="#f97316"/>
    </g>

    <rect x="22" y="70" width="8" height="28" rx="4" fill="#f97316"/>
    <rect x="130" y="70" width="8" height="28" rx="4" fill="#f97316"/>

    <rect x="28" y="38" width="104" height="92" rx="34" fill="url(#astro-head-red)" stroke="#ea580c" stroke-width="2.5" filter="url(#astro-shadow)"/>
    <rect x="38" y="54" width="84" height="60" rx="24" fill="url(#astro-visor-hot)" stroke="#f97316" stroke-width="1.5"/>

    <!-- Exhausted spiral eyes -->
    <path d="M 62 82 A 3 3 0 1 1 58 85 A 5 5 0 1 1 65 83" fill="none" stroke="#f97316" stroke-width="2" stroke-linecap="round"/>
    <path d="M 98 82 A 3 3 0 1 1 94 85 A 5 5 0 1 1 101 83" fill="none" stroke="#f97316" stroke-width="2" stroke-linecap="round"/>

    <!-- Panting open mouth -->
    <ellipse cx="80" cy="96" rx="5" ry="4" fill="#f97316"/>
  </g>
  <text x="80" y="146" font-family="monospace" font-size="10" font-weight="bold" fill="#ea580c" text-anchor="middle">OVERHEAT 429</text>
</svg>