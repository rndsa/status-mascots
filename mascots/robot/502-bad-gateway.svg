<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <linearGradient id="astro-head-502" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#fed7aa"/>
      <stop offset="100%" stop-color="#fdba74"/>
    </linearGradient>
    <linearGradient id="astro-visor-502" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2a0c04"/>
      <stop offset="100%" stop-color="#0a0201"/>
    </linearGradient>
    <filter id="astro-shadow-502" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#ea580c" flood-opacity="0.35"/>
    </filter>
    <filter id="spark-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#facc15" flood-opacity="0.8"/>
    </filter>
  </defs>

  <style>
    @keyframes gatewayShiver {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      20% { transform: translateY(-3px) rotate(1.5deg); }
      40% { transform: translateY(2px) rotate(-1.5deg); }
      60% { transform: translateY(-2px) rotate(1deg); }
      80% { transform: translateY(1px) rotate(-1deg); }
    }
    @keyframes electricBoltFlash {
      0%, 100% { opacity: 0.1; }
      25% { opacity: 1; }
      50% { opacity: 0.3; }
      75% { opacity: 1; }
    }
    @keyframes handCableWobble {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-3px); }
    }
    .head-shiver { animation: gatewayShiver 0.7s infinite; transform-origin: 80px 145px; }
    .cable-bolt { animation: electricBoltFlash 0.18s infinite; }
    .cables-group { animation: handCableWobble 1.2s ease-in-out infinite; }
  </style>

  <ellipse cx="80" cy="148" rx="34" ry="6" fill="#000000" opacity="0.18"/>

  <!-- HEAD -->
  <g class="head-shiver">
    <!-- Antenna with Orange Beacon -->
    <rect x="78" y="14" width="4" height="26" rx="2" fill="#ea580c"/>
    <circle cx="80" cy="14" r="8" fill="#ea580c"/>
    <circle cx="82" cy="12" r="2.5" fill="#ffffff"/>

    <rect x="22" y="70" width="8" height="28" rx="4" fill="#ea580c"/>
    <rect x="130" y="70" width="8" height="28" rx="4" fill="#ea580c"/>

    <rect x="28" y="38" width="104" height="92" rx="34" fill="url(#astro-head-502)" stroke="#ea580c" stroke-width="2.5" filter="url(#astro-shadow-502)"/>

    <rect x="38" y="54" width="84" height="60" rx="24" fill="url(#astro-visor-502)" stroke="#ea580c" stroke-width="1.5"/>

    <!-- Wide Shocked Anime Eyes (O O) with Glowing Highlights -->
    <ellipse cx="60" cy="80" rx="10" ry="13" fill="#ea580c"/>
    <ellipse cx="60" cy="80" rx="8" ry="10" fill="#ffffff"/>
    <circle cx="62" cy="78" r="4.5" fill="#ea580c"/>
    <circle cx="64" cy="76" r="2" fill="#ffffff"/>

    <ellipse cx="100" cy="80" rx="10" ry="13" fill="#ea580c"/>
    <ellipse cx="100" cy="80" rx="8" ry="10" fill="#ffffff"/>
    <circle cx="98" cy="78" r="4.5" fill="#ea580c"/>
    <circle cx="96" cy="76" r="2" fill="#ffffff"/>

    <!-- Open Shocked Mouth -->
    <ellipse cx="80" cy="100" rx="6" ry="8" fill="#ea580c"/>
    <ellipse cx="80" cy="100" rx="4" ry="6" fill="#180402"/>

    <!-- Blue Shock Sweat Droplets on Side -->
    <path d="M 120 62 Q 125 68 121 72 Q 117 68 120 62 Z" fill="#38bdf8"/>
    <path d="M 40 62 Q 45 68 41 72 Q 37 68 40 62 Z" fill="#38bdf8"/>
  </g>

  <!-- PROMINENT FOREGROUND HANDS HOLDING SEVERED SPARKING CABLES -->
  <g class="cables-group">
    <!-- Left Hand & Cable Plug -->
    <g>
      <!-- Thick Orange/Black Server Cable coming from left -->
      <path d="M 16 118 Q 38 124 54 116" fill="none" stroke="#1e293b" stroke-width="6" stroke-linecap="round"/>
      <path d="M 16 118 Q 38 124 54 116" fill="none" stroke="#ea580c" stroke-width="3" stroke-linecap="round"/>
      <!-- Plug Connector Block -->
      <rect x="52" y="108" width="14" height="16" rx="4" fill="#334155" stroke="#ea580c" stroke-width="1.5"/>
      <!-- Metallic Severed Wire Pin -->
      <rect x="66" y="113" width="6" height="5" fill="#facc15"/>
      <!-- Floating White Robotic Hand -->
      <circle cx="48" cy="116" r="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.8"/>
      <circle cx="48" cy="116" r="3" fill="#ea580c"/>
    </g>

    <!-- Right Hand & Cable Socket -->
    <g>
      <!-- Thick Orange/Black Server Cable coming from right -->
      <path d="M 144 118 Q 122 124 106 116" fill="none" stroke="#1e293b" stroke-width="6" stroke-linecap="round"/>
      <path d="M 144 118 Q 122 124 106 116" fill="none" stroke="#ea580c" stroke-width="3" stroke-linecap="round"/>
      <!-- Socket Connector Block -->
      <rect x="94" y="108" width="14" height="16" rx="4" fill="#334155" stroke="#ea580c" stroke-width="1.5"/>
      <!-- Metallic Severed Wire Pin -->
      <rect x="88" y="113" width="6" height="5" fill="#facc15"/>
      <!-- Floating White Robotic Hand -->
      <circle cx="112" cy="116" r="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.8"/>
      <circle cx="112" cy="116" r="3" fill="#ea580c"/>
    </g>

    <!-- HIGH-VOLTAGE ELECTRIC ARC SPARKING ACROSS GAP (66px to 88px) -->
    <g class="cable-bolt" filter="url(#spark-glow)">
      <polygon points="70,115 76,106 75,114 82,107 80,116 88,114 81,121 83,115 77,122 78,116" fill="#facc15" stroke="#ffffff" stroke-width="1.2"/>
      <circle cx="72" cy="115" r="2.5" fill="#ffffff"/>
      <circle cx="86" cy="115" r="2.5" fill="#ffffff"/>
      <!-- Tiny Zap Sparks -->
      <line x1="74" y1="104" x2="72" y2="99" stroke="#facc15" stroke-width="1.5" stroke-linecap="round"/>
      <line x1="84" y1="104" x2="87" y2="100" stroke="#facc15" stroke-width="1.5" stroke-linecap="round"/>
      <line x1="78" y1="126" x2="80" y2="130" stroke="#facc15" stroke-width="1.5" stroke-linecap="round"/>
    </g>
  </g>

  <text x="80" y="146" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace" font-size="9" font-weight="800" fill="#ea580c" letter-spacing="1" text-anchor="middle">BAD GATEWAY • 502</text>
</svg>
