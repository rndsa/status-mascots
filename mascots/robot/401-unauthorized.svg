<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <linearGradient id="astro-head-401" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#fee2e2"/>
    </linearGradient>
    <linearGradient id="astro-visor-401" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2a0808"/>
      <stop offset="100%" stop-color="#100202"/>
    </linearGradient>
    <filter id="astro-shadow-401" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#ef4444" flood-opacity="0.3"/>
    </filter>
  </defs>
  <style>
    @keyframes noShake {
      0%, 100% { transform: rotate(0deg); }
      20% { transform: rotate(-8deg); }
      40% { transform: rotate(8deg); }
      60% { transform: rotate(-5deg); }
      80% { transform: rotate(5deg); }
    }
    @keyframes lockBob {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-4px); }
    }
    .head-no { animation: noShake 1.6s ease-in-out infinite; transform-origin: 80px 145px; }
    .lock-float { animation: lockBob 1.8s ease-in-out infinite; }
  </style>

  <ellipse cx="80" cy="148" rx="34" ry="6" fill="#000000" opacity="0.18"/>

  <g class="head-no">
    <!-- Antenna with Locked Red Symbol -->
    <rect x="78" y="18" width="4" height="22" rx="2" fill="#ef4444"/>
    <circle cx="80" cy="18" r="6" fill="#ef4444"/>

    <rect x="22" y="70" width="8" height="28" rx="4" fill="#ef4444"/>
    <rect x="130" y="70" width="8" height="28" rx="4" fill="#ef4444"/>

    <rect x="28" y="38" width="104" height="92" rx="34" fill="url(#astro-head-401)" stroke="#ef4444" stroke-width="2.5" filter="url(#astro-shadow-401)"/>

    <rect x="38" y="54" width="84" height="60" rx="24" fill="url(#astro-visor-401)" stroke="#ef4444" stroke-width="1.5"/>

    <!-- Squinting stern red eyes -->
    <line x1="52" y1="80" x2="68" y2="80" stroke="#ef4444" stroke-width="4.5" stroke-linecap="round"/>
    <line x1="92" y1="80" x2="108" y2="80" stroke="#ef4444" stroke-width="4.5" stroke-linecap="round"/>

    <!-- Disapproving flat mouth line -->
    <line x1="74" y1="96" x2="86" y2="96" stroke="#ef4444" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- FOREGROUND FLOATING DIGITAL PADLOCK + HAND POINTING -->
  <g class="lock-float">
    <!-- Padlock Body -->
    <rect x="72" y="106" width="16" height="13" rx="3" fill="#ef4444" stroke="#ffffff" stroke-width="1.2"/>
    <path d="M 75 106 L 75 101 C 75 97 85 97 85 101 L 85 106" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
    <circle cx="80" cy="112" r="1.5" fill="#ffffff"/>
  </g>

  <text x="80" y="146" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace" font-size="9" font-weight="800" fill="#ef4444" letter-spacing="1" text-anchor="middle">UNAUTHORIZED • 401</text>
</svg>