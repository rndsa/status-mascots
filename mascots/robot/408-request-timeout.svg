<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <linearGradient id="astro-head-408" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="astro-visor-408" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <filter id="astro-shadow-408" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#020617" flood-opacity="0.25"/>
    </filter>
  </defs>
  <style>
    @keyframes sleepDroop {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(6px) rotate(4deg); }
    }
    @keyframes zFloat1 {
      0% { transform: translate(0, 0) scale(0.6); opacity: 0; }
      50% { opacity: 0.9; }
      100% { transform: translate(12px, -24px) scale(1.1); opacity: 0; }
    }
    @keyframes zFloat2 {
      0% { transform: translate(0, 0) scale(0.6); opacity: 0; }
      50% { opacity: 0.9; }
      100% { transform: translate(14px, -26px) scale(1.2); opacity: 0; }
    }
    .head-sleep { animation: sleepDroop 3.6s ease-in-out infinite; transform-origin: 80px 145px; }
    .z-char-1 { animation: zFloat1 2.8s ease-out infinite; }
    .z-char-2 { animation: zFloat2 2.8s ease-out infinite 1.2s; }
  </style>

  <ellipse cx="80" cy="148" rx="34" ry="6" fill="#000000" opacity="0.18"/>

  <!-- Floating Sleeping Zs -->
  <g class="z-char-1" transform="translate(112, 40)">
    <text x="0" y="0" font-family="-apple-system, sans-serif" font-size="14" font-weight="900" fill="#38bdf8">z</text>
  </g>
  <g class="z-char-2" transform="translate(122, 28)">
    <text x="0" y="0" font-family="-apple-system, sans-serif" font-size="18" font-weight="900" fill="#38bdf8">Z</text>
  </g>

  <g class="head-sleep">
    <!-- Dimmed Antenna -->
    <rect x="78" y="14" width="4" height="26" rx="2" fill="#94a3b8"/>
    <circle cx="80" cy="14" r="6" fill="#64748b"/>

    <rect x="22" y="70" width="8" height="28" rx="4" fill="#94a3b8"/>
    <rect x="130" y="70" width="8" height="28" rx="4" fill="#94a3b8"/>

    <rect x="28" y="38" width="104" height="92" rx="34" fill="url(#astro-head-408)" stroke="#94a3b8" stroke-width="2.5" filter="url(#astro-shadow-408)"/>

    <rect x="38" y="54" width="84" height="60" rx="24" fill="url(#astro-visor-408)"/>

    <!-- Sleeping closed line eyes (- -) -->
    <line x1="52" y1="84" x2="68" y2="84" stroke="#38bdf8" stroke-width="4" stroke-linecap="round"/>
    <line x1="92" y1="84" x2="108" y2="84" stroke="#38bdf8" stroke-width="4" stroke-linecap="round"/>

    <!-- Tiny sleeping bubble / snot bubble -->
    <circle cx="80" cy="94" r="5" fill="#38bdf8" opacity="0.7"/>
    <circle cx="82" cy="92" r="1.5" fill="#ffffff"/>
  </g>

  <text x="80" y="146" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace" font-size="9" font-weight="800" fill="#64748b" letter-spacing="1" text-anchor="middle">REQUEST TIMEOUT • 408</text>
</svg>