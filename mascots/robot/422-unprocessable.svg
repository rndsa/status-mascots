<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <linearGradient id="body-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
  </defs>
  <style>
    @keyframes glitchJitter {
      0%, 100% { transform: translate(0, 0); }
      10% { transform: translate(-3px, 1px); }
      30% { transform: translate(3px, -2px); }
      50% { transform: translate(-2px, -1px); }
      70% { transform: translate(2px, 2px); }
      90% { transform: translate(-1px, 2px); }
    }
    @keyframes scanline {
      0% { transform: translateY(0); }
      100% { transform: translateY(44px); }
    }
    .bot-glitch { animation: glitchJitter 0.35s infinite; }
    .scan-bar { animation: scanline 1.2s linear infinite; }
  </style>

  <g class="bot-glitch">
    <!-- Jittered Antenna -->
    <rect x="78" y="24" width="4" height="20" rx="2" fill="#94a3b8"/>
    <circle cx="80" cy="22" r="7" fill="#a855f7"/>

    <!-- Helmet -->
    <rect x="38" y="40" width="84" height="72" rx="28" fill="url(#body-grad)" stroke="#a855f7" stroke-width="2.5"/>

    <!-- Visor with Glitch Scanline -->
    <g>
      <rect x="47" y="52" width="66" height="44" rx="18" fill="#0f172a"/>
      <!-- Scanline bar -->
      <rect x="47" y="52" width="66" height="5" fill="#a855f7" opacity="0.4" class="scan-bar"/>
    </g>

    <!-- Glitched Eyes -->
    <line x1="58" y1="72" x2="72" y2="72" stroke="#a855f7" stroke-width="4" stroke-dasharray="3 2"/>
    <circle cx="94" cy="72" r="6" fill="none" stroke="#a855f7" stroke-width="2.5"/>
    <circle cx="94" cy="72" r="2" fill="#a855f7"/>

    <!-- Static Noise Dots -->
    <circle cx="60" cy="82" r="1.5" fill="#a855f7"/>
    <circle cx="68" cy="85" r="1.5" fill="#a855f7"/>
    <circle cx="98" cy="83" r="1.5" fill="#a855f7"/>

    <!-- Torso -->
    <rect x="63" y="112" width="34" height="22" rx="10" fill="url(#body-grad)" stroke="#a855f7" stroke-width="2"/>
    <ellipse cx="50" cy="120" rx="5.5" ry="7" fill="#94a3b8"/>
    <ellipse cx="110" cy="120" rx="5.5" ry="7" fill="#94a3b8"/>
  </g>
</svg>