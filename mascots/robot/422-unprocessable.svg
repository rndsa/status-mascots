<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <linearGradient id="astro-head-422" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="astro-visor-422" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
  </defs>
  <style>
    @keyframes chromaticJitter {
      0%, 100% { transform: translate(0, 0); }
      20% { transform: translate(-3px, 1.5px); }
      40% { transform: translate(2.5px, -2px); }
      60% { transform: translate(-2px, -1px); }
      80% { transform: translate(3px, 2px); }
    }
    .head-glitch { animation: chromaticJitter 0.22s infinite; }
  </style>

  <ellipse cx="80" cy="148" rx="34" ry="6" fill="#000000" opacity="0.18"/>

  <g class="head-glitch">
    <rect x="78" y="14" width="4" height="26" rx="2" fill="#c084fc"/>
    <circle cx="80" cy="14" r="8" fill="#c084fc"/>

    <rect x="22" y="70" width="8" height="28" rx="4" fill="#c084fc"/>
    <rect x="130" y="70" width="8" height="28" rx="4" fill="#38bdf8"/>

    <!-- Chromatic Aberration Shadow Layers -->
    <rect x="26" y="38" width="104" height="92" rx="34" fill="none" stroke="#c084fc" stroke-width="2" opacity="0.7"/>
    <rect x="30" y="38" width="104" height="92" rx="34" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.7"/>

    <!-- Main Helmet -->
    <rect x="28" y="38" width="104" height="92" rx="34" fill="url(#astro-head-422)" stroke="#94a3b8" stroke-width="2.5"/>

    <rect x="38" y="54" width="84" height="60" rx="24" fill="url(#astro-visor-422)"/>

    <!-- Glitched Mismatched Eyes -->
    <rect x="52" y="80" width="16" height="5" fill="#c084fc"/>
    <rect x="56" y="75" width="8" height="15" fill="#c084fc"/>
    <rect x="92" y="80" width="16" height="5" fill="#38bdf8"/>
    <rect x="96" y="85" width="8" height="10" fill="#38bdf8"/>

    <!-- Error jagged mouth -->
    <path d="M 72 98 L 76 94 L 80 98 L 84 94 L 88 98" fill="none" stroke="#c084fc" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Glitch Slices -->
    <rect x="30" y="72" width="100" height="3" fill="#38bdf8" opacity="0.4"/>
    <rect x="35" y="88" width="90" height="2" fill="#c084fc" opacity="0.5"/>
  </g>

  <text x="80" y="146" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace" font-size="9" font-weight="800" fill="#c084fc" letter-spacing="1" text-anchor="middle">UNPROCESSABLE • 422</text>
</svg>