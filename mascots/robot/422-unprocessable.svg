<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <linearGradient id="astro-head-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f3e8ff"/>
    </linearGradient>
    <linearGradient id="astro-visor-glass" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <filter id="astro-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#020617" flood-opacity="0.25"/>
    </filter>
  </defs>
  <style>
    @keyframes glitchJitter {
      0%, 100% { transform: translate(0, 0); }
      20% { transform: translate(-3px, 1px); }
      40% { transform: translate(2px, -2px); }
      60% { transform: translate(-2px, -1px); }
      80% { transform: translate(3px, 2px); }
    }
    @keyframes scanlineDrop {
      0% { transform: translateY(54px); }
      100% { transform: translateY(114px); }
    }
    .head-glitch { animation: glitchJitter 0.25s infinite; }
    .scanline { animation: scanlineDrop 1s linear infinite; }
  </style>

  <ellipse cx="80" cy="148" rx="34" ry="6" fill="#000000" opacity="0.18"/>

  <g class="head-glitch">
    <rect x="78" y="14" width="4" height="26" rx="2" fill="#94a3b8"/>
    <circle cx="80" cy="14" r="8" fill="#c084fc"/>

    <rect x="22" y="70" width="8" height="28" rx="4" fill="#94a3b8"/>
    <rect x="130" y="70" width="8" height="28" rx="4" fill="#94a3b8"/>

    <rect x="28" y="38" width="104" height="92" rx="34" fill="url(#astro-head-grad)" stroke="#c084fc" stroke-width="2.5" filter="url(#astro-shadow)"/>
    <rect x="38" y="54" width="84" height="60" rx="24" fill="url(#astro-visor-glass)"/>

    <!-- Glitched pixel eyes -->
    <rect x="52" y="80" width="16" height="5" fill="#c084fc"/>
    <rect x="56" y="75" width="8" height="15" fill="#c084fc"/>
    <rect x="92" y="80" width="16" height="5" fill="#38bdf8"/>
    <rect x="96" y="85" width="8" height="10" fill="#38bdf8"/>

    <!-- Scanline beam sweeping down visor -->
    <rect x="38" y="0" width="84" height="4" fill="#c084fc" opacity="0.6" class="scanline"/>
  </g>
  <text x="80" y="146" font-family="monospace" font-size="10" font-weight="bold" fill="#c084fc" text-anchor="middle">PARSER GLITCH</text>
</svg>