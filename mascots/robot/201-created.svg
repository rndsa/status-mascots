<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <linearGradient id="body-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="visor-glass" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
  </defs>
  <style>
    @keyframes happyJump {
      0%, 100% { transform: translateY(0) scale(1, 1); }
      30% { transform: translateY(3px) scale(1.05, 0.95); }
      60% { transform: translateY(-14px) scale(0.96, 1.04) rotate(2deg); }
      80% { transform: translateY(-6px) scale(1.02, 0.98); }
    }
    @keyframes pompomWiggle {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(15deg); }
    }
    @keyframes confetti1 {
      0% { transform: translate(0, 0) scale(0.5); opacity: 0; }
      40% { opacity: 1; }
      100% { transform: translate(-22px, -24px) rotate(180deg) scale(1); opacity: 0; }
    }
    @keyframes confetti2 {
      0% { transform: translate(0, 0) scale(0.5); opacity: 0; }
      40% { opacity: 1; }
      100% { transform: translate(25px, -26px) rotate(-140deg) scale(1); opacity: 0; }
    }
    @keyframes handsUp {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(12deg); }
    }
    .bot-jump { animation: happyJump 1.5s cubic-bezier(0.34, 1.56, 0.64, 1) infinite; transform-origin: center bottom; }
    .pom-pom { animation: pompomWiggle 1.5s infinite; transform-origin: 80px 14px; }
    .cf-left { animation: confetti1 1.8s ease-out infinite; transform-origin: 40px 50px; }
    .cf-right { animation: confetti2 1.8s ease-out infinite 0.2s; transform-origin: 120px 50px; }
    .arm-cheer-l { animation: handsUp 1.5s infinite; transform-origin: 52px 110px; }
    .arm-cheer-r { animation: handsUp 1.5s infinite reverse; transform-origin: 108px 110px; }
  </style>

  <!-- Shadow -->
  <ellipse cx="80" cy="148" rx="24" ry="4" fill="#000000" opacity="0.15"/>

  <!-- Confetti particles -->
  <g class="cf-left">
    <circle cx="36" cy="48" r="3.5" fill="#f43f5e"/>
    <rect x="25" y="36" width="5" height="5" rx="1.5" fill="#3b82f6"/>
  </g>
  <g class="cf-right">
    <circle cx="124" cy="42" r="3" fill="#10b981"/>
    <polygon points="132,32 136,40 128,39" fill="#f59e0b"/>
    <rect x="135" y="52" width="6" height="4" rx="1" fill="#ec4899"/>
  </g>

  <g class="bot-jump">
    <!-- Party Hat -->
    <polygon points="80,12 67,39 93,39" fill="#f59e0b"/>
    <path d="M 69 32 L 87 23" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 72 38 L 91 30" stroke="#f43f5e" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Pom-Pom -->
    <circle cx="80" cy="11" r="5" fill="#ec4899" class="pom-pom"/>

    <!-- Helmet -->
    <rect x="38" y="38" width="84" height="72" rx="28" fill="url(#body-grad)" stroke="#cbd5e1" stroke-width="2.5"/>
    <rect x="47" y="50" width="66" height="44" rx="18" fill="url(#visor-glass)"/>

    <!-- Star Shaped Sparkling Eyes -->
    <path d="M 66 65 L 68 70 L 73 70 L 69 73 L 71 78 L 66 75 L 61 78 L 63 73 L 59 70 L 64 70 Z" fill="#38bdf8"/>
    <path d="M 94 65 L 96 70 L 101 70 L 97 73 L 99 78 L 94 75 L 89 78 L 91 73 L 87 70 L 92 70 Z" fill="#38bdf8"/>

    <!-- Wide Happy Open Mouth -->
    <path d="M 75 80 Q 80 88 85 80 Z" fill="#f43f5e"/>
    <ellipse cx="55" cy="85" rx="5" ry="3" fill="#f43f5e" opacity="0.7"/>
    <ellipse cx="105" cy="85" rx="5" ry="3" fill="#f43f5e" opacity="0.7"/>

    <!-- Torso -->
    <rect x="63" y="112" width="34" height="22" rx="10" fill="url(#body-grad)" stroke="#cbd5e1" stroke-width="2"/>
    <circle cx="80" cy="122" r="3.5" fill="#10b981"/>

    <!-- Cheering Hands Raised High -->
    <g class="arm-cheer-l">
      <ellipse cx="48" cy="102" rx="5.5" ry="8" fill="#94a3b8" transform="rotate(-30 48 102)"/>
    </g>
    <g class="arm-cheer-r">
      <ellipse cx="112" cy="102" rx="5.5" ry="8" fill="#94a3b8" transform="rotate(30 112 102)"/>
    </g>
  </g>
</svg>