<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <linearGradient id="astro-head-201" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e0f2fe"/>
    </linearGradient>
    <linearGradient id="astro-visor-201" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <filter id="astro-shadow-201" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#0284c7" flood-opacity="0.3"/>
    </filter>
  </defs>
  <style>
    @keyframes jumpJoy {
      0%, 100% { transform: translateY(0) scale(1, 1); }
      30% { transform: translateY(6px) scale(1.08, 0.92); }
      55% { transform: translateY(-16px) scale(0.94, 1.06); }
      75% { transform: translateY(-2px) scale(1.02, 0.98); }
    }
    @keyframes starSpin {
      0% { transform: rotate(0deg) scale(1); }
      50% { transform: rotate(180deg) scale(1.2); }
      100% { transform: rotate(360deg) scale(1); }
    }
    @keyframes handsCheer {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }
    .head-jump { animation: jumpJoy 1.8s cubic-bezier(0.28, 0.84, 0.42, 1) infinite; transform-origin: 80px 145px; }
    .star-rot { animation: starSpin 3s linear infinite; transform-origin: 80px 18px; }
    .hands-cheer { animation: handsCheer 1.8s cubic-bezier(0.28, 0.84, 0.42, 1) infinite; }
  </style>

  <ellipse cx="80" cy="148" rx="34" ry="6" fill="#000000" opacity="0.18"/>

  <g class="head-jump">
    <!-- Newly Minted Glowing Gold Star atop Antenna -->
    <rect x="78" y="24" width="4" height="16" rx="2" fill="#94a3b8"/>
    <g class="star-rot">
      <polygon points="80,10 82.5,15.5 88,16.5 84,20.5 85,26 80,23 75,26 76,20.5 72,16.5 77.5,15.5" fill="#facc15" stroke="#eab308" stroke-width="1"/>
      <circle cx="80" cy="18" r="2" fill="#ffffff"/>
    </g>

    <rect x="22" y="70" width="8" height="28" rx="4" fill="#38bdf8"/>
    <rect x="130" y="70" width="8" height="28" rx="4" fill="#38bdf8"/>

    <rect x="28" y="38" width="104" height="92" rx="34" fill="url(#astro-head-201)" stroke="#38bdf8" stroke-width="2.5" filter="url(#astro-shadow-201)"/>

    <rect x="38" y="54" width="84" height="60" rx="24" fill="url(#astro-visor-201)"/>

    <!-- Joyful Sparkling Eyes (^ ^) -->
    <path d="M 52 82 Q 62 70 72 82" fill="none" stroke="#38bdf8" stroke-width="4.5" stroke-linecap="round"/>
    <path d="M 88 82 Q 98 70 108 82" fill="none" stroke="#38bdf8" stroke-width="4.5" stroke-linecap="round"/>

    <!-- Open Happy Laughing Mouth -->
    <path d="M 74 92 Q 80 102 86 92 Z" fill="#38bdf8"/>

    <ellipse cx="48" cy="98" rx="6" ry="3.5" fill="#f43f5e" opacity="0.6"/>
    <ellipse cx="112" cy="98" rx="6" ry="3.5" fill="#f43f5e" opacity="0.6"/>

    <!-- Confetti Dots -->
    <circle cx="36" cy="46" r="2.5" fill="#facc15"/>
    <circle cx="124" cy="46" r="2.5" fill="#ec4899"/>
    <polygon points="120,32 122,36 118,36" fill="#38bdf8"/>
  </g>

  <!-- TWO RAISED CHEERING ROBOTIC HANDS -->
  <g class="hands-cheer">
    <!-- Left Cheering Hand -->
    <rect x="18" y="98" width="12" height="15" rx="5" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" transform="rotate(-25 24 105)"/>
    <circle cx="21" cy="96" r="2" fill="#38bdf8"/>
    <!-- Right Cheering Hand -->
    <rect x="130" y="98" width="12" height="15" rx="5" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" transform="rotate(25 136 105)"/>
    <circle cx="139" cy="96" r="2" fill="#38bdf8"/>
  </g>

  <text x="80" y="146" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace" font-size="9" font-weight="800" fill="#38bdf8" letter-spacing="1" text-anchor="middle">CREATED • 201</text>
</svg>