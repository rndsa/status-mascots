<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <linearGradient id="cloud-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#bae6fd"/>
    </linearGradient>
    <filter id="cloud-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#0284c7" flood-opacity="0.25"/>
    </filter>
  </defs>
  <style>
    @keyframes tiltCloud {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(-15deg); }
    }
    @keyframes qmarkBob {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-7px) rotate(4deg); }
    }
    .head-tilt { animation: tiltCloud 2.6s ease-in-out infinite; transform-origin: 80px 145px; }
    .qmark-box { animation: qmarkBob 2s ease-in-out infinite; transform-origin: 130px 30px; }
  </style>

  <ellipse cx="80" cy="142" rx="34" ry="6" fill="#000000" opacity="0.18"/>

  <g class="qmark-box">
    <ellipse cx="130" cy="30" rx="14" ry="14" fill="#141722" stroke="#38bdf8" stroke-width="2"/>
    <text x="130" y="38" font-family="-apple-system, sans-serif" font-size="20" font-weight="900" fill="#38bdf8" text-anchor="middle">?</text>
  </g>

  <g class="head-tilt">
    <path d="M 38 98 C 22 98 18 78 32 66 C 30 46 52 38 68 44 C 80 30 106 30 118 46 C 134 46 142 64 134 80 C 144 94 130 108 116 108 L 42 108 Z" 
          fill="url(#cloud-grad)" stroke="#7dd3fc" stroke-width="2.5" filter="url(#cloud-glow)"/>

    <!-- Puzzled Eyes: Left spiral @, Right dot . -->
    <path d="M 62 76 A 4 4 0 1 1 58 80 A 7 7 0 1 1 67 78" fill="none" stroke="#0c4a6e" stroke-width="2.8" stroke-linecap="round"/>
    <ellipse cx="98" cy="80" rx="6" ry="8" fill="#0c4a6e"/>
    <circle cx="100" cy="78" r="2.2" fill="#ffffff"/>

    <circle cx="80" cy="92" r="4.5" fill="#0c4a6e"/>
  </g>
</svg>