<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <linearGradient id="cloud-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#fee2e2"/>
    </linearGradient>
    <filter id="cloud-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#ef4444" flood-opacity="0.3"/>
    </filter>
  </defs>
  <style>
    @keyframes cloudNoShake {
      0%, 100% { transform: rotate(0deg); }
      20% { transform: rotate(-10deg); }
      40% { transform: rotate(10deg); }
      60% { transform: rotate(-7deg); }
      80% { transform: rotate(7deg); }
    }
    .head-no { animation: cloudNoShake 1.4s ease-in-out infinite; transform-origin: 80px 145px; }
  </style>

  <ellipse cx="80" cy="142" rx="34" ry="6" fill="#000000" opacity="0.18"/>

  <g class="head-no">
    <!-- Red padlock -->
    <rect x="72" y="14" width="16" height="13" rx="3" fill="#ef4444"/>
    <path d="M 75 14 L 75 9 C 75 4 85 4 85 9 L 85 14" fill="none" stroke="#ef4444" stroke-width="2.5" stroke-linecap="round"/>

    <path d="M 38 98 C 22 98 18 78 32 66 C 30 46 52 38 68 44 C 80 30 106 30 118 46 C 134 46 142 64 134 80 C 144 94 130 108 116 108 L 42 108 Z" 
          fill="url(#cloud-grad)" stroke="#ef4444" stroke-width="2.5" filter="url(#cloud-glow)"/>

    <!-- Squinting warning eyes -->
    <line x1="52" y1="78" x2="68" y2="78" stroke="#ef4444" stroke-width="3.8" stroke-linecap="round"/>
    <line x1="92" y1="78" x2="108" y2="78" stroke="#ef4444" stroke-width="3.8" stroke-linecap="round"/>

    <path d="M 72 92 Q 76 88 80 92 Q 84 96 88 92" fill="none" stroke="#ef4444" stroke-width="3" stroke-linecap="round"/>
  </g>
</svg>