<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <linearGradient id="cloud-hot-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fed7aa"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
  </defs>
  <style>
    @keyframes pantingBreath {
      0%, 100% { transform: scale(1, 1); }
      50% { transform: scale(1.05, 0.95); }
    }
    .head-pant { animation: pantingBreath 0.5s ease-in-out infinite; transform-origin: 80px 145px; }
  </style>

  <ellipse cx="80" cy="142" rx="34" ry="6" fill="#000000" opacity="0.18"/>

  <g class="head-pant">
    <path d="M 38 98 C 22 98 18 78 32 66 C 30 46 52 38 68 44 C 80 30 106 30 118 46 C 134 46 142 64 134 80 C 144 94 130 108 116 108 L 42 108 Z" 
          fill="url(#cloud-hot-grad)" stroke="#c2410c" stroke-width="2.5"/>

    <!-- Exhausted spiral eyes -->
    <path d="M 62 78 A 3 3 0 1 1 58 81 A 5 5 0 1 1 65 79" fill="none" stroke="#7c2d12" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 98 78 A 3 3 0 1 1 94 81 A 5 5 0 1 1 101 79" fill="none" stroke="#7c2d12" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Open mouth with tongue out -->
    <ellipse cx="80" cy="92" rx="6" ry="5" fill="#7c2d12"/>
    <path d="M 78 94 Q 80 102 82 94 Z" fill="#f43f5e"/>

    <ellipse cx="46" cy="90" rx="7" ry="4" fill="#f97316" opacity="0.7"/>
    <ellipse cx="114" cy="90" rx="7" ry="4" fill="#f97316" opacity="0.7"/>
  </g>
  <text x="80" y="146" font-family="monospace" font-size="10" font-weight="bold" fill="#ea580c" text-anchor="middle">OVERHEAT 429</text>
</svg>