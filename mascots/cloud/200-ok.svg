<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <linearGradient id="cloud-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e0f2fe"/>
    </linearGradient>
  </defs>
  <style>
    @keyframes float-cloud { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-7px); } }
    .nimbus { animation: float-cloud 3s ease-in-out infinite; }
  </style>
  <g class="nimbus">
    <!-- Smiling Sun Peeking -->
    <circle cx="115" cy="55" r="16" fill="#facc15"/>
    <!-- Fluffy Cloud Body -->
    <path d="M 45 105 C 30 105 30 85 45 80 C 45 60 70 50 85 65 C 100 50 125 60 120 80 C 135 85 135 105 120 105 Z" fill="url(#cloud-grad)" stroke="#bae6fd" stroke-width="2.5"/>
    <!-- Cute Eyes -->
    <circle cx="70" cy="85" r="4" fill="#0369a1"/>
    <circle cx="71" cy="83" r="1.5" fill="#ffffff"/>
    <circle cx="95" cy="85" r="4" fill="#0369a1"/>
    <circle cx="96" cy="83" r="1.5" fill="#ffffff"/>
    <path d="M 80 92 Q 83 95 86 92" fill="none" stroke="#0369a1" stroke-width="2" stroke-linecap="round"/>
    <ellipse cx="62" cy="90" rx="4" ry="2.5" fill="#f43f5e" opacity="0.6"/>
    <ellipse cx="103" cy="90" rx="4" ry="2.5" fill="#f43f5e" opacity="0.6"/>
  </g>
</svg>