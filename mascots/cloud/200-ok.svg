<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <linearGradient id="cloud-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#bae6fd"/>
    </linearGradient>
  </defs>
  <style>
    @keyframes cloudDrift {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-7px); }
    }
    .cloud { animation: cloudDrift 2.5s ease-in-out infinite; }
  </style>

  <!-- Rainbow Behind -->
  <path d="M 35 110 A 55 55 0 0 1 125 110" fill="none" stroke="#f43f5e" stroke-width="4" opacity="0.6"/>
  <path d="M 39 110 A 51 51 0 0 1 121 110" fill="none" stroke="#fbbf24" stroke-width="4" opacity="0.6"/>
  <path d="M 43 110 A 47 47 0 0 1 117 110" fill="none" stroke="#34d399" stroke-width="4" opacity="0.6"/>

  <g class="cloud">
    <!-- Cloud Puffs -->
    <path d="M 45 105 C 32 105 30 85 45 80 C 45 60 70 50 85 65 C 100 50 125 60 125 80 C 138 85 138 105 125 105 Z" fill="url(#cloud-grad)" stroke="#38bdf8" stroke-width="2"/>
    <!-- Smiling face (^ ^) -->
    <path d="M 68 84 Q 74 78 80 84" fill="none" stroke="#0369a1" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 90 84 Q 96 78 102 84" fill="none" stroke="#0369a1" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Pink Cheeks -->
    <circle cx="62" cy="88" r="4" fill="#f43f5e" opacity="0.4"/>
    <circle cx="108" cy="88" r="4" fill="#f43f5e" opacity="0.4"/>
  </g>
</svg>