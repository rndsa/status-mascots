<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <linearGradient id="cloud-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#bae6fd"/>
    </linearGradient>
    <filter id="cloud-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#0284c7" flood-opacity="0.25"/>
    </filter>
  </defs>
  <style>
    @keyframes cloudBob {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-7px) rotate(1.5deg); }
    }
    @keyframes sunSpin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes eyeBlink {
      0%, 92%, 100% { transform: scaleY(1); }
      96% { transform: scaleY(0.1); }
    }
    .head-cloud { animation: cloudBob 3s ease-in-out infinite; transform-origin: 80px 145px; }
    .sun-back { animation: sunSpin 20s linear infinite; transform-origin: 115px 45px; }
    .blink-eye { animation: eyeBlink 3.6s infinite; transform-origin: 62px 82px; }
  </style>

  <ellipse cx="80" cy="142" rx="34" ry="6" fill="#000000" opacity="0.18"/>

  <g class="head-cloud">
    <!-- Golden Sun peeking from top-right -->
    <g class="sun-back">
      <circle cx="115" cy="45" r="16" fill="#facc15"/>
      <line x1="115" y1="22" x2="115" y2="18" stroke="#facc15" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="115" y1="68" x2="115" y2="72" stroke="#facc15" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="92" y1="45" x2="88" y2="45" stroke="#facc15" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="138" y1="45" x2="142" y2="45" stroke="#facc15" stroke-width="2.5" stroke-linecap="round"/>
    </g>

    <!-- Fluffy Cloud Head Shape -->
    <path d="M 38 98 C 22 98 18 78 32 66 C 30 46 52 38 68 44 C 80 30 106 30 118 46 C 134 46 142 64 134 80 C 144 94 130 108 116 108 L 42 108 Z" 
          fill="url(#cloud-grad)" stroke="#7dd3fc" stroke-width="2.5" filter="url(#cloud-glow)"/>

    <!-- Left Eye (Big Anime Pupil) -->
    <g class="blink-eye">
      <ellipse cx="62" cy="78" rx="8" ry="11" fill="#0c4a6e"/>
      <circle cx="65" cy="74" r="3.5" fill="#ffffff"/>
      <circle cx="60" cy="83" r="1.8" fill="#ffffff"/>
    </g>

    <!-- Right Eye (Cheerful Wink Arc) -->
    <path d="M 88 80 Q 98 68 108 80" fill="none" stroke="#0c4a6e" stroke-width="4.5" stroke-linecap="round"/>

    <!-- Cute Smiling Mouth -->
    <path d="M 75 90 Q 80 97 85 90" fill="none" stroke="#0c4a6e" stroke-width="3" stroke-linecap="round"/>

    <!-- Pink Cheeks -->
    <ellipse cx="48" cy="90" rx="7" ry="4" fill="#f43f5e" opacity="0.6"/>
    <ellipse cx="112" cy="90" rx="7" ry="4" fill="#f43f5e" opacity="0.6"/>
  </g>
</svg>