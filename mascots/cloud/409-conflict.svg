<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <linearGradient id="cloud-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#fee2e2"/>
    </linearGradient>
    <filter id="cloud-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#ef4444" flood-opacity="0.3"/>
    </filter>
  </defs>
  <style>
    @keyframes shockCloud {
      0%, 100% { transform: rotate(0deg); }
      15% { transform: rotate(-8deg); }
      30% { transform: rotate(8deg); }
      45% { transform: rotate(-6deg); }
      60% { transform: rotate(5deg); }
      75% { transform: rotate(-3deg); }
    }
    @keyframes rainDrop {
      0% { transform: translateY(0); opacity: 0; }
      50% { opacity: 1; }
      100% { transform: translateY(22px); opacity: 0; }
    }
    .head-shock { animation: shockCloud 0.75s ease-in-out infinite; transform-origin: 80px 145px; }
    .rain-tear { animation: rainDrop 1s infinite; }
  </style>

  <ellipse cx="80" cy="142" rx="34" ry="6" fill="#000000" opacity="0.18"/>

  <g class="head-shock">
    <path d="M 38 98 C 22 98 18 78 32 66 C 30 46 52 38 68 44 C 80 30 106 30 118 46 C 134 46 142 64 134 80 C 144 94 130 108 116 108 L 42 108 Z" 
          fill="url(#cloud-grad)" stroke="#ef4444" stroke-width="2.5" filter="url(#cloud-glow)"/>

    <!-- Squeezed X Eyes (> <) -->
    <path d="M 52 74 L 64 82 L 52 90" fill="none" stroke="#ef4444" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 108 74 L 96 82 L 108 90" fill="none" stroke="#ef4444" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Quivering mouth -->
    <path d="M 72 92 Q 76 87 80 92 Q 84 97 88 92" fill="none" stroke="#ef4444" stroke-width="3" stroke-linecap="round"/>

    <!-- Raining anime tears -->
    <g class="rain-tear" transform="translate(60, 86)">
      <ellipse cx="0" cy="0" rx="3" ry="5.5" fill="#38bdf8"/>
    </g>
    <g class="rain-tear" transform="translate(100, 86)">
      <ellipse cx="0" cy="0" rx="3" ry="5.5" fill="#38bdf8"/>
    </g>
  </g>
</svg>