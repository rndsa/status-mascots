<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <linearGradient id="cloud-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#bae6fd"/>
    </linearGradient>
    <filter id="cloud-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#0284c7" flood-opacity="0.25"/>
    </filter>
  </defs>
  <style>
    @keyframes happyJump {
      0%, 100% { transform: translateY(0) scale(1, 1); }
      30% { transform: translateY(6px) scale(1.08, 0.92); }
      55% { transform: translateY(-16px) scale(0.94, 1.06); }
      75% { transform: translateY(-2px) scale(1.02, 0.98); }
    }
    .head-jump { animation: happyJump 1.8s cubic-bezier(0.28, 0.84, 0.42, 1) infinite; transform-origin: 80px 145px; }
  </style>

  <ellipse cx="80" cy="142" rx="34" ry="6" fill="#000000" opacity="0.18"/>

  <g class="head-jump">
    <!-- Rainbow arc behind cloud -->
    <path d="M 40 70 A 45 45 0 0 1 120 70" fill="none" stroke="#f43f5e" stroke-width="4"/>
    <path d="M 44 70 A 41 41 0 0 1 116 70" fill="none" stroke="#facc15" stroke-width="4"/>
    <path d="M 48 70 A 37 37 0 0 1 112 70" fill="none" stroke="#38bdf8" stroke-width="4"/>

    <!-- Party Hat -->
    <polygon points="80,14 68,38 92,38" fill="#ec4899"/>
    <circle cx="80" cy="12" r="4.5" fill="#facc15"/>

    <path d="M 38 98 C 22 98 18 78 32 66 C 30 46 52 38 68 44 C 80 30 106 30 118 46 C 134 46 142 64 134 80 C 144 94 130 108 116 108 L 42 108 Z" 
          fill="url(#cloud-grad)" stroke="#7dd3fc" stroke-width="2.5" filter="url(#cloud-glow)"/>

    <!-- Joyful Closed Eyes (^ ^) -->
    <path d="M 52 78 Q 62 66 72 78" fill="none" stroke="#0c4a6e" stroke-width="4.5" stroke-linecap="round"/>
    <path d="M 88 78 Q 98 66 108 78" fill="none" stroke="#0c4a6e" stroke-width="4.5" stroke-linecap="round"/>

    <!-- Happy Open Mouth -->
    <path d="M 74 88 Q 80 98 86 88 Z" fill="#f43f5e"/>

    <ellipse cx="48" cy="90" rx="7" ry="4" fill="#f43f5e" opacity="0.6"/>
    <ellipse cx="112" cy="90" rx="7" ry="4" fill="#f43f5e" opacity="0.6"/>
  </g>
</svg>