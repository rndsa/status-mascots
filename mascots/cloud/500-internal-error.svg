<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <linearGradient id="cloud-dark-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <style>
    @keyframes terrorShiver {
      0%, 100% { transform: translate(0, 0); }
      20% { transform: translate(-3px, 2px); }
      40% { transform: translate(3px, -2px); }
      60% { transform: translate(-2px, -2px); }
      80% { transform: translate(2px, 2px); }
    }
    @keyframes lightningFlash {
      0%, 100% { opacity: 0; }
      50% { opacity: 1; }
    }
    .head-terror { animation: terrorShiver 0.25s infinite; transform-origin: 80px 145px; }
    .lightning-strike { animation: lightningFlash 0.35s infinite; }
  </style>

  <ellipse cx="80" cy="142" rx="34" ry="6" fill="#000000" opacity="0.18"/>

  <!-- Thunderstorm Lightning Strike -->
  <polygon points="80,108 72,126 82,126 70,146 90,120 78,120" fill="#facc15" class="lightning-strike"/>

  <g class="head-terror">
    <path d="M 38 98 C 22 98 18 78 32 66 C 30 46 52 38 68 44 C 80 30 106 30 118 46 C 134 46 142 64 134 80 C 144 94 130 108 116 108 L 42 108 Z" 
          fill="url(#cloud-dark-grad)" stroke="#ef4444" stroke-width="2.5"/>

    <!-- Wide Spooked Eyes O_O -->
    <ellipse cx="60" cy="74" rx="9" ry="12" fill="#ef4444"/>
    <circle cx="62" cy="71" r="3" fill="#ffffff"/>

    <ellipse cx="98" cy="74" rx="9" ry="12" fill="#ef4444"/>
    <circle cx="100" cy="71" r="3" fill="#ffffff"/>

    <ellipse cx="80" cy="94" rx="9" ry="12" fill="#0f172a"/>
  </g>
  <text x="80" y="146" font-family="monospace" font-size="10" font-weight="bold" fill="#ef4444" text-anchor="middle">STORM CRASH (500)</text>
</svg>