<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <linearGradient id="duck-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#eab308"/>
    </linearGradient>
    <linearGradient id="beak-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
  </defs>
  <style>
    @keyframes duckFade {
      0%, 100% { opacity: 0.95; }
      50% { opacity: 0.25; }
    }
    @keyframes lookLR {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-6px); }
      75% { transform: translateX(6px); }
    }
    .head-fade { animation: duckFade 3s ease-in-out infinite; }
    .eyes-roam { animation: lookLR 2.6s ease-in-out infinite; }
  </style>

  <ellipse cx="80" cy="148" rx="34" ry="6" fill="#000000" opacity="0.18"/>

  <g class="head-fade">
    <!-- Detective Hat -->
    <path d="M 44 42 C 44 26 116 26 116 42 Z" fill="#78350f"/>
    <ellipse cx="80" cy="42" rx="42" ry="6" fill="#92400e"/>

    <rect x="28" y="40" width="104" height="90" rx="45" fill="url(#duck-grad)" stroke="#ca8a04" stroke-width="2.5"/>

    <!-- Roaming eyes -->
    <g class="eyes-roam">
      <ellipse cx="60" cy="80" rx="7" ry="9" fill="#451a03"/>
      <circle cx="62" cy="77" r="2.5" fill="#ffffff"/>

      <ellipse cx="98" cy="80" rx="7" ry="9" fill="#451a03"/>
      <circle cx="100" cy="77" r="2.5" fill="#ffffff"/>
    </g>

    <ellipse cx="80" cy="98" rx="18" ry="10" fill="url(#beak-grad)" stroke="#c2410c" stroke-width="2"/>
  </g>
  <text x="80" y="146" font-family="monospace" font-size="10" font-weight="bold" fill="#64748b" text-anchor="middle">SEARCHING (404)</text>
</svg>