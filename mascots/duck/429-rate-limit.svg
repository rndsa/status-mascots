<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <linearGradient id="duck-hot-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fed7aa"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
  </defs>
  <style>
    @keyframes pantingBreath {
      0%, 100% { transform: scale(1, 1); }
      50% { transform: scale(1.05, 0.95); }
    }
    .head-pant { animation: pantingBreath 0.5s ease-in-out infinite; transform-origin: 80px 145px; }
  </style>

  <ellipse cx="80" cy="148" rx="34" ry="6" fill="#000000" opacity="0.18"/>

  <g class="head-pant">
    <rect x="28" y="40" width="104" height="90" rx="45" fill="url(#duck-hot-grad)" stroke="#ea580c" stroke-width="2.5"/>

    <!-- Exhausted spiral eyes -->
    <path d="M 60 80 A 3 3 0 1 1 56 83 A 5 5 0 1 1 63 81" fill="none" stroke="#7c2d12" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 98 80 A 3 3 0 1 1 94 83 A 5 5 0 1 1 101 81" fill="none" stroke="#7c2d12" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Open beak with tongue out -->
    <ellipse cx="80" cy="98" rx="18" ry="10" fill="#ea580c"/>
    <path d="M 78 100 Q 80 110 82 100 Z" fill="#f43f5e"/>

    <ellipse cx="44" cy="94" rx="7" ry="4" fill="#f97316" opacity="0.7"/>
    <ellipse cx="116" cy="94" rx="7" ry="4" fill="#f97316" opacity="0.7"/>
  </g>
  <text x="80" y="146" font-family="monospace" font-size="10" font-weight="bold" fill="#ea580c" text-anchor="middle">OVERHEAT 429</text>
</svg>