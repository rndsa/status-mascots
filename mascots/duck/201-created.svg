<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <linearGradient id="duck-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#eab308"/>
    </linearGradient>
    <linearGradient id="beak-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <filter id="duck-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#ca8a04" flood-opacity="0.3"/>
    </filter>
  </defs>
  <style>
    @keyframes happyJump {
      0%, 100% { transform: translateY(0) scale(1, 1); }
      30% { transform: translateY(6px) scale(1.08, 0.92); }
      55% { transform: translateY(-16px) scale(0.94, 1.06); }
      75% { transform: translateY(-2px) scale(1.02, 0.98); }
    }
    .head-jump { animation: happyJump 1.8s cubic-bezier(0.28, 0.84, 0.42, 1) infinite; transform-origin: 80px 145px; }
  </style>

  <ellipse cx="80" cy="148" rx="34" ry="6" fill="#000000" opacity="0.18"/>

  <g class="head-jump">
    <!-- Party Hat -->
    <polygon points="80,14 66,40 94,40" fill="#ec4899"/>
    <circle cx="80" cy="12" r="4.5" fill="#38bdf8"/>

    <rect x="28" y="40" width="104" height="90" rx="45" fill="url(#duck-grad)" stroke="#ca8a04" stroke-width="2.5" filter="url(#duck-glow)"/>

    <!-- Joyful Closed Eyes (^ ^) -->
    <path d="M 52 80 Q 62 68 72 80" fill="none" stroke="#451a03" stroke-width="4.5" stroke-linecap="round"/>
    <path d="M 88 80 Q 98 68 108 80" fill="none" stroke="#451a03" stroke-width="4.5" stroke-linecap="round"/>

    <ellipse cx="80" cy="98" rx="22" ry="12" fill="url(#beak-grad)" stroke="#c2410c" stroke-width="2"/>
    <ellipse cx="80" cy="94" rx="16" ry="6" fill="#f97316"/>
    <circle cx="76" cy="94" r="1.5" fill="#7c2d12"/>
    <circle cx="84" cy="94" r="1.5" fill="#7c2d12"/>

    <ellipse cx="44" cy="94" rx="7" ry="4" fill="#f43f5e" opacity="0.6"/>
    <ellipse cx="116" cy="94" rx="7" ry="4" fill="#f43f5e" opacity="0.6"/>
  </g>
</svg>