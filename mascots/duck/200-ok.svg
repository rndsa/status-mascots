<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <linearGradient id="duck-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#eab308"/>
    </linearGradient>
    <linearGradient id="beak-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <filter id="duck-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#ca8a04" flood-opacity="0.3"/>
    </filter>
  </defs>
  <style>
    @keyframes duckBob {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-7px) rotate(1.5deg); }
    }
    @keyframes tuftWiggle {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(8deg); }
    }
    @keyframes eyeBlink {
      0%, 92%, 100% { transform: scaleY(1); }
      96% { transform: scaleY(0.1); }
    }
    .head-duck { animation: duckBob 3s ease-in-out infinite; transform-origin: 80px 145px; }
    .tuft { animation: tuftWiggle 2s ease-in-out infinite; transform-origin: 80px 38px; }
    .blink-eye { animation: eyeBlink 3.6s infinite; transform-origin: 60px 80px; }
  </style>

  <ellipse cx="80" cy="148" rx="34" ry="6" fill="#000000" opacity="0.18"/>

  <g class="head-duck">
    <!-- Feather Tuft on top -->
    <g class="tuft">
      <path d="M 80 40 Q 84 20 72 16 Q 86 24 80 40" fill="#facc15"/>
      <path d="M 80 40 Q 88 22 96 18 Q 88 30 80 40" fill="#eab308"/>
    </g>

    <!-- Chibi Duck Head Base (Rounded Squircle) -->
    <rect x="28" y="40" width="104" height="90" rx="45" fill="url(#duck-grad)" stroke="#ca8a04" stroke-width="2.5" filter="url(#duck-glow)"/>

    <!-- Left Eye (Big Anime Pupil) -->
    <g class="blink-eye">
      <ellipse cx="60" cy="80" rx="8" ry="11" fill="#451a03"/>
      <circle cx="63" cy="76" r="3.5" fill="#ffffff"/>
      <circle cx="58" cy="85" r="1.8" fill="#ffffff"/>
    </g>

    <!-- Right Eye (Cheerful Wink Arc) -->
    <path d="M 90 82 Q 100 70 110 82" fill="none" stroke="#451a03" stroke-width="4.5" stroke-linecap="round"/>

    <!-- Orange Duck Beak -->
    <ellipse cx="80" cy="98" rx="22" ry="12" fill="url(#beak-grad)" stroke="#c2410c" stroke-width="2"/>
    <ellipse cx="80" cy="94" rx="16" ry="6" fill="#f97316"/>
    <!-- Nostrils on beak -->
    <circle cx="76" cy="94" r="1.5" fill="#7c2d12"/>
    <circle cx="84" cy="94" r="1.5" fill="#7c2d12"/>

    <!-- Pink Cheeks -->
    <ellipse cx="44" cy="94" rx="7" ry="4" fill="#f43f5e" opacity="0.6"/>
    <ellipse cx="116" cy="94" rx="7" ry="4" fill="#f43f5e" opacity="0.6"/>
  </g>
</svg>