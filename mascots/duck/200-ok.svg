<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <linearGradient id="duck-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#eab308"/>
    </linearGradient>
  </defs>
  <style>
    @keyframes duckFloat {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      50% { transform: translateY(-6px) rotate(2deg); }
    }
    @keyframes waterRipple {
      0%, 100% { transform: scaleX(1); opacity: 0.8; }
      50% { transform: scaleX(1.08); opacity: 0.4; }
    }
    .duck-float { animation: duckFloat 2.2s ease-in-out infinite; transform-origin: 80px 110px; }
    .ripple { animation: waterRipple 2s ease-in-out infinite; transform-origin: 80px 130px; }
  </style>

  <g class="duck-float">
    <ellipse cx="75" cy="105" rx="36" ry="24" fill="url(#duck-grad)" stroke="#ca8a04" stroke-width="2"/>
    <path d="M 40 105 Q 35 95 44 95" fill="none" stroke="#ca8a04" stroke-width="4" stroke-linecap="round"/>
    <circle cx="95" cy="72" r="22" fill="url(#duck-grad)" stroke="#ca8a04" stroke-width="2"/>
    <ellipse cx="118" cy="76" rx="10" ry="6" fill="#f97316"/>
    <!-- Sunglasses -->
    <rect x="90" y="64" width="24" height="10" rx="3" fill="#0f172a"/>
    <line x1="90" y1="67" x2="80" y2="70" stroke="#0f172a" stroke-width="2"/>
  </g>
  <!-- Water ripples -->
  <path d="M 35 128 Q 80 138 125 128" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" class="ripple"/>
</svg>