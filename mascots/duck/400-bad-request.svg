<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <linearGradient id="duck-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#eab308"/>
    </linearGradient>
    <linearGradient id="beak-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <filter id="duck-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#ca8a04" flood-opacity="0.3"/>
    </filter>
  </defs>
  <style>
    @keyframes tiltDuck {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(-15deg); }
    }
    @keyframes qmarkBob {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-7px) rotate(4deg); }
    }
    .head-tilt { animation: tiltDuck 2.6s ease-in-out infinite; transform-origin: 80px 145px; }
    .qmark-box { animation: qmarkBob 2s ease-in-out infinite; transform-origin: 130px 30px; }
  </style>

  <ellipse cx="80" cy="148" rx="34" ry="6" fill="#000000" opacity="0.18"/>

  <g class="qmark-box">
    <ellipse cx="130" cy="30" rx="14" ry="14" fill="#141722" stroke="#eab308" stroke-width="2"/>
    <text x="130" y="38" font-family="-apple-system, sans-serif" font-size="20" font-weight="900" fill="#eab308" text-anchor="middle">?</text>
  </g>

  <g class="head-tilt">
    <path d="M 80 40 Q 84 20 72 16 Q 86 24 80 40" fill="#facc15"/>

    <rect x="28" y="40" width="104" height="90" rx="45" fill="url(#duck-grad)" stroke="#ca8a04" stroke-width="2.5" filter="url(#duck-glow)"/>

    <!-- Puzzled Eyes: Left spiral @, Right dot . -->
    <path d="M 60 78 A 4 4 0 1 1 56 82 A 7 7 0 1 1 65 80" fill="none" stroke="#451a03" stroke-width="2.8" stroke-linecap="round"/>
    <ellipse cx="98" cy="82" rx="6" ry="8" fill="#451a03"/>
    <circle cx="100" cy="80" r="2.2" fill="#ffffff"/>

    <ellipse cx="80" cy="98" rx="18" ry="10" fill="url(#beak-grad)" stroke="#c2410c" stroke-width="2"/>
  </g>
</svg>