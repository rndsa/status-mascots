<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <linearGradient id="duck-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#eab308"/>
    </linearGradient>
    <linearGradient id="beak-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
  </defs>
  <style>
    @keyframes workNod {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-5px); }
    }
    .head-work { animation: workNod 1.8s ease-in-out infinite; }
  </style>

  <ellipse cx="80" cy="148" rx="34" ry="6" fill="#000000" opacity="0.18"/>

  <g class="head-work">
    <rect x="28" y="40" width="104" height="90" rx="45" fill="url(#duck-grad)" stroke="#ca8a04" stroke-width="2.5"/>

    <!-- Worker Headband (Hachimaki) with Red Sun -->
    <path d="M 28 58 Q 80 50 132 58 L 132 66 Q 80 58 28 66 Z" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
    <circle cx="80" cy="61" r="4.5" fill="#ef4444"/>

    <!-- Confident smiling eyes (^ ^) -->
    <path d="M 52 80 Q 62 68 72 80" fill="none" stroke="#451a03" stroke-width="4.5" stroke-linecap="round"/>
    <path d="M 88 80 Q 98 68 108 80" fill="none" stroke="#451a03" stroke-width="4.5" stroke-linecap="round"/>

    <ellipse cx="80" cy="98" rx="18" ry="10" fill="url(#beak-grad)" stroke="#c2410c" stroke-width="2"/>
  </g>
  <text x="80" y="146" font-family="monospace" font-size="10" font-weight="bold" fill="#eab308" text-anchor="middle">MAINTENANCE (503)</text>
</svg>