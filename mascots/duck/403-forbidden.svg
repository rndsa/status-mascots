<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <linearGradient id="duck-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#eab308"/>
    </linearGradient>
    <filter id="duck-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#ef4444" flood-opacity="0.3"/>
    </filter>
  </defs>
  <style>
    @keyframes sternDuck {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-4px); }
    }
    .head-stern { animation: sternDuck 2s ease-in-out infinite; }
  </style>

  <ellipse cx="80" cy="148" rx="34" ry="6" fill="#000000" opacity="0.18"/>

  <g class="head-stern">
    <rect x="28" y="40" width="104" height="90" rx="45" fill="url(#duck-grad)" stroke="#ef4444" stroke-width="2.5" filter="url(#duck-glow)"/>

    <!-- Stern flat line eyes (- -) -->
    <line x1="52" y1="78" x2="68" y2="78" stroke="#ef4444" stroke-width="4.5" stroke-linecap="round"/>
    <line x1="92" y1="78" x2="108" y2="78" stroke="#ef4444" stroke-width="4.5" stroke-linecap="round"/>

    <!-- Clamped flat beak -->
    <rect x="64" y="94" width="32" height="10" rx="5" fill="#ea580c" stroke="#b91c1c" stroke-width="2"/>
    <line x1="66" y1="99" x2="94" y2="99" stroke="#7c2d12" stroke-width="2"/>
  </g>
  <line x1="24" y1="140" x2="136" y2="140" stroke="#ef4444" stroke-width="2" stroke-dasharray="6 3"/>
</svg>