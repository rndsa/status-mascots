<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <style>
    @keyframes whirl { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    .vortex { animation: whirl 2s linear infinite; transform-origin: 80px 85px; }
  </style>
  <g class="vortex">
    <circle cx="80" cy="85" r="45" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="10 5"/>
    <circle cx="80" cy="85" r="30" fill="none" stroke="#0284c7" stroke-width="2.5" stroke-dasharray="8 4"/>
    <circle cx="80" cy="85" r="16" fill="none" stroke="#0369a1" stroke-width="3"/>
    <!-- Duck caught in center -->
    <ellipse cx="80" cy="85" rx="14" ry="10" fill="#fde047"/>
    <ellipse cx="90" cy="85" rx="4" ry="2.5" fill="#f97316"/>
  </g>
  <text x="80" y="145" font-family="monospace" font-size="10" font-weight="bold" fill="#0284c7" text-anchor="middle">DRAINING (422)</text>
</svg>