<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <style>
      @keyframes floatHappy {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-5px) rotate(2deg); }
      }
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.8; r: 5px; }
        50% { opacity: 1; r: 6.5px; }
      }
      .bot-float { animation: floatHappy 3s ease-in-out infinite; transform-origin: center bottom; }
      .antenna-led { animation: pulseGlow 1.5s ease-in-out infinite; }
    </style>
  </defs>
  <g class="bot-float">
    <!-- Antenna -->
    <line x1="60" y1="32" x2="60" y2="12" stroke="#3a3f50" stroke-width="4" stroke-linecap="round"/>
    <circle class="antenna-led" cx="60" cy="10" r="5" fill="#00f0ff"/>
    <!-- Ears -->
    <rect x="18" y="44" width="8" height="32" rx="4" fill="#222634"/>
    <rect x="94" y="44" width="8" height="32" rx="4" fill="#222634"/>
    <!-- Helmet -->
    <rect x="24" y="28" width="72" height="66" rx="24" fill="#ffffff" stroke="#e1e4ea" stroke-width="2"/>
    <!-- Visor -->
    <rect x="30" y="36" width="60" height="42" rx="14" fill="#10131a"/>
    <path d="M36 42 L52 42" stroke="#252b3b" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Happy Eyes (^ ^) -->
    <path d="M38 58 Q44 48 50 58" stroke="#00f0ff" stroke-width="3.5" stroke-linecap="round" fill="none"/>
    <path d="M70 58 Q76 48 82 58" stroke="#00f0ff" stroke-width="3.5" stroke-linecap="round" fill="none"/>
    <!-- Cheeks -->
    <ellipse cx="40" cy="65" rx="3.5" ry="2" fill="#ff6b8b"/>
    <ellipse cx="80" cy="65" rx="3.5" ry="2" fill="#ff6b8b"/>
  </g>
</svg>