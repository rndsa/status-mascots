<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <style>
      @keyframes steamPuff {
        0% { opacity: 0; transform: translateY(0) scale(0.6); }
        50% { opacity: 0.8; }
        100% { opacity: 0; transform: translateY(-12px) scale(1.2); }
      }
      .steam { animation: steamPuff 1.6s ease-out infinite; transform-origin: center; }
    </style>
  </defs>
  <!-- Steam Puffs -->
  <circle class="steam" cx="22" cy="30" r="4" fill="#cbd5e1"/>
  <circle class="steam" cx="18" cy="20" r="5" fill="#e2e8f0" style="animation-delay: 0.4s;"/>
  <!-- Teapot Spout on Left -->
  <path d="M34 56 C20 54, 14 38, 22 34 C26 36, 26 44, 34 50 Z" fill="#f59e0b"/>
  <!-- Teapot Handle on Right -->
  <path d="M86 46 C102 46, 104 74, 86 78 C96 74, 94 50, 86 46 Z" fill="#f59e0b"/>
  <!-- Main Teapot Pot -->
  <ellipse cx="60" cy="62" rx="32" ry="26" fill="#fbbf24"/>
  <!-- Lid -->
  <ellipse cx="60" cy="40" rx="18" ry="6" fill="#f59e0b"/>
  <circle cx="60" cy="34" r="4" fill="#d97706"/>
  <!-- Cute Happy Face (^ o ^) -->
  <path d="M48 58 Q52 54 56 58" stroke="#78350f" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <path d="M64 58 Q68 54 72 58" stroke="#78350f" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <ellipse cx="60" cy="66" rx="3" ry="4" fill="#78350f"/>
</svg>