<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <linearGradient id="ghost-head-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e0e7ff"/>
    </linearGradient>
  </defs>
  <style>
    @keyframes ghostFade {
      0%, 100% { opacity: 0.95; }
      50% { opacity: 0.28; }
    }
    @keyframes lookLR {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-6px); }
      75% { transform: translateX(6px); }
    }
    .head-fade { animation: ghostFade 3s ease-in-out infinite; }
    .eyes-look { animation: lookLR 2.6s ease-in-out infinite; }
  </style>

  <ellipse cx="80" cy="148" rx="34" ry="6" fill="#000000" opacity="0.18"/>

  <g class="head-fade">
    <!-- Detective Sherlock Hat -->
    <path d="M 44 42 C 44 26 116 26 116 42 Z" fill="#78350f"/>
    <ellipse cx="80" cy="42" rx="42" ry="6" fill="#92400e"/>

    <path d="M 32 80 C 32 46 54 28 80 28 C 106 28 128 46 128 80 C 128 114 116 132 100 132 C 90 132 86 124 80 124 C 74 124 70 132 60 132 C 44 132 32 114 32 80 Z" 
          fill="url(#ghost-head-grad)" stroke="#c7d2fe" stroke-width="2.5"/>

    <!-- Eyes looking left & right -->
    <g class="eyes-look">
      <ellipse cx="64" cy="78" rx="7" ry="9" fill="#1e1b4b"/>
      <circle cx="66" cy="75" r="2.5" fill="#ffffff"/>

      <ellipse cx="96" cy="78" rx="7" ry="9" fill="#1e1b4b"/>
      <circle cx="98" cy="75" r="2.5" fill="#ffffff"/>
    </g>

    <ellipse cx="80" cy="92" rx="3.5" ry="4.5" fill="#1e1b4b"/>
  </g>
  <text x="80" y="146" font-family="monospace" font-size="10" font-weight="bold" fill="#64748b" text-anchor="middle">VANISHED (404)</text>
</svg>