<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <linearGradient id="ghost-head-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#fee2e2"/>
    </linearGradient>
    <filter id="ghost-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#f87171" flood-opacity="0.25"/>
    </filter>
  </defs>
  <style>
    @keyframes ghostNoShake {
      0%, 100% { transform: rotate(0deg); }
      20% { transform: rotate(-10deg); }
      40% { transform: rotate(10deg); }
      60% { transform: rotate(-7deg); }
      80% { transform: rotate(7deg); }
    }
    .head-no { animation: ghostNoShake 1.4s ease-in-out infinite; transform-origin: 80px 145px; }
  </style>

  <ellipse cx="80" cy="148" rx="34" ry="6" fill="#000000" opacity="0.18"/>

  <g class="head-no">
    <!-- Red padlock above head -->
    <rect x="72" y="16" width="16" height="13" rx="3" fill="#ef4444"/>
    <path d="M 75 16 L 75 11 C 75 6 85 6 85 11 L 85 16" fill="none" stroke="#ef4444" stroke-width="2.5" stroke-linecap="round"/>

    <path d="M 32 80 C 32 46 54 28 80 28 C 106 28 128 46 128 80 C 128 114 116 132 100 132 C 90 132 86 124 80 124 C 74 124 70 132 60 132 C 44 132 32 114 32 80 Z" 
          fill="url(#ghost-head-grad)" stroke="#fca5a5" stroke-width="2.5" filter="url(#ghost-glow)"/>

    <!-- Squinting denying eyes -->
    <line x1="52" y1="76" x2="68" y2="76" stroke="#ef4444" stroke-width="3.8" stroke-linecap="round"/>
    <line x1="92" y1="76" x2="108" y2="76" stroke="#ef4444" stroke-width="3.8" stroke-linecap="round"/>

    <!-- Wavy denying mouth -->
    <path d="M 72 90 Q 76 86 80 90 Q 84 94 88 90" fill="none" stroke="#ef4444" stroke-width="3" stroke-linecap="round"/>
  </g>
</svg>