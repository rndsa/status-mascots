<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <linearGradient id="g-body" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e0e7ff"/>
    </linearGradient>
  </defs>
  <style>
    @keyframes ghostBounceWall {
      0%, 100% { transform: translateX(0); }
      30% { transform: translateX(12px) scaleX(0.9); }
      40% { transform: translateX(-4px) scaleX(1.05); }
      60% { transform: translateX(2px); }
    }
    @keyframes lockFlashG {
      0%, 100% { stroke: #ef4444; }
      50% { stroke: #f59e0b; }
    }
    .ghost-bump { animation: ghostBounceWall 2s cubic-bezier(0.34, 1.56, 0.64, 1) infinite; transform-origin: center bottom; }
    .wall-lock { animation: lockFlashG 1.5s infinite; }
  </style>

  <!-- Spectral Lock Barrier Wall -->
  <line x1="125" y1="25" x2="125" y2="135" stroke="#ef4444" stroke-width="3" stroke-dasharray="6 4" class="wall-lock"/>
  <rect x="117" y="68" width="16" height="18" rx="4" fill="#ef4444"/>
  <path d="M 121 68 L 121 62 C 121 58 129 58 129 62 L 129 68" fill="none" stroke="#ef4444" stroke-width="2.5"/>

  <g class="ghost-bump">
    <path d="M 35 75 C 35 42 50 32 70 32 C 90 32 105 42 105 75 C 105 106 112 126 100 128 C 88 130 82 118 70 118 C 58 118 52 130 40 128 C 28 126 35 106 35 75 Z" fill="url(#g-body)" stroke="#cbd5e1" stroke-width="2.5"/>
    <!-- Scared / Denied Eyes -->
    <line x1="52" y1="65" x2="62" y2="65" stroke="#ef4444" stroke-width="3" stroke-linecap="round"/>
    <line x1="78" y1="65" x2="88" y2="65" stroke="#ef4444" stroke-width="3" stroke-linecap="round"/>
    <!-- Wavy sad mouth -->
    <path d="M 65 76 Q 70 71 75 76" fill="none" stroke="#ef4444" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Paws bumped flat -->
    <ellipse cx="106" cy="74" rx="4" ry="7" fill="#ffffff" stroke="#ef4444" stroke-width="2"/>
  </g>
</svg>