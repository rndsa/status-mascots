<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <linearGradient id="g-body" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#ede9fe"/>
    </linearGradient>
    <filter id="soft-shadow-g" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#7c3aed" flood-opacity="0.2"/>
    </filter>
  </defs>
  <style>
    @keyframes bumpBarrier {
      0%, 100% { transform: translateX(0); }
      40% { transform: translateX(12px) scaleX(0.92); }
      55% { transform: translateX(-4px) scaleX(1.04); }
    }
    @keyframes barrierPulse {
      0%, 100% { stroke-opacity: 0.4; }
      50% { stroke-opacity: 0.9; }
    }
    .ghost-bump { animation: bumpBarrier 2s ease-in-out infinite; transform-origin: 75px 80px; }
    .shield-line { animation: barrierPulse 2s ease-in-out infinite; }
  </style>

  <!-- Glowing Red Cyber Shield -->
  <line x1="118" y1="28" x2="118" y2="135" stroke="#ef4444" stroke-width="3" stroke-dasharray="6 4" class="shield-line"/>
  <rect x="110" y="70" width="16" height="15" rx="3" fill="#ef4444"/>
  <path d="M 114 70 L 114 64 C 114 59 122 59 122 64 L 122 70" fill="none" stroke="#ef4444" stroke-width="2.5"/>

  <!-- Ghost squished against barrier -->
  <g class="ghost-bump">
    <path d="M 44 72 C 44 38 58 28 78 28 C 98 28 112 38 112 72 C 112 104 120 125 108 128 C 96 131 90 118 78 118 C 66 118 60 131 48 128 C 36 125 44 104 44 72 Z"
          fill="url(#g-body)" stroke="#ddd6fe" stroke-width="2" filter="url(#soft-shadow-g)"/>

    <!-- Dizzy D-shaped horizontal eyes -->
    <line x1="60" y1="65" x2="72" y2="65" stroke="#2e1065" stroke-width="3" stroke-linecap="round"/>
    <line x1="84" y1="65" x2="96" y2="65" stroke="#2e1065" stroke-width="3" stroke-linecap="round"/>

    <!-- Paws pressed against shield -->
    <ellipse cx="108" cy="62" rx="4" ry="7" fill="#ffffff" stroke="#ddd6fe" stroke-width="1.8"/>
    <ellipse cx="108" cy="80" rx="4" ry="7" fill="#ffffff" stroke="#ddd6fe" stroke-width="1.8"/>

    <!-- Wavy sad mouth -->
    <path d="M 72 75 Q 78 71 84 75" fill="none" stroke="#2e1065" stroke-width="2" stroke-linecap="round"/>
  </g>
</svg>