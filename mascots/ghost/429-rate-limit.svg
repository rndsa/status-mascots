<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <linearGradient id="puddle-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
  </defs>
  <style>
    @keyframes bubbleRise {
      0% { transform: translateY(0) scale(0.6); opacity: 0; }
      50% { opacity: 0.8; }
      100% { transform: translateY(-24px) scale(1); opacity: 0; }
    }
    .bub-1 { animation: bubbleRise 2s ease-out infinite; transform-origin: 65px 95px; }
    .bub-2 { animation: bubbleRise 2s ease-out infinite 0.7s; transform-origin: 95px 95px; }
  </style>

  <!-- Melting Puddle Ghost -->
  <path d="M 35 120 C 35 90 55 85 80 85 C 105 85 125 90 125 120 C 125 132 105 135 80 135 C 55 135 35 132 35 120 Z" fill="url(#puddle-grad)" stroke="#94a3b8" stroke-width="2.5"/>

  <!-- Exhausted swirly eyes on puddle -->
  <ellipse cx="68" cy="105" rx="5" ry="3" fill="#64748b"/>
  <ellipse cx="92" cy="105" rx="5" ry="3" fill="#64748b"/>
  <!-- Panting mouth -->
  <ellipse cx="80" cy="115" rx="4" ry="2.5" fill="#f43f5e"/>

  <!-- Little Soul Bubbles rising -->
  <circle cx="65" cy="85" r="4.5" fill="#a5b4fc" class="bub-1"/>
  <circle cx="95" cy="88" r="3.5" fill="#a5b4fc" class="bub-2"/>
  <text x="80" y="145" font-family="monospace" font-size="9" font-weight="bold" fill="#64748b" text-anchor="middle">RATE LIMITED</text>
</svg>