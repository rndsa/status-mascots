<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <linearGradient id="ghost-hot-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#fed7aa"/>
    </linearGradient>
  </defs>
  <style>
    @keyframes pantingHead {
      0%, 100% { transform: scale(1, 1); }
      50% { transform: scale(1.06, 0.94); }
    }
    .head-pant { animation: pantingHead 0.5s ease-in-out infinite; transform-origin: 80px 145px; }
  </style>

  <ellipse cx="80" cy="148" rx="34" ry="6" fill="#000000" opacity="0.18"/>

  <g class="head-pant">
    <path d="M 32 80 C 32 46 54 28 80 28 C 106 28 128 46 128 80 C 128 114 116 132 100 132 C 90 132 86 124 80 124 C 74 124 70 132 60 132 C 44 132 32 114 32 80 Z" 
          fill="url(#ghost-hot-grad)" stroke="#f97316" stroke-width="2.5"/>

    <!-- Exhausted spiral eyes -->
    <path d="M 64 76 A 3 3 0 1 1 60 79 A 5 5 0 1 1 67 77" fill="none" stroke="#ea580c" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 96 76 A 3 3 0 1 1 92 79 A 5 5 0 1 1 99 77" fill="none" stroke="#ea580c" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Panting open mouth with tongue out -->
    <ellipse cx="80" cy="92" rx="6" ry="5" fill="#ea580c"/>
    <path d="M 78 94 Q 80 102 82 94 Z" fill="#f43f5e"/>

    <!-- Hot red cheeks -->
    <ellipse cx="50" cy="88" rx="7" ry="4" fill="#f97316" opacity="0.7"/>
    <ellipse cx="110" cy="88" rx="7" ry="4" fill="#f97316" opacity="0.7"/>
  </g>
  <text x="80" y="146" font-family="monospace" font-size="10" font-weight="bold" fill="#ea580c" text-anchor="middle">OVERHEAT 429</text>
</svg>