<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <linearGradient id="g-puddle" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#ddd6fe"/>
    </linearGradient>
  </defs>
  <style>
    @keyframes puddleBreathe {
      0%, 100% { transform: scale(1, 1); }
      50% { transform: scale(1.05, 0.95); }
    }
    @keyframes sweatDripGhost {
      0% { transform: translateY(0); opacity: 0; }
      50% { opacity: 0.9; }
      100% { transform: translateY(14px); opacity: 0; }
    }
    .puddle-ghost { animation: puddleBreathe 2s ease-in-out infinite; transform-origin: 80px 115px; }
    .drip { animation: sweatDripGhost 1.4s infinite; }
  </style>

  <!-- Exhausted Melted Puddle -->
  <g class="puddle-ghost">
    <path d="M 32 118 C 25 115 32 95 55 98 C 72 88 88 88 105 98 C 128 95 135 115 128 118 C 115 128 45 128 32 118 Z"
          fill="url(#g-puddle)" stroke="#a78bfa" stroke-width="2"/>

    <!-- Exhausted Spiral Eyes (@ @) -->
    <path d="M 62 104 A 3 3 0 1 1 58 107 A 5 5 0 1 1 65 105" fill="none" stroke="#4c1d95" stroke-width="1.8" stroke-linecap="round"/>
    <path d="M 98 104 A 3 3 0 1 1 94 107 A 5 5 0 1 1 101 105" fill="none" stroke="#4c1d95" stroke-width="1.8" stroke-linecap="round"/>

    <!-- Open panting mouth with tiny tongue -->
    <path d="M 76 108 Q 80 115 84 108" fill="none" stroke="#4c1d95" stroke-width="2"/>
    <circle cx="80" cy="112" r="2.5" fill="#f43f5e"/>

    <!-- Floating Sweat drop -->
    <path d="M 106 82 Q 110 88 106 91 Q 102 88 106 82 Z" fill="#38bdf8" class="drip"/>
  </g>
  <text x="80" y="146" font-family="monospace" font-size="10" font-weight="bold" fill="#a78bfa" text-anchor="middle">COOLED DOWN (429)</text>
</svg>