<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <linearGradient id="g-red" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fee2e2"/>
      <stop offset="100%" stop-color="#fca5a5"/>
    </linearGradient>
  </defs>
  <style>
    @keyframes ghostCryShake {
      0%, 100% { transform: translateX(0) rotate(0deg); }
      20% { transform: translateX(-8px) rotate(-6deg); }
      40% { transform: translateX(8px) rotate(5deg); }
      60% { transform: translateX(-5px) rotate(-3deg); }
      80% { transform: translateX(4px) rotate(2deg); }
    }
    @keyframes tearFlow {
      0% { transform: scaleY(0.6); opacity: 0.6; }
      50% { transform: scaleY(1.1); opacity: 1; }
      100% { transform: scaleY(0.6); opacity: 0.6; }
    }
    .cry-ghost { animation: ghostCryShake 0.9s ease-in-out infinite; transform-origin: 80px 120px; }
    .tears { animation: tearFlow 0.8s infinite; transform-origin: center top; }
  </style>

  <g class="cry-ghost">
    <path d="M 45 75 C 45 42 60 32 80 32 C 100 32 115 42 115 75 C 115 106 122 126 110 128 C 98 130 92 118 80 118 C 68 118 62 130 50 128 C 38 126 45 106 45 75 Z" fill="url(#g-red)" stroke="#f87171" stroke-width="2.5"/>

    <!-- Closed Crying Anime Eyes -->
    <line x1="60" y1="62" x2="72" y2="62" stroke="#ef4444" stroke-width="3" stroke-linecap="round"/>
    <line x1="88" y1="62" x2="100" y2="62" stroke="#ef4444" stroke-width="3" stroke-linecap="round"/>

    <!-- Streaming Blue Waterfall Tears -->
    <g class="tears">
      <path d="M 64 64 C 64 80 62 96 66 96 C 70 96 68 80 68 64 Z" fill="#38bdf8"/>
      <path d="M 92 64 C 92 80 90 96 94 96 C 98 96 96 80 96 64 Z" fill="#38bdf8"/>
    </g>

    <!-- Wavy Trembling Sad Mouth -->
    <path d="M 74 80 Q 80 75 86 80" fill="none" stroke="#ef4444" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Distressed Paws Waving -->
    <ellipse cx="40" cy="85" rx="7" ry="5" fill="#fee2e2" stroke="#f87171" stroke-width="2" transform="rotate(-20 40 85)"/>
    <ellipse cx="120" cy="85" rx="7" ry="5" fill="#fee2e2" stroke="#f87171" stroke-width="2" transform="rotate(20 120 85)"/>
  </g>
</svg>