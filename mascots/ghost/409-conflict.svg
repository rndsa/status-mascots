<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <linearGradient id="g-body" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#ede9fe"/>
    </linearGradient>
    <linearGradient id="tear-stream" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.3"/>
    </linearGradient>
  </defs>
  <style>
    @keyframes tantrumWobble {
      0%, 100% { transform: rotate(0deg) scale(1); }
      20% { transform: rotate(-8deg) scale(1.04); }
      40% { transform: rotate(7deg) scale(0.97); }
      60% { transform: rotate(-5deg) scale(1.02); }
      80% { transform: rotate(4deg) scale(0.99); }
    }
    @keyframes tearFlow {
      0% { transform: scaleY(0.7); opacity: 0.6; }
      50% { transform: scaleY(1.2); opacity: 1; }
      100% { transform: scaleY(0.7); opacity: 0.6; }
    }
    .ghost-tantrum { animation: tantrumWobble 0.75s ease-in-out infinite; transform-origin: 80px 125px; }
    .waterfall-l { animation: tearFlow 0.6s infinite; transform-origin: 64px 68px; }
    .waterfall-r { animation: tearFlow 0.6s infinite 0.3s; transform-origin: 96px 68px; }
  </style>

  <g class="ghost-tantrum">
    <path d="M 46 72 C 46 38 60 28 80 28 C 100 28 114 38 114 72 C 114 104 122 125 110 128 C 98 131 92 118 80 118 C 68 118 62 131 50 128 C 38 125 46 104 46 72 Z"
          fill="url(#g-body)" stroke="#ef4444" stroke-width="2.5"/>

    <!-- Angry Squeezed X Eyes (> <) -->
    <path d="M 58 60 L 70 68 L 58 76" fill="none" stroke="#ef4444" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 102 60 L 90 68 L 102 76" fill="none" stroke="#ef4444" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Waterfall Streaming Anime Tears -->
    <path d="M 64 68 Q 58 100 56 125 Q 64 128 66 68 Z" fill="url(#tear-stream)" class="waterfall-l"/>
    <path d="M 96 68 Q 102 100 104 125 Q 96 128 94 68 Z" fill="url(#tear-stream)" class="waterfall-r"/>

    <!-- Wailing Open Mouth -->
    <path d="M 72 78 Q 80 92 88 78 Z" fill="#991b1b" stroke="#ef4444" stroke-width="2"/>

    <!-- Angry Steam Poof above head -->
    <path d="M 115 32 Q 125 24 122 38 Q 130 38 126 46 Z" fill="#ef4444" opacity="0.8"/>
  </g>
</svg>