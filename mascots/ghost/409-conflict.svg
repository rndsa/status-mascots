<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <linearGradient id="g-grad-c" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fee2e2"/>
      <stop offset="100%" stop-color="#fca5a5"/>
    </linearGradient>
  </defs>
  <style>
    @keyframes ghostShake {
      0% { transform: translateX(0) rotate(0deg); }
      20% { transform: translateX(-12px) rotate(-10deg); }
      40% { transform: translateX(10px) rotate(8deg); }
      60% { transform: translateX(-8px) rotate(-6deg); }
      80% { transform: translateX(6px) rotate(4deg); }
      100% { transform: translateX(0) rotate(0deg); }
    }
    .shake { animation: ghostShake 0.85s ease-in-out infinite; transform-origin: 80px 110px; }
  </style>
  <g class="shake">
    <path d="M 45 75 C 45 45 60 35 80 35 C 100 35 115 45 115 75 C 115 105 120 125 108 128 C 98 130 92 120 80 120 C 68 120 62 130 52 128 C 40 125 45 105 45 75 Z" fill="url(#g-grad-c)" stroke="#f87171" stroke-width="2.5"/>
    <!-- Crying Anime Tears (T_T) -->
    <line x1="60" y1="62" x2="72" y2="62" stroke="#ef4444" stroke-width="3" stroke-linecap="round"/>
    <line x1="66" y1="62" x2="66" y2="76" stroke="#38bdf8" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="88" y1="62" x2="100" y2="62" stroke="#ef4444" stroke-width="3" stroke-linecap="round"/>
    <line x1="94" y1="62" x2="94" y2="76" stroke="#38bdf8" stroke-width="3.5" stroke-linecap="round"/>
    <!-- Wavy sad mouth -->
    <path d="M 74 80 Q 80 75 86 80" fill="none" stroke="#ef4444" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Sweat drop -->
    <path d="M 115 48 Q 120 54 115 58 Q 110 54 115 48 Z" fill="#38bdf8"/>
  </g>
</svg>