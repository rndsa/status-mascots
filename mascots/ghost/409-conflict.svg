<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <linearGradient id="ghost-head-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#fee2e2"/>
    </linearGradient>
    <filter id="ghost-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#ef4444" flood-opacity="0.25"/>
    </filter>
  </defs>
  <style>
    @keyframes tantrumWobble {
      0%, 100% { transform: rotate(0deg); }
      20% { transform: rotate(-9deg); }
      40% { transform: rotate(9deg); }
      60% { transform: rotate(-6deg); }
      80% { transform: rotate(6deg); }
    }
    @keyframes tearStream {
      0% { transform: translateY(0); opacity: 0; }
      50% { opacity: 1; }
      100% { transform: translateY(22px); opacity: 0; }
    }
    .head-tantrum { animation: tantrumWobble 0.75s ease-in-out infinite; transform-origin: 80px 145px; }
    .stream-tear { animation: tearStream 1s infinite; }
  </style>

  <ellipse cx="80" cy="148" rx="34" ry="6" fill="#000000" opacity="0.18"/>

  <g class="head-tantrum">
    <path d="M 32 80 C 32 46 54 28 80 28 C 106 28 128 46 128 80 C 128 114 116 132 100 132 C 90 132 86 124 80 124 C 74 124 70 132 60 132 C 44 132 32 114 32 80 Z" 
          fill="url(#ghost-head-grad)" stroke="#ef4444" stroke-width="2.5" filter="url(#ghost-glow)"/>

    <!-- Squeezed X Eyes (> <) -->
    <path d="M 52 74 L 64 82 L 52 90" fill="none" stroke="#ef4444" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 108 74 L 96 82 L 108 90" fill="none" stroke="#ef4444" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Panicked quivering mouth -->
    <path d="M 72 94 Q 76 89 80 94 Q 84 99 88 94" fill="none" stroke="#ef4444" stroke-width="3" stroke-linecap="round"/>

    <!-- Waterfall Anime Tears streaming from eyes -->
    <g class="stream-tear" transform="translate(60, 84)">
      <ellipse cx="0" cy="0" rx="3.5" ry="6" fill="#38bdf8"/>
    </g>
    <g class="stream-tear" transform="translate(100, 84)">
      <ellipse cx="0" cy="0" rx="3.5" ry="6" fill="#38bdf8"/>
    </g>
  </g>
</svg>