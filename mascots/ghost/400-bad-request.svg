<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <linearGradient id="g-body" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e0e7ff"/>
    </linearGradient>
  </defs>
  <style>
    @keyframes shyFloat {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(-8deg); }
    }
    @keyframes qFloatGhost {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-7px); }
    }
    .ghost-shy { animation: shyFloat 2.4s ease-in-out infinite; transform-origin: 80px 120px; }
    .q-g { animation: qFloatGhost 2s ease-in-out infinite; transform-origin: 122px 35px; }
  </style>

  <!-- Question mark -->
  <g class="q-g">
    <ellipse cx="122" cy="35" rx="13" ry="13" fill="#e0e7ff" stroke="#6366f1" stroke-width="2"/>
    <text x="122" y="42" font-family="-apple-system, sans-serif" font-size="20" font-weight="900" fill="#6366f1" text-anchor="middle">?</text>
  </g>

  <g class="ghost-shy">
    <path d="M 45 75 C 45 42 60 32 80 32 C 100 32 115 42 115 75 C 115 106 122 126 110 128 C 98 130 92 118 80 118 C 68 118 62 130 50 128 C 38 126 45 106 45 75 Z" fill="url(#g-body)" stroke="#cbd5e1" stroke-width="2.5"/>

    <!-- Puzzled spiral eyes -->
    <circle cx="68" cy="65" r="5" fill="none" stroke="#6366f1" stroke-width="2.5"/>
    <ellipse cx="92" cy="65" rx="3.5" ry="5.5" fill="#6366f1"/>
    <!-- Cute shy O mouth -->
    <circle cx="80" cy="74" r="3.5" fill="#6366f1"/>

    <!-- Paws hiding face / touching cheeks -->
    <ellipse cx="56" cy="74" rx="7" ry="5.5" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <ellipse cx="104" cy="74" rx="7" ry="5.5" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <ellipse cx="62" cy="75" rx="6" ry="4" fill="#f43f5e" opacity="0.6"/>
    <ellipse cx="98" cy="75" rx="6" ry="4" fill="#f43f5e" opacity="0.6"/>
  </g>
</svg>