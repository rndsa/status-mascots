<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <linearGradient id="ghost-head-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e0e7ff"/>
    </linearGradient>
    <filter id="ghost-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#818cf8" flood-opacity="0.25"/>
    </filter>
  </defs>
  <style>
    @keyframes tiltGhost {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(-16deg); }
    }
    @keyframes qmarkGhost {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-7px) rotate(4deg); }
    }
    .head-tilt { animation: tiltGhost 2.6s ease-in-out infinite; transform-origin: 80px 145px; }
    .qmark-ghost { animation: qmarkGhost 2s ease-in-out infinite; transform-origin: 130px 30px; }
  </style>

  <ellipse cx="80" cy="148" rx="34" ry="6" fill="#000000" opacity="0.18"/>

  <g class="qmark-ghost">
    <ellipse cx="130" cy="30" rx="14" ry="14" fill="#141722" stroke="#a78bfa" stroke-width="2"/>
    <text x="130" y="38" font-family="-apple-system, sans-serif" font-size="20" font-weight="900" fill="#a78bfa" text-anchor="middle">?</text>
  </g>

  <g class="head-tilt">
    <path d="M 32 80 C 32 46 54 28 80 28 C 106 28 128 46 128 80 C 128 114 116 132 100 132 C 90 132 86 124 80 124 C 74 124 70 132 60 132 C 44 132 32 114 32 80 Z" 
          fill="url(#ghost-head-grad)" stroke="#c7d2fe" stroke-width="2.5" filter="url(#ghost-glow)"/>

    <path d="M 42 42 Q 36 26 50 34 Z" fill="#e0e7ff"/>
    <path d="M 118 42 Q 124 26 110 34 Z" fill="#e0e7ff"/>

    <!-- Puzzled Eyes: Left is spiral @, Right is dot . -->
    <path d="M 64 74 A 4 4 0 1 1 60 78 A 7 7 0 1 1 69 76" fill="none" stroke="#1e1b4b" stroke-width="2.8" stroke-linecap="round"/>
    <ellipse cx="98" cy="78" rx="6" ry="8" fill="#1e1b4b"/>
    <circle cx="100" cy="76" r="2.2" fill="#ffffff"/>

    <!-- Puzzled small O mouth -->
    <circle cx="80" cy="90" r="4.5" fill="#1e1b4b"/>
  </g>
</svg>