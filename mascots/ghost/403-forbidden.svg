<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <linearGradient id="jar-glass" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#bae6fd" stop-opacity="0.5"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#bae6fd" stop-opacity="0.4"/>
    </linearGradient>
  </defs>
  <style>
    @keyframes trapWiggle {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
    }
    .trapped-ghost { animation: trapWiggle 2s ease-in-out infinite; }
  </style>

  <!-- Glass Jar Container (Ghost Trapped inside) -->
  <g class="trapped-ghost">
    <!-- Ghost Inside -->
    <path d="M 52 82 C 52 56 64 48 80 48 C 96 48 108 56 108 82 C 108 106 112 118 102 120 C 94 122 88 112 80 112 C 72 112 66 122 58 120 C 48 118 52 106 52 82 Z" fill="#e0e7ff" opacity="0.9"/>
    <!-- Flat sad eyes -->
    <circle cx="70" cy="74" r="4.5" fill="#4338ca"/>
    <circle cx="90" cy="74" r="4.5" fill="#4338ca"/>
    <path d="M 76 83 Q 80 80 84 83" fill="none" stroke="#4338ca" stroke-width="2"/>
    <!-- Paws pressed against glass -->
    <ellipse cx="60" cy="85" rx="5" ry="4" fill="#ffffff"/>
    <ellipse cx="100" cy="85" rx="5" ry="4" fill="#ffffff"/>
  </g>

  <!-- Glass Jar Outline -->
  <rect x="42" y="38" width="76" height="96" rx="14" fill="url(#jar-glass)" stroke="#38bdf8" stroke-width="2.5"/>
  <!-- Cork Lid -->
  <polygon points="52,38 108,38 104,26 56,26" fill="#d97706" stroke="#92400e" stroke-width="2"/>
  <!-- Red Caution Tape -->
  <rect x="44" y="92" width="72" height="12" fill="#ef4444" opacity="0.8"/>
  <text x="80" y="101" font-family="monospace" font-size="8" font-weight="900" fill="#ffffff" text-anchor="middle">FORBIDDEN</text>
</svg>