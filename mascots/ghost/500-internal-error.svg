<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <linearGradient id="crash-g" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>
  <style>
    @keyframes screamPulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.08) translateY(-4px); }
    }
    @keyframes lightningZap {
      0%, 100% { opacity: 0; }
      20%, 40% { opacity: 1; }
    }
    .screaming { animation: screamPulse 1.2s infinite ease-in-out; transform-origin: 80px 100px; }
    .zap { animation: lightningZap 1.5s infinite; }
  </style>

  <!-- Lightning Bolt Shocking the Ghost -->
  <polygon points="76,10 70,36 82,36 74,62 88,32 78,32" fill="#facc15" class="zap"/>

  <g class="screaming">
    <path d="M 45 75 C 45 42 60 32 80 32 C 100 32 115 42 115 75 C 115 106 122 126 110 128 C 98 130 92 118 80 118 C 68 118 62 130 50 128 C 38 126 45 106 45 75 Z" fill="url(#crash-g)" stroke="#ef4444" stroke-width="2.5"/>

    <!-- Huge Terrified Scream Eyes -->
    <ellipse cx="68" cy="62" rx="7" ry="10" fill="#ffffff"/>
    <circle cx="68" cy="62" r="3" fill="#ef4444"/>
    <ellipse cx="92" cy="62" rx="7" ry="10" fill="#ffffff"/>
    <circle cx="92" cy="62" r="3" fill="#ef4444"/>

    <!-- Big Open Scream Mouth -->
    <ellipse cx="80" cy="85" rx="8" ry="13" fill="#ef4444"/>
    <ellipse cx="80" cy="85" rx="5" ry="9" fill="#000000"/>
  </g>
</svg>