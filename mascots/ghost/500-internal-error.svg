<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <linearGradient id="ghost-head-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e0e7ff"/>
    </linearGradient>
  </defs>
  <style>
    @keyframes terrorShiver {
      0%, 100% { transform: translate(0, 0); }
      20% { transform: translate(-3px, 2px); }
      40% { transform: translate(3px, -2px); }
      60% { transform: translate(-2px, -2px); }
      80% { transform: translate(2px, 2px); }
    }
    @keyframes lightningFlick {
      0%, 100% { opacity: 0; }
      50% { opacity: 1; }
    }
    .head-terror { animation: terrorShiver 0.25s infinite; transform-origin: 80px 145px; }
    .lightning { animation: lightningFlick 0.3s infinite; }
  </style>

  <ellipse cx="80" cy="148" rx="34" ry="6" fill="#000000" opacity="0.18"/>

  <!-- Electric lightning cracks -->
  <g class="lightning">
    <polyline points="28,40 36,52 30,56 40,70" fill="none" stroke="#facc15" stroke-width="2.5" stroke-linecap="round"/>
    <polyline points="132,40 124,52 130,56 120,70" fill="none" stroke="#facc15" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <g class="head-terror">
    <path d="M 32 80 C 32 46 54 28 80 28 C 106 28 128 46 128 80 C 128 114 116 132 100 132 C 90 132 86 124 80 124 C 74 124 70 132 60 132 C 44 132 32 114 32 80 Z" 
          fill="url(#ghost-head-grad)" stroke="#ef4444" stroke-width="2.5"/>

    <!-- Wide Spooked Eyes O_O -->
    <ellipse cx="62" cy="74" rx="9" ry="12" fill="#ef4444"/>
    <circle cx="64" cy="71" r="3" fill="#ffffff"/>

    <ellipse cx="98" cy="74" rx="9" ry="12" fill="#ef4444"/>
    <circle cx="100" cy="71" r="3" fill="#ffffff"/>

    <!-- Screaming gaping mouth -->
    <ellipse cx="80" cy="98" rx="10" ry="14" fill="#1e1b4b"/>
  </g>
  <text x="80" y="146" font-family="monospace" font-size="10" font-weight="bold" fill="#ef4444" text-anchor="middle">PANIC 500</text>
</svg>