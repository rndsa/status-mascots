<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <linearGradient id="ghost-head-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e0e7ff"/>
    </linearGradient>
  </defs>
  <style>
    @keyframes nodWork {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-5px); }
    }
    .head-nod { animation: nodWork 1.8s ease-in-out infinite; }
  </style>

  <ellipse cx="80" cy="148" rx="34" ry="6" fill="#000000" opacity="0.18"/>

  <g class="head-nod">
    <path d="M 32 80 C 32 46 54 28 80 28 C 106 28 128 46 128 80 C 128 114 116 132 100 132 C 90 132 86 124 80 124 C 74 124 70 132 60 132 C 44 132 32 114 32 80 Z" 
          fill="url(#ghost-head-grad)" stroke="#cbd5e1" stroke-width="2.5"/>

    <!-- Japanese White Worker Headband (Hachimaki) with Red Sun Circle -->
    <path d="M 32 58 Q 80 52 128 58 L 128 66 Q 80 60 32 66 Z" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
    <circle cx="80" cy="61" r="4.5" fill="#ef4444"/>

    <!-- Confident smiling eyes (^ ^) -->
    <path d="M 54 78 Q 64 66 74 78" fill="none" stroke="#1e1b4b" stroke-width="4.5" stroke-linecap="round"/>
    <path d="M 86 78 Q 96 66 106 78" fill="none" stroke="#1e1b4b" stroke-width="4.5" stroke-linecap="round"/>

    <!-- Grinning mouth -->
    <path d="M 75 90 Q 80 97 85 90" fill="none" stroke="#1e1b4b" stroke-width="3" stroke-linecap="round"/>
  </g>
  <text x="80" y="146" font-family="monospace" font-size="10" font-weight="bold" fill="#eab308" text-anchor="middle">MAINTENANCE (503)</text>
</svg>