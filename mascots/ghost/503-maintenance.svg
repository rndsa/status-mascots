<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <linearGradient id="g-body" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#ede9fe"/>
    </linearGradient>
  </defs>
  <style>
    @keyframes dustSweep {
      0%, 100% { transform: rotate(-15deg); }
      50% { transform: rotate(25deg); }
    }
    @keyframes ghostNod {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-4px); }
    }
    .duster-action { animation: dustSweep 1.2s ease-in-out infinite; transform-origin: 105px 82px; }
    .ghost-worker { animation: ghostNod 2.2s ease-in-out infinite; }
  </style>

  <g class="ghost-worker">
    <!-- Worker Headband with Knot -->
    <path d="M 46 50 Q 80 44 114 50 L 114 55 Q 80 49 46 55 Z" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
    <circle cx="80" cy="50" r="3" fill="#ef4444"/>
    <!-- Headband tails flying -->
    <path d="M 112 50 Q 124 45 128 54" fill="none" stroke="#2563eb" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Ghost Body -->
    <path d="M 46 72 C 46 38 60 28 80 28 C 100 28 114 38 114 72 C 114 104 122 125 110 128 C 98 131 92 118 80 118 C 68 118 62 131 50 128 C 38 125 46 104 46 72 Z"
          fill="url(#g-body)" stroke="#ddd6fe" stroke-width="2"/>

    <!-- Determined focused eyes (smiling arcs) -->
    <path d="M 64 68 Q 70 62 76 68" fill="none" stroke="#2e1065" stroke-width="3" stroke-linecap="round"/>
    <path d="M 88 68 Q 94 62 100 68" fill="none" stroke="#2e1065" stroke-width="3" stroke-linecap="round"/>

    <!-- Confident Smile -->
    <path d="M 76 75 Q 80 79 84 75" fill="none" stroke="#2e1065" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Left hand on hip -->
    <ellipse cx="44" cy="80" rx="5" ry="4" fill="#ffffff" stroke="#ddd6fe" stroke-width="1.8"/>

    <!-- Right hand holding feather duster dusting -->
    <g class="duster-action">
      <line x1="102" y1="82" x2="124" y2="70" stroke="#78350f" stroke-width="3" stroke-linecap="round"/>
      <!-- Feathers -->
      <path d="M 124 70 C 130 60 142 64 140 74 C 138 82 128 78 124 70 Z" fill="#ec4899"/>
      <path d="M 125 68 C 132 58 140 60 138 68 Z" fill="#38bdf8"/>
    </g>
  </g>
  <text x="80" y="146" font-family="monospace" font-size="10" font-weight="bold" fill="#2563eb" text-anchor="middle">CLEANING SERVER</text>
</svg>