<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <linearGradient id="g-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e0e7ff"/>
    </linearGradient>
  </defs>
  <style>
    @keyframes float-ghost { 0%, 100% { transform: translateY(0px) rotate(0deg); } 50% { transform: translateY(-8px) rotate(3deg); } }
    @keyframes tail { 0%, 100% { transform: skewX(0deg); } 50% { transform: skewX(8deg); } }
    .ghost-body { animation: float-ghost 2.6s ease-in-out infinite; transform-origin: center bottom; }
    .tail { animation: tail 1.8s ease-in-out infinite; transform-origin: 80px 130px; }
  </style>
  <g class="ghost-body">
    <!-- Halo glow -->
    <ellipse cx="80" cy="26" rx="22" ry="5" fill="none" stroke="#a5b4fc" stroke-width="2.5" opacity="0.8"/>
    <!-- Ghost Body -->
    <path d="M 45 75 C 45 45 60 35 80 35 C 100 35 115 45 115 75 C 115 105 120 125 108 128 C 98 130 92 120 80 120 C 68 120 62 130 52 128 C 40 125 45 105 45 75 Z" fill="url(#g-grad)" stroke="#cbd5e1" stroke-width="2.5" class="tail"/>
    <!-- Cute Eyes -->
    <ellipse cx="68" cy="65" rx="5" ry="6.5" fill="#1e1b4b"/>
    <circle cx="70" cy="63" r="2" fill="#ffffff"/>
    <ellipse cx="92" cy="65" rx="5" ry="6.5" fill="#1e1b4b"/>
    <circle cx="94" cy="63" r="2" fill="#ffffff"/>
    <!-- Cheeks pink -->
    <ellipse cx="61" cy="74" rx="5.5" ry="3.5" fill="#f43f5e" opacity="0.6"/>
    <ellipse cx="99" cy="74" rx="5.5" ry="3.5" fill="#f43f5e" opacity="0.6"/>
    <!-- Tiny Smile -->
    <path d="M 76 72 Q 80 77 84 72" fill="none" stroke="#1e1b4b" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Floating Hands -->
    <ellipse cx="40" cy="80" rx="7" ry="5" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" transform="rotate(-20 40 80)"/>
    <ellipse cx="120" cy="80" rx="7" ry="5" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" transform="rotate(20 120 80)"/>
  </g>
</svg>