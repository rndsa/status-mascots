<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <linearGradient id="g-body" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#ede9fe"/>
    </linearGradient>
    <linearGradient id="g-glow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#c4b5fd" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#a78bfa" stop-opacity="0.2"/>
    </linearGradient>
    <filter id="soft-shadow-g" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#7c3aed" flood-opacity="0.2"/>
    </filter>
  </defs>
  <style>
    @keyframes ghostHover {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-9px) rotate(1.8deg); }
    }
    @keyframes tailRipple {
      0%, 100% { transform: skewX(0deg); }
      50% { transform: skewX(8deg); }
    }
    @keyframes eyeBlinkGhost {
      0%, 92%, 100% { transform: scaleY(1); }
      96% { transform: scaleY(0.08); }
    }
    @keyframes haloPulse {
      0%, 100% { transform: scale(1) translateY(0); opacity: 0.7; }
      50% { transform: scale(1.08) translateY(-2px); opacity: 1; }
    }
    @keyframes waveRightPaw {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(26deg); }
    }
    @keyframes starTwinkle {
      0% { transform: scale(0.6) rotate(0deg); opacity: 0; }
      50% { transform: scale(1.15) rotate(90deg); opacity: 1; }
      100% { transform: scale(0.6) rotate(180deg); opacity: 0; }
    }
    .ghost-float { animation: ghostHover 3.2s ease-in-out infinite; transform-origin: center bottom; }
    .tail-flow { animation: tailRipple 2.2s ease-in-out infinite; transform-origin: 80px 125px; }
    .eye-blink { animation: eyeBlinkGhost 4s infinite; transform-origin: 80px 68px; }
    .halo-glow { animation: haloPulse 2.8s ease-in-out infinite; transform-origin: 80px 22px; }
    .paw-wave { animation: waveRightPaw 1.8s ease-in-out infinite; transform-origin: 116px 82px; }
    .star-1 { animation: starTwinkle 2.4s infinite; transform-origin: 118px 46px; }
    .star-2 { animation: starTwinkle 2.4s infinite 1.2s; transform-origin: 38px 56px; }
  </style>

  <!-- Ground Shadow -->
  <ellipse cx="80" cy="148" rx="24" ry="4.5" fill="#7c3aed" opacity="0.12"/>

  <g class="ghost-float">
    <!-- Ethereal Angel Halo -->
    <ellipse cx="80" cy="22" rx="20" ry="5.5" fill="none" stroke="url(#g-glow)" stroke-width="2.5" class="halo-glow"/>

    <!-- Ghost Body with Tail Ripple -->
    <path d="M 46 72 C 46 38 60 28 80 28 C 100 28 114 38 114 72 C 114 104 122 125 110 128 C 98 131 92 118 80 118 C 68 118 62 131 50 128 C 38 125 46 104 46 72 Z"
          fill="url(#g-body)" stroke="#ddd6fe" stroke-width="2" filter="url(#soft-shadow-g)" class="tail-flow"/>

    <!-- Kawaii Eyes with Specular Highlights -->
    <g class="eye-blink">
      <!-- Left Eye -->
      <ellipse cx="68" cy="66" rx="5.5" ry="7.5" fill="#2e1065"/>
      <circle cx="70.5" cy="63.5" r="2.5" fill="#ffffff"/>
      <circle cx="66" cy="69" r="1.2" fill="#ffffff"/>

      <!-- Right Eye -->
      <ellipse cx="92" cy="66" rx="5.5" ry="7.5" fill="#2e1065"/>
      <circle cx="94.5" cy="63.5" r="2.5" fill="#ffffff"/>
      <circle cx="90" cy="69" r="1.2" fill="#ffffff"/>
    </g>

    <!-- Soft Kawaii Pink Blush -->
    <ellipse cx="58" cy="74" rx="6" ry="3.5" fill="#f43f5e" opacity="0.55"/>
    <ellipse cx="102" cy="74" rx="6" ry="3.5" fill="#f43f5e" opacity="0.55"/>

    <!-- Happy Gentle Mouth -->
    <path d="M 76 73 Q 80 78 84 73" fill="none" stroke="#2e1065" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Left Nubby Hand -->
    <ellipse cx="40" cy="82" rx="6.5" ry="5" fill="#ffffff" stroke="#ddd6fe" stroke-width="1.8" transform="rotate(-15 40 82)"/>

    <!-- Right Nubby Hand Waving -->
    <g class="paw-wave">
      <ellipse cx="118" cy="80" rx="6.5" ry="5" fill="#ffffff" stroke="#ddd6fe" stroke-width="1.8"/>
    </g>

    <!-- Magical Twinkle Stars -->
    <g class="star-1">
      <polygon points="118,40 120,44 124,46 120,48 118,52 116,48 112,46 116,44" fill="#a78bfa"/>
    </g>
    <g class="star-2">
      <polygon points="38,50 40,54 44,56 40,58 38,62 36,58 32,56 36,54" fill="#c4b5fd"/>
    </g>
  </g>
</svg>