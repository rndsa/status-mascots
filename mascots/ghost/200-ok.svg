<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <linearGradient id="g-body" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e0e7ff"/>
    </linearGradient>
    <filter id="ghost-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#818cf8" flood-opacity="0.25"/>
    </filter>
  </defs>
  <style>
    @keyframes ghostHover {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-8px) rotate(2deg); }
    }
    @keyframes tailWave {
      0%, 100% { transform: skewX(0deg); }
      50% { transform: skewX(7deg); }
    }
    @keyframes blink {
      0%, 90%, 100% { transform: scaleY(1); }
      95% { transform: scaleY(0.1); }
    }
    @keyframes haloGlow {
      0%, 100% { opacity: 0.6; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.08); }
    }
    @keyframes floatSparkle {
      0% { transform: translateY(0) scale(0.6); opacity: 0; }
      50% { opacity: 0.9; }
      100% { transform: translateY(-16px) scale(1.1); opacity: 0; }
    }
    .ghost-float { animation: ghostHover 3s ease-in-out infinite; transform-origin: center bottom; }
    .ghost-tail { animation: tailWave 2.2s ease-in-out infinite; transform-origin: 80px 125px; }
    .eyes-blink { animation: blink 4s infinite; transform-origin: 80px 65px; }
    .halo { animation: haloGlow 2.5s ease-in-out infinite; transform-origin: 80px 24px; }
    .sp-1 { animation: floatSparkle 2s ease-out infinite; transform-origin: 110px 45px; }
  </style>

  <g class="ghost-float">
    <!-- Soft Neon Halo -->
    <ellipse cx="80" cy="24" rx="22" ry="5.5" fill="none" stroke="#818cf8" stroke-width="2.5" class="halo"/>

    <!-- Ghost Body with Tail Ripple -->
    <path d="M 45 75 C 45 42 60 32 80 32 C 100 32 115 42 115 75 C 115 106 122 126 110 128 C 98 130 92 118 80 118 C 68 118 62 130 50 128 C 38 126 45 106 45 75 Z" fill="url(#g-body)" stroke="#cbd5e1" stroke-width="2.5" filter="url(#ghost-glow)" class="ghost-tail"/>

    <!-- Expressive Eyes -->
    <g class="eyes-blink">
      <ellipse cx="68" cy="65" rx="5.5" ry="7" fill="#1e1b4b"/>
      <circle cx="70.5" cy="63" r="2.2" fill="#ffffff"/>
      <ellipse cx="92" cy="65" rx="5.5" ry="7" fill="#1e1b4b"/>
      <circle cx="94.5" cy="63" r="2.2" fill="#ffffff"/>
    </g>

    <!-- Rosy Cheeks -->
    <ellipse cx="60" cy="74" rx="5.5" ry="3.5" fill="#f43f5e" opacity="0.6"/>
    <ellipse cx="100" cy="74" rx="5.5" ry="3.5" fill="#f43f5e" opacity="0.6"/>

    <!-- Happy Smile -->
    <path d="M 76 72 Q 80 77 84 72" fill="none" stroke="#1e1b4b" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Floating Hands -->
    <ellipse cx="40" cy="80" rx="7" ry="5" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" transform="rotate(-20 40 80)"/>
    <ellipse cx="120" cy="78" rx="7" ry="5" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" transform="rotate(25 120 78)"/>

    <!-- Magic Star Sparkle -->
    <g class="sp-1">
      <polygon points="112,42 114,46 118,46 115,49 116,53 112,50 108,53 109,49 106,46 110,46" fill="#a5b4fc"/>
    </g>
  </g>
</svg>