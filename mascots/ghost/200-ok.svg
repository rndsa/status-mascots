<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <linearGradient id="ghost-head-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e0e7ff"/>
    </linearGradient>
    <filter id="ghost-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#818cf8" flood-opacity="0.25"/>
    </filter>
  </defs>
  <style>
    @keyframes ghostBob {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-8px) rotate(2deg); }
    }
    @keyframes haloGlow {
      0%, 100% { opacity: 0.9; transform: translateY(0) scale(1); }
      50% { opacity: 0.5; transform: translateY(-3px) scale(1.08); }
    }
    @keyframes eyeBlink {
      0%, 90%, 100% { transform: scaleY(1); }
      95% { transform: scaleY(0.1); }
    }
    .head-ghost { animation: ghostBob 3s ease-in-out infinite; transform-origin: 80px 145px; }
    .ghost-halo { animation: haloGlow 2.5s infinite ease-in-out; transform-origin: 80px 22px; }
    .blink-eye { animation: eyeBlink 3.8s infinite; transform-origin: 64px 78px; }
  </style>

  <ellipse cx="80" cy="148" rx="34" ry="6" fill="#000000" opacity="0.18"/>

  <g class="head-ghost">
    <!-- Golden Angelic Cyber Halo -->
    <ellipse cx="80" cy="22" rx="28" ry="7" fill="none" stroke="#facc15" stroke-width="3" class="ghost-halo"/>

    <!-- Head Only Base Shape -->
    <path d="M 32 80 C 32 46 54 28 80 28 C 106 28 128 46 128 80 C 128 114 116 132 100 132 C 90 132 86 124 80 124 C 74 124 70 132 60 132 C 44 132 32 114 32 80 Z" 
          fill="url(#ghost-head-grad)" stroke="#c7d2fe" stroke-width="2.5" filter="url(#ghost-glow)"/>

    <!-- Cute little ghost ear nubs -->
    <path d="M 42 42 Q 36 26 50 34 Z" fill="#e0e7ff"/>
    <path d="M 118 42 Q 124 26 110 34 Z" fill="#e0e7ff"/>

    <!-- Left Eye (Big Sparkling Anime Eye) -->
    <g class="blink-eye">
      <ellipse cx="64" cy="78" rx="8" ry="11" fill="#1e1b4b"/>
      <circle cx="67" cy="74" r="3.5" fill="#ffffff"/>
      <circle cx="62" cy="83" r="1.8" fill="#ffffff"/>
    </g>

    <!-- Right Eye (Cheerful Wink Arc) -->
    <path d="M 88 80 Q 98 68 108 80" fill="none" stroke="#1e1b4b" stroke-width="4.5" stroke-linecap="round"/>

    <!-- Sweet Pink Cheeks -->
    <ellipse cx="50" cy="92" rx="7" ry="4" fill="#f472b6" opacity="0.6"/>
    <ellipse cx="110" cy="92" rx="7" ry="4" fill="#f472b6" opacity="0.6"/>

    <!-- Cute Smiling Mouth -->
    <path d="M 75 88 Q 80 95 85 88" fill="none" stroke="#1e1b4b" stroke-width="3" stroke-linecap="round"/>
  </g>
</svg>