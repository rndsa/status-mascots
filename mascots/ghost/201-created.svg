<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <linearGradient id="ghost-head-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e0e7ff"/>
    </linearGradient>
    <filter id="ghost-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#818cf8" flood-opacity="0.25"/>
    </filter>
  </defs>
  <style>
    @keyframes jumpJoy {
      0%, 100% { transform: translateY(0) scale(1, 1); }
      30% { transform: translateY(6px) scale(1.08, 0.92); }
      55% { transform: translateY(-16px) scale(0.94, 1.06); }
      75% { transform: translateY(-2px) scale(1.02, 0.98); }
    }
    @keyframes starPulse {
      0%, 100% { transform: scale(1) rotate(0deg); }
      50% { transform: scale(1.25) rotate(45deg); }
    }
    .head-jump { animation: jumpJoy 1.8s cubic-bezier(0.28, 0.84, 0.42, 1) infinite; transform-origin: 80px 145px; }
    .star-sparkle { animation: starPulse 1.5s infinite ease-in-out; }
  </style>

  <ellipse cx="80" cy="148" rx="34" ry="6" fill="#000000" opacity="0.18"/>

  <g class="head-jump">
    <!-- Star on top of head -->
    <g class="star-sparkle" transform="translate(80, 20)">
      <polygon points="0,-10 3,-3 10,0 3,3 0,10 -3,3 -10,0 -3,-3" fill="#facc15"/>
    </g>

    <path d="M 32 80 C 32 46 54 28 80 28 C 106 28 128 46 128 80 C 128 114 116 132 100 132 C 90 132 86 124 80 124 C 74 124 70 132 60 132 C 44 132 32 114 32 80 Z" 
          fill="url(#ghost-head-grad)" stroke="#c7d2fe" stroke-width="2.5" filter="url(#ghost-glow)"/>

    <path d="M 42 42 Q 36 26 50 34 Z" fill="#e0e7ff"/>
    <path d="M 118 42 Q 124 26 110 34 Z" fill="#e0e7ff"/>

    <!-- Joyful Closed Eyes (^ ^) -->
    <path d="M 52 78 Q 62 66 72 78" fill="none" stroke="#1e1b4b" stroke-width="4.5" stroke-linecap="round"/>
    <path d="M 88 78 Q 98 66 108 78" fill="none" stroke="#1e1b4b" stroke-width="4.5" stroke-linecap="round"/>

    <!-- Happy Open Mouth :D -->
    <path d="M 73 88 Q 80 100 87 88 Z" fill="#f43f5e"/>

    <ellipse cx="50" cy="90" rx="7" ry="4" fill="#f472b6" opacity="0.6"/>
    <ellipse cx="110" cy="90" rx="7" ry="4" fill="#f472b6" opacity="0.6"/>
  </g>
</svg>