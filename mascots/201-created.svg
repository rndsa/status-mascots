<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <style>
      @keyframes popJump {
        0%, 100% { transform: translateY(0) scale(1); }
        50% { transform: translateY(-8px) scale(1.05); }
      }
      @keyframes spark {
        0%, 100% { opacity: 0.3; transform: scale(0.8); }
        50% { opacity: 1; transform: scale(1.2); }
      }
      .bot-jump { animation: popJump 1.8s ease-in-out infinite; transform-origin: center bottom; }
      .sparkle { animation: spark 1.2s ease-in-out infinite alternate; transform-origin: center; }
    </style>
  </defs>
  <!-- Confetti / Sparkles -->
  <circle class="sparkle" cx="20" cy="24" r="3" fill="#ffd043"/>
  <circle class="sparkle" cx="100" cy="26" r="3.5" fill="#3cd47b"/>
  <polygon class="sparkle" points="18,70 21,74 15,74" fill="#ff5c5c"/>
  <polygon class="sparkle" points="102,68 105,72 99,72" fill="#00f0ff"/>
  <g class="bot-jump">
    <!-- Party Hat -->
    <polygon points="60,6 48,28 72,28" fill="#ffd043"/>
    <circle cx="60" cy="6" r="3.5" fill="#ff5c5c"/>
    <!-- Helmet -->
    <rect x="24" y="28" width="72" height="66" rx="24" fill="#ffffff" stroke="#e1e4ea" stroke-width="2"/>
    <!-- Visor -->
    <rect x="30" y="36" width="60" height="42" rx="14" fill="#10131a"/>
    <!-- Star Eyes (* *) -->
    <text x="36" y="63" font-family="sans-serif" font-size="18" font-weight="bold" fill="#3cd47b">★</text>
    <text x="68" y="63" font-family="sans-serif" font-size="18" font-weight="bold" fill="#3cd47b">★</text>
    <ellipse cx="38" cy="68" rx="3.5" ry="2" fill="#ff6b8b"/>
    <ellipse cx="82" cy="68" rx="3.5" ry="2" fill="#ff6b8b"/>
  </g>
</svg>