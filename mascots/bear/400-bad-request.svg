<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <linearGradient id="bear-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#92400e"/>
    </linearGradient>
    <filter id="bear-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#78350f" flood-opacity="0.25"/>
    </filter>
  </defs>
  <style>
    @keyframes tiltBear {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(-15deg); }
    }
    @keyframes qmarkBob {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-7px) rotate(4deg); }
    }
    .head-tilt { animation: tiltBear 2.6s ease-in-out infinite; transform-origin: 80px 145px; }
    .qmark-box { animation: qmarkBob 2s ease-in-out infinite; transform-origin: 130px 30px; }
  </style>

  <ellipse cx="80" cy="148" rx="34" ry="6" fill="#000000" opacity="0.18"/>

  <g class="qmark-box">
    <ellipse cx="130" cy="30" rx="14" ry="14" fill="#141722" stroke="#d97706" stroke-width="2"/>
    <text x="130" y="38" font-family="-apple-system, sans-serif" font-size="20" font-weight="900" fill="#d97706" text-anchor="middle">?</text>
  </g>

  <g class="head-tilt">
    <circle cx="42" cy="44" r="16" fill="#b45309" stroke="#78350f" stroke-width="2"/>
    <circle cx="42" cy="44" r="9" fill="#fde68a"/>
    <circle cx="118" cy="44" r="16" fill="#b45309" stroke="#78350f" stroke-width="2"/>
    <circle cx="118" cy="44" r="9" fill="#fde68a"/>

    <rect x="28" y="44" width="104" height="88" rx="44" fill="url(#bear-grad)" stroke="#78350f" stroke-width="2.5" filter="url(#bear-glow)"/>

    <!-- Puzzled Eyes: Left spiral @, Right dot . -->
    <path d="M 60 78 A 4 4 0 1 1 56 82 A 7 7 0 1 1 65 80" fill="none" stroke="#451a03" stroke-width="2.8" stroke-linecap="round"/>
    <ellipse cx="98" cy="82" rx="6" ry="8" fill="#451a03"/>
    <circle cx="100" cy="80" r="2.2" fill="#ffffff"/>

    <ellipse cx="80" cy="98" rx="18" ry="12" fill="#fef3c7"/>
    <polygon points="80,95 73,88 87,88" fill="#451a03"/>
    <circle cx="80" cy="101" r="3.5" fill="#451a03"/>
  </g>
</svg>