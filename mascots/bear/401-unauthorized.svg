<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <linearGradient id="bear-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#92400e"/>
    </linearGradient>
    <filter id="bear-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#ef4444" flood-opacity="0.3"/>
    </filter>
  </defs>
  <style>
    @keyframes bearNoShake {
      0%, 100% { transform: rotate(0deg); }
      20% { transform: rotate(-10deg); }
      40% { transform: rotate(10deg); }
      60% { transform: rotate(-7deg); }
      80% { transform: rotate(7deg); }
    }
    .head-no { animation: bearNoShake 1.4s ease-in-out infinite; transform-origin: 80px 145px; }
  </style>

  <ellipse cx="80" cy="148" rx="34" ry="6" fill="#000000" opacity="0.18"/>

  <g class="head-no">
    <!-- Red padlock -->
    <rect x="72" y="14" width="16" height="13" rx="3" fill="#ef4444"/>
    <path d="M 75 14 L 75 9 C 75 4 85 4 85 9 L 85 14" fill="none" stroke="#ef4444" stroke-width="2.5" stroke-linecap="round"/>

    <circle cx="42" cy="44" r="16" fill="#b45309" stroke="#ef4444" stroke-width="2"/>
    <circle cx="118" cy="44" r="16" fill="#b45309" stroke="#ef4444" stroke-width="2"/>

    <rect x="28" y="44" width="104" height="88" rx="44" fill="url(#bear-grad)" stroke="#ef4444" stroke-width="2.5" filter="url(#bear-glow)"/>

    <!-- Squinting warning eyes -->
    <line x1="52" y1="78" x2="68" y2="78" stroke="#ef4444" stroke-width="3.8" stroke-linecap="round"/>
    <line x1="92" y1="78" x2="108" y2="78" stroke="#ef4444" stroke-width="3.8" stroke-linecap="round"/>

    <ellipse cx="80" cy="98" rx="18" ry="12" fill="#fef3c7"/>
    <polygon points="80,95 73,88 87,88" fill="#ef4444"/>
    <path d="M 74 100 Q 77 96 80 100 Q 83 104 86 100" fill="none" stroke="#ef4444" stroke-width="2.5" stroke-linecap="round"/>
  </g>
</svg>