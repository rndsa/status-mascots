<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <linearGradient id="bear-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
  </defs>
  <style>
    @keyframes bearFloat {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
    }
    .bear { animation: bearFloat 2.2s ease-in-out infinite; }
  </style>

  <g class="bear">
    <!-- Round Ears -->
    <circle cx="58" cy="55" r="14" fill="#78350f"/>
    <circle cx="58" cy="55" r="7" fill="#fde68a"/>
    <circle cx="102" cy="55" r="14" fill="#78350f"/>
    <circle cx="102" cy="55" r="7" fill="#fde68a"/>

    <!-- Head -->
    <circle cx="80" cy="78" r="32" fill="url(#bear-grad)"/>
    <!-- Snout -->
    <ellipse cx="80" cy="88" rx="14" ry="10" fill="#fde68a"/>
    <ellipse cx="80" cy="84" rx="6" ry="4" fill="#451a03"/>
    <path d="M 80 88 L 80 92 M 76 92 Q 80 95 84 92" fill="none" stroke="#451a03" stroke-width="1.8" stroke-linecap="round"/>

    <!-- Smiling Eyes -->
    <path d="M 68 74 Q 72 70 76 74" fill="none" stroke="#451a03" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 84 74 Q 88 70 92 74" fill="none" stroke="#451a03" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Honey Pot in paws -->
    <ellipse cx="80" cy="120" rx="18" ry="14" fill="#d97706" stroke="#b45309" stroke-width="2"/>
    <ellipse cx="80" cy="110" rx="14" ry="4" fill="#fef08a"/>
    <!-- Honey Drip -->
    <path d="M 75 110 Q 77 122 75 125 Q 73 122 75 110 Z" fill="#facc15"/>
  </g>
</svg>