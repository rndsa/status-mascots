<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <linearGradient id="bear-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
  </defs>
  <style>
    @keyframes bear-nod { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
    .kuma { animation: bear-nod 2.4s ease-in-out infinite; }
  </style>
  <g class="kuma">
    <!-- Round Ears -->
    <circle cx="52" cy="55" r="14" fill="#78350f"/>
    <circle cx="52" cy="55" r="8" fill="#fcd34d"/>
    <circle cx="108" cy="55" r="14" fill="#78350f"/>
    <circle cx="108" cy="55" r="8" fill="#fcd34d"/>
    <!-- Head -->
    <circle cx="80" cy="80" r="36" fill="url(#bear-grad)" stroke="#451a03" stroke-width="2"/>
    <!-- Snout White/Tan -->
    <ellipse cx="80" cy="90" rx="16" ry="12" fill="#fef3c7"/>
    <polygon points="80,85 75,81 85,81" fill="#451a03"/>
    <path d="M 76 89 Q 80 93 84 89" fill="none" stroke="#451a03" stroke-width="2" stroke-linecap="round"/>
    <!-- Friendly Eyes -->
    <circle cx="68" cy="74" r="4.5" fill="#ffffff"/>
    <circle cx="68" cy="74" r="2.5" fill="#451a03"/>
    <circle cx="92" cy="74" r="4.5" fill="#ffffff"/>
    <circle cx="92" cy="74" r="2.5" fill="#451a03"/>
    <!-- Blush -->
    <ellipse cx="58" cy="86" rx="5" ry="3" fill="#f43f5e" opacity="0.6"/>
    <ellipse cx="102" cy="86" rx="5" ry="3" fill="#f43f5e" opacity="0.6"/>
    <!-- Paws holding honey pot -->
    <ellipse cx="80" cy="122" rx="18" ry="14" fill="#f59e0b" stroke="#b45309" stroke-width="2"/>
    <text x="80" y="126" font-family="sans-serif" font-size="9" font-weight="bold" fill="#78350f" text-anchor="middle">HONEY</text>
  </g>
</svg>