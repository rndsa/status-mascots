<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <linearGradient id="bear-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#92400e"/>
    </linearGradient>
    <filter id="bear-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#78350f" flood-opacity="0.25"/>
    </filter>
  </defs>
  <style>
    @keyframes bearBob {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-7px) rotate(1.5deg); }
    }
    @keyframes earTwitch {
      0%, 90%, 100% { transform: rotate(0deg); }
      93% { transform: rotate(-6deg); }
      96% { transform: rotate(4deg); }
    }
    @keyframes eyeBlink {
      0%, 92%, 100% { transform: scaleY(1); }
      96% { transform: scaleY(0.1); }
    }
    .head-bear { animation: bearBob 3s ease-in-out infinite; transform-origin: 80px 145px; }
    .ear-l { animation: earTwitch 3s infinite; transform-origin: 44px 44px; }
    .blink-eye { animation: eyeBlink 3.6s infinite; transform-origin: 60px 80px; }
  </style>

  <ellipse cx="80" cy="148" rx="34" ry="6" fill="#000000" opacity="0.18"/>

  <g class="head-bear">
    <!-- Round Teddy Bear Ears -->
    <g class="ear-l">
      <circle cx="42" cy="44" r="16" fill="#b45309" stroke="#78350f" stroke-width="2"/>
      <circle cx="42" cy="44" r="9" fill="#fde68a"/>
    </g>
    <g>
      <circle cx="118" cy="44" r="16" fill="#b45309" stroke="#78350f" stroke-width="2"/>
      <circle cx="118" cy="44" r="9" fill="#fde68a"/>
    </g>

    <!-- Chibi Bear Head Base (Rounded Squircle) -->
    <rect x="28" y="44" width="104" height="88" rx="44" fill="url(#bear-grad)" stroke="#78350f" stroke-width="2.5" filter="url(#bear-glow)"/>

    <!-- Left Eye (Big Anime Pupil) -->
    <g class="blink-eye">
      <ellipse cx="60" cy="80" rx="8" ry="11" fill="#451a03"/>
      <circle cx="63" cy="76" r="3.5" fill="#ffffff"/>
      <circle cx="58" cy="85" r="1.8" fill="#ffffff"/>
    </g>

    <!-- Right Eye (Cheerful Wink Arc) -->
    <path d="M 88 82 Q 98 70 108 82" fill="none" stroke="#451a03" stroke-width="4.5" stroke-linecap="round"/>

    <!-- Cream Snout / Muzzle Area -->
    <ellipse cx="80" cy="98" rx="20" ry="14" fill="#fef3c7"/>
    <!-- Dark Brown Bear Nose -->
    <polygon points="80,95 73,88 87,88" fill="#451a03"/>
    <path d="M 80 95 L 80 101" stroke="#451a03" stroke-width="2.2" stroke-linecap="round"/>
    <!-- Cute Bear Smile -->
    <path d="M 72 101 Q 76 106 80 101 Q 84 106 88 101" fill="none" stroke="#451a03" stroke-width="2.2" stroke-linecap="round"/>

    <!-- Pink Cheeks -->
    <ellipse cx="44" cy="94" rx="7" ry="4" fill="#f43f5e" opacity="0.6"/>
    <ellipse cx="116" cy="94" rx="7" ry="4" fill="#f43f5e" opacity="0.6"/>
  </g>
</svg>