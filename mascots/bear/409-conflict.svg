<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <style>
    @keyframes bearShake {
      0% { transform: rotate(0deg); }
      20% { transform: rotate(-12deg); }
      40% { transform: rotate(10deg); }
      60% { transform: rotate(-8deg); }
      100% { transform: rotate(0deg); }
    }
    .head-kuma { animation: bearShake 0.8s ease-in-out infinite; transform-origin: 80px 110px; }
  </style>
  <g class="head-kuma">
    <circle cx="52" cy="55" r="14" fill="#78350f"/>
    <circle cx="108" cy="55" r="14" fill="#78350f"/>
    <circle cx="80" cy="80" r="36" fill="#78350f" stroke="#ef4444" stroke-width="2.5"/>
    <ellipse cx="80" cy="90" rx="16" ry="12" fill="#fee2e2"/>
    <!-- Squeezed X X Eyes (> <) -->
    <line x1="62" y1="70" x2="72" y2="78" stroke="#ef4444" stroke-width="3" stroke-linecap="round"/>
    <line x1="72" y1="70" x2="62" y2="78" stroke="#ef4444" stroke-width="3" stroke-linecap="round"/>
    <line x1="88" y1="70" x2="98" y2="78" stroke="#ef4444" stroke-width="3" stroke-linecap="round"/>
    <line x1="98" y1="70" x2="88" y2="78" stroke="#ef4444" stroke-width="3" stroke-linecap="round"/>
    <path d="M 76 92 Q 80 87 84 92" fill="none" stroke="#ef4444" stroke-width="2" stroke-linecap="round"/>
    <!-- Paws waving NO NO -->
    <circle cx="45" cy="110" r="9" fill="#991b1b"/>
    <circle cx="115" cy="110" r="9" fill="#991b1b"/>
    <path d="M 120 50 Q 125 56 120 60 Q 115 56 120 50 Z" fill="#38bdf8"/>
  </g>
</svg>