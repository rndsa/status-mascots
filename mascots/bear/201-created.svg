<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <linearGradient id="bear-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#92400e"/>
    </linearGradient>
    <filter id="bear-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#78350f" flood-opacity="0.25"/>
    </filter>
  </defs>
  <style>
    @keyframes happyJump {
      0%, 100% { transform: translateY(0) scale(1, 1); }
      30% { transform: translateY(6px) scale(1.08, 0.92); }
      55% { transform: translateY(-16px) scale(0.94, 1.06); }
      75% { transform: translateY(-2px) scale(1.02, 0.98); }
    }
    .head-jump { animation: happyJump 1.8s cubic-bezier(0.28, 0.84, 0.42, 1) infinite; transform-origin: 80px 145px; }
  </style>

  <ellipse cx="80" cy="148" rx="34" ry="6" fill="#000000" opacity="0.18"/>

  <g class="head-jump">
    <!-- Party Hat -->
    <polygon points="80,14 66,42 94,42" fill="#ec4899"/>
    <circle cx="80" cy="12" r="4.5" fill="#facc15"/>

    <circle cx="42" cy="44" r="16" fill="#b45309" stroke="#78350f" stroke-width="2"/>
    <circle cx="42" cy="44" r="9" fill="#fde68a"/>
    <circle cx="118" cy="44" r="16" fill="#b45309" stroke="#78350f" stroke-width="2"/>
    <circle cx="118" cy="44" r="9" fill="#fde68a"/>

    <rect x="28" y="44" width="104" height="88" rx="44" fill="url(#bear-grad)" stroke="#78350f" stroke-width="2.5" filter="url(#bear-glow)"/>

    <!-- Joyful Closed Eyes (^ ^) -->
    <path d="M 52 80 Q 62 68 72 80" fill="none" stroke="#451a03" stroke-width="4.5" stroke-linecap="round"/>
    <path d="M 88 80 Q 98 68 108 80" fill="none" stroke="#451a03" stroke-width="4.5" stroke-linecap="round"/>

    <ellipse cx="80" cy="98" rx="20" ry="14" fill="#fef3c7"/>
    <polygon points="80,95 73,88 87,88" fill="#451a03"/>
    <path d="M 74 98 Q 80 106 86 98 Z" fill="#f43f5e"/>

    <ellipse cx="44" cy="94" rx="7" ry="4" fill="#f43f5e" opacity="0.6"/>
    <ellipse cx="116" cy="94" rx="7" ry="4" fill="#f43f5e" opacity="0.6"/>
  </g>
</svg>