<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <linearGradient id="monkey-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a16207"/>
      <stop offset="100%" stop-color="#713f12"/>
    </linearGradient>
  </defs>
  <style>
    @keyframes workNod {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-5px); }
    }
    .head-work { animation: workNod 1.8s ease-in-out infinite; }
  </style>

  <ellipse cx="80" cy="148" rx="34" ry="6" fill="#000000" opacity="0.18"/>

  <g class="head-work">
    <circle cx="28" cy="72" r="18" fill="#854d0e" stroke="#713f12" stroke-width="2"/>
    <circle cx="132" cy="72" r="18" fill="#854d0e" stroke="#713f12" stroke-width="2"/>

    <rect x="34" y="42" width="92" height="90" rx="42" fill="url(#monkey-grad)" stroke="#713f12" stroke-width="2.5"/>

    <!-- Worker Headband (Hachimaki) with Red Sun -->
    <path d="M 34 56 Q 80 48 126 56 L 126 64 Q 80 56 34 64 Z" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
    <circle cx="80" cy="59" r="4.5" fill="#ef4444"/>

    <path d="M 44 82 C 44 60 60 54 70 62 C 76 66 80 66 84 62 C 94 54 110 60 110 82 C 110 114 96 124 77 124 C 58 124 44 114 44 82 Z" fill="#fef3c7"/>

    <!-- Confident smiling eyes (^ ^) -->
    <path d="M 54 78 Q 64 66 74 78" fill="none" stroke="#451a03" stroke-width="4.5" stroke-linecap="round"/>
    <path d="M 86 78 Q 96 66 106 78" fill="none" stroke="#451a03" stroke-width="4.5" stroke-linecap="round"/>

    <path d="M 70 98 Q 80 106 90 98" fill="none" stroke="#451a03" stroke-width="2.8" stroke-linecap="round"/>
  </g>
  <text x="80" y="146" font-family="monospace" font-size="10" font-weight="bold" fill="#eab308" text-anchor="middle">MAINTENANCE (503)</text>
</svg>