<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <linearGradient id="monkey-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a16207"/>
      <stop offset="100%" stop-color="#713f12"/>
    </linearGradient>
  </defs>
  <style>
    @keyframes monkeyFade {
      0%, 100% { opacity: 0.95; }
      50% { opacity: 0.25; }
    }
    @keyframes lookLR {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-6px); }
      75% { transform: translateX(6px); }
    }
    .head-fade { animation: monkeyFade 3s ease-in-out infinite; }
    .eyes-roam { animation: lookLR 2.6s ease-in-out infinite; }
  </style>

  <ellipse cx="80" cy="148" rx="34" ry="6" fill="#000000" opacity="0.18"/>

  <g class="head-fade">
    <!-- Detective Hat -->
    <path d="M 44 42 C 44 26 116 26 116 42 Z" fill="#78350f"/>
    <ellipse cx="80" cy="42" rx="42" ry="6" fill="#92400e"/>

    <circle cx="28" cy="72" r="18" fill="#854d0e" stroke="#713f12" stroke-width="2"/>
    <circle cx="132" cy="72" r="18" fill="#854d0e" stroke="#713f12" stroke-width="2"/>

    <rect x="34" y="42" width="92" height="90" rx="42" fill="url(#monkey-grad)" stroke="#713f12" stroke-width="2.5"/>

    <path d="M 44 82 C 44 60 60 54 70 62 C 76 66 80 66 84 62 C 94 54 110 60 110 82 C 110 114 96 124 77 124 C 58 124 44 114 44 82 Z" fill="#fef3c7"/>

    <!-- Roaming eyes -->
    <g class="eyes-roam">
      <ellipse cx="62" cy="78" rx="7" ry="9" fill="#451a03"/>
      <circle cx="64" cy="75" r="2.5" fill="#ffffff"/>

      <ellipse cx="98" cy="78" rx="7" ry="9" fill="#451a03"/>
      <circle cx="100" cy="75" r="2.5" fill="#ffffff"/>
    </g>

    <ellipse cx="80" cy="100" rx="3.5" ry="4.5" fill="#451a03"/>
  </g>
  <text x="80" y="146" font-family="monospace" font-size="10" font-weight="bold" fill="#64748b" text-anchor="middle">SEARCHING (404)</text>
</svg>