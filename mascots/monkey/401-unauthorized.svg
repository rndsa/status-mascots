<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <linearGradient id="monkey-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a16207"/>
      <stop offset="100%" stop-color="#713f12"/>
    </linearGradient>
    <filter id="monkey-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#ef4444" flood-opacity="0.3"/>
    </filter>
  </defs>
  <style>
    @keyframes monkeyNoShake {
      0%, 100% { transform: rotate(0deg); }
      20% { transform: rotate(-10deg); }
      40% { transform: rotate(10deg); }
      60% { transform: rotate(-7deg); }
      80% { transform: rotate(7deg); }
    }
    .head-no { animation: monkeyNoShake 1.4s ease-in-out infinite; transform-origin: 80px 145px; }
  </style>

  <ellipse cx="80" cy="148" rx="34" ry="6" fill="#000000" opacity="0.18"/>

  <g class="head-no">
    <!-- Red padlock -->
    <rect x="72" y="14" width="16" height="13" rx="3" fill="#ef4444"/>
    <path d="M 75 14 L 75 9 C 75 4 85 4 85 9 L 85 14" fill="none" stroke="#ef4444" stroke-width="2.5" stroke-linecap="round"/>

    <circle cx="28" cy="72" r="18" fill="#854d0e" stroke="#ef4444" stroke-width="2"/>
    <circle cx="132" cy="72" r="18" fill="#854d0e" stroke="#ef4444" stroke-width="2"/>

    <rect x="34" y="42" width="92" height="90" rx="42" fill="url(#monkey-grad)" stroke="#ef4444" stroke-width="2.5" filter="url(#monkey-glow)"/>

    <path d="M 44 82 C 44 60 60 54 70 62 C 76 66 80 66 84 62 C 94 54 110 60 110 82 C 110 114 96 124 77 124 C 58 124 44 114 44 82 Z" fill="#fef3c7"/>

    <!-- Squinting warning eyes -->
    <line x1="52" y1="78" x2="68" y2="78" stroke="#ef4444" stroke-width="3.8" stroke-linecap="round"/>
    <line x1="92" y1="78" x2="108" y2="78" stroke="#ef4444" stroke-width="3.8" stroke-linecap="round"/>

    <path d="M 70 100 Q 75 96 80 100 Q 85 104 90 100" fill="none" stroke="#ef4444" stroke-width="2.5" stroke-linecap="round"/>
  </g>
</svg>