<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <linearGradient id="chimp-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#9a3412"/>
      <stop offset="100%" stop-color="#7c2d12"/>
    </linearGradient>
  </defs>
  <style>
    @keyframes chimp-cheer { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-7px) rotate(2deg); } }
    .chimp { animation: chimp-cheer 2s ease-in-out infinite; }
  </style>
  <g class="chimp">
    <!-- Big Round Ears -->
    <circle cx="48" cy="75" r="14" fill="#fed7aa" stroke="#9a3412" stroke-width="3"/>
    <circle cx="112" cy="75" r="14" fill="#fed7aa" stroke="#9a3412" stroke-width="3"/>
    <!-- Head -->
    <circle cx="80" cy="75" r="32" fill="url(#chimp-grad)"/>
    <!-- Face mask Tan -->
    <path d="M 60 70 C 60 58 75 58 80 66 C 85 58 100 58 100 70 C 100 85 85 92 80 92 C 75 92 60 85 60 70 Z" fill="#fed7aa"/>
    <!-- Big Friendly Eyes -->
    <circle cx="72" cy="70" r="4" fill="#431407"/>
    <circle cx="73" cy="68" r="1.5" fill="#ffffff"/>
    <circle cx="88" cy="70" r="4" fill="#431407"/>
    <circle cx="89" cy="68" r="1.5" fill="#ffffff"/>
    <!-- Happy Smile -->
    <path d="M 74 82 Q 80 87 86 82" fill="none" stroke="#431407" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Yellow Banana in hand -->
    <path d="M 105 105 Q 125 100 120 85" fill="none" stroke="#facc15" stroke-width="7" stroke-linecap="round"/>
  </g>
</svg>