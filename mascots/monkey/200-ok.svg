<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <linearGradient id="monkey-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a16207"/>
      <stop offset="100%" stop-color="#713f12"/>
    </linearGradient>
  </defs>
  <style>
    @keyframes typingHands {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-3px); }
    }
    .type-arm { animation: typingHands 0.25s infinite ease-in-out; }
  </style>

  <!-- Monkey Ears -->
  <circle cx="50" cy="65" r="14" fill="#a16207"/>
  <circle cx="50" cy="65" r="8" fill="#fef08a"/>
  <circle cx="110" cy="65" r="14" fill="#a16207"/>
  <circle cx="110" cy="65" r="8" fill="#fef08a"/>

  <!-- Head -->
  <circle cx="80" cy="68" r="28" fill="url(#monkey-grad)"/>
  <ellipse cx="80" cy="74" rx="20" ry="15" fill="#fef08a"/>
  <circle cx="72" cy="70" r="3.5" fill="#451a03"/>
  <circle cx="88" cy="70" r="3.5" fill="#451a03"/>
  <path d="M 74 78 Q 80 84 86 78" fill="none" stroke="#451a03" stroke-width="2" stroke-linecap="round"/>

  <!-- Laptop on Desk -->
  <polygon points="50,118 110,118 100,105 60,105" fill="#64748b"/>
  <rect x="58" y="85" width="44" height="22" rx="3" fill="#0f172a" stroke="#475569" stroke-width="2"/>
  <rect x="62" y="88" width="36" height="15" fill="#22c55e" opacity="0.8"/>
  <text x="80" y="99" font-family="monospace" font-size="8" font-weight="bold" fill="#052e16" text-anchor="middle">200 OK</text>

  <!-- Typing Paws -->
  <circle cx="68" cy="110" r="5" fill="#a16207" class="type-arm"/>
  <circle cx="92" cy="110" r="5" fill="#a16207" class="type-arm"/>
</svg>