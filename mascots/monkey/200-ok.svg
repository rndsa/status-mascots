<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <linearGradient id="monkey-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a16207"/>
      <stop offset="100%" stop-color="#713f12"/>
    </linearGradient>
    <filter id="monkey-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#713f12" flood-opacity="0.25"/>
    </filter>
  </defs>
  <style>
    @keyframes monkeyBob {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-7px) rotate(1.5deg); }
    }
    @keyframes earWiggleL {
      0%, 90%, 100% { transform: rotate(0deg); }
      93% { transform: rotate(-8deg); }
      96% { transform: rotate(5deg); }
    }
    @keyframes eyeBlink {
      0%, 92%, 100% { transform: scaleY(1); }
      96% { transform: scaleY(0.1); }
    }
    .head-monkey { animation: monkeyBob 3s ease-in-out infinite; transform-origin: 80px 145px; }
    .ear-l { animation: earWiggleL 3s infinite; transform-origin: 28px 70px; }
    .blink-eye { animation: eyeBlink 3.6s infinite; transform-origin: 62px 82px; }
  </style>

  <ellipse cx="80" cy="148" rx="34" ry="6" fill="#000000" opacity="0.18"/>

  <g class="head-monkey">
    <!-- Big Round Monkey Ears on sides -->
    <g class="ear-l">
      <circle cx="28" cy="72" r="18" fill="#854d0e" stroke="#713f12" stroke-width="2"/>
      <circle cx="28" cy="72" r="10" fill="#fde68a"/>
    </g>
    <g>
      <circle cx="132" cy="72" r="18" fill="#854d0e" stroke="#713f12" stroke-width="2"/>
      <circle cx="132" cy="72" r="10" fill="#fde68a"/>
    </g>

    <!-- Brown Head Base -->
    <rect x="34" y="42" width="92" height="90" rx="42" fill="url(#monkey-grad)" stroke="#713f12" stroke-width="2.5" filter="url(#monkey-glow)"/>

    <!-- Tan/Cream Face Mask (Heart-shape top, rounded bottom) -->
    <path d="M 44 82 C 44 60 60 54 70 62 C 76 66 80 66 84 62 C 94 54 110 60 110 82 C 110 114 96 124 77 124 C 58 124 44 114 44 82 Z" fill="#fef3c7"/>

    <!-- Left Eye (Big Anime Pupil) -->
    <g class="blink-eye">
      <ellipse cx="62" cy="78" rx="8" ry="11" fill="#451a03"/>
      <circle cx="65" cy="74" r="3.5" fill="#ffffff"/>
      <circle cx="60" cy="83" r="1.8" fill="#ffffff"/>
    </g>

    <!-- Right Eye (Cheerful Wink Arc) -->
    <path d="M 86 80 Q 96 68 106 80" fill="none" stroke="#451a03" stroke-width="4.5" stroke-linecap="round"/>

    <!-- Cute Nostrils -->
    <circle cx="76" cy="94" r="1.5" fill="#78350f"/>
    <circle cx="84" cy="94" r="1.5" fill="#78350f"/>

    <!-- Cheeky Smiling Mouth -->
    <path d="M 68 100 Q 80 110 92 100" fill="none" stroke="#451a03" stroke-width="2.8" stroke-linecap="round"/>

    <!-- Pink Cheeks -->
    <ellipse cx="48" cy="92" rx="6" ry="3.5" fill="#f43f5e" opacity="0.6"/>
    <ellipse cx="106" cy="92" rx="6" ry="3.5" fill="#f43f5e" opacity="0.6"/>
  </g>
</svg>