<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <linearGradient id="monkey-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a16207"/>
      <stop offset="100%" stop-color="#713f12"/>
    </linearGradient>
    <filter id="monkey-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#713f12" flood-opacity="0.25"/>
    </filter>
  </defs>
  <style>
    @keyframes happyJump {
      0%, 100% { transform: translateY(0) scale(1, 1); }
      30% { transform: translateY(6px) scale(1.08, 0.92); }
      55% { transform: translateY(-16px) scale(0.94, 1.06); }
      75% { transform: translateY(-2px) scale(1.02, 0.98); }
    }
    .head-jump { animation: happyJump 1.8s cubic-bezier(0.28, 0.84, 0.42, 1) infinite; transform-origin: 80px 145px; }
  </style>

  <ellipse cx="80" cy="148" rx="34" ry="6" fill="#000000" opacity="0.18"/>

  <g class="head-jump">
    <!-- Party Hat -->
    <polygon points="80,14 66,40 94,40" fill="#ec4899"/>
    <circle cx="80" cy="12" r="4.5" fill="#facc15"/>

    <circle cx="28" cy="72" r="18" fill="#854d0e" stroke="#713f12" stroke-width="2"/>
    <circle cx="28" cy="72" r="10" fill="#fde68a"/>
    <circle cx="132" cy="72" r="18" fill="#854d0e" stroke="#713f12" stroke-width="2"/>
    <circle cx="132" cy="72" r="10" fill="#fde68a"/>

    <rect x="34" y="42" width="92" height="90" rx="42" fill="url(#monkey-grad)" stroke="#713f12" stroke-width="2.5" filter="url(#monkey-glow)"/>

    <path d="M 44 82 C 44 60 60 54 70 62 C 76 66 80 66 84 62 C 94 54 110 60 110 82 C 110 114 96 124 77 124 C 58 124 44 114 44 82 Z" fill="#fef3c7"/>

    <!-- Joyful Closed Eyes (^ ^) -->
    <path d="M 54 78 Q 64 66 74 78" fill="none" stroke="#451a03" stroke-width="4.5" stroke-linecap="round"/>
    <path d="M 86 78 Q 96 66 106 78" fill="none" stroke="#451a03" stroke-width="4.5" stroke-linecap="round"/>

    <!-- Happy Open Mouth -->
    <path d="M 72 98 Q 80 108 88 98 Z" fill="#f43f5e"/>

    <ellipse cx="48" cy="92" rx="6" ry="3.5" fill="#f43f5e" opacity="0.6"/>
    <ellipse cx="106" cy="92" rx="6" ry="3.5" fill="#f43f5e" opacity="0.6"/>
  </g>
</svg>