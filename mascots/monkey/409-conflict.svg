<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <style>
    @keyframes hearNoEvil {
      0% { transform: rotate(0deg); }
      20% { transform: rotate(-12deg); }
      40% { transform: rotate(10deg); }
      60% { transform: rotate(-8deg); }
      100% { transform: rotate(0deg); }
    }
    .chimp-shake { animation: hearNoEvil 0.8s ease-in-out infinite; transform-origin: 80px 85px; }
  </style>
  <g class="chimp-shake">
    <circle cx="48" cy="75" r="14" fill="#fed7aa" stroke="#9a3412" stroke-width="3"/>
    <circle cx="112" cy="75" r="14" fill="#fed7aa" stroke="#9a3412" stroke-width="3"/>
    <circle cx="80" cy="75" r="32" fill="#7c2d12" stroke="#ef4444" stroke-width="2.5"/>
    <path d="M 60 70 C 60 58 75 58 80 66 C 85 58 100 58 100 70 C 100 85 85 92 80 92 C 75 92 60 85 60 70 Z" fill="#fee2e2"/>
    <!-- Squeezed Eyes (> <) -->
    <line x1="66" y1="66" x2="76" y2="74" stroke="#ef4444" stroke-width="3" stroke-linecap="round"/>
    <line x1="76" y1="66" x2="66" y2="74" stroke="#ef4444" stroke-width="3" stroke-linecap="round"/>
    <line x1="84" y1="66" x2="94" y2="74" stroke="#ef4444" stroke-width="3" stroke-linecap="round"/>
    <line x1="94" y1="66" x2="84" y2="74" stroke="#ef4444" stroke-width="3" stroke-linecap="round"/>
    <!-- Hands covering ears NO NO -->
    <ellipse cx="46" cy="75" rx="10" ry="14" fill="#fed7aa" stroke="#ef4444" stroke-width="2"/>
    <ellipse cx="114" cy="75" rx="10" ry="14" fill="#fed7aa" stroke="#ef4444" stroke-width="2"/>
    <path d="M 120 50 Q 125 56 120 60 Q 115 56 120 50 Z" fill="#38bdf8"/>
  </g>
</svg>