<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <linearGradient id="monkey-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a16207"/>
      <stop offset="100%" stop-color="#713f12"/>
    </linearGradient>
    <filter id="monkey-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#ef4444" flood-opacity="0.3"/>
    </filter>
  </defs>
  <style>
    @keyframes shockMonkey {
      0%, 100% { transform: rotate(0deg); }
      15% { transform: rotate(-8deg); }
      30% { transform: rotate(8deg); }
      45% { transform: rotate(-6deg); }
      60% { transform: rotate(5deg); }
      75% { transform: rotate(-3deg); }
    }
    @keyframes sweatFall {
      0% { transform: translateY(0); opacity: 0; }
      50% { opacity: 1; }
      100% { transform: translateY(18px); opacity: 0; }
    }
    .head-shock { animation: shockMonkey 0.75s ease-in-out infinite; transform-origin: 80px 145px; }
    .sweat-drop { animation: sweatFall 1.2s infinite; }
  </style>

  <ellipse cx="80" cy="148" rx="34" ry="6" fill="#000000" opacity="0.18"/>

  <g class="head-shock">
    <circle cx="28" cy="72" r="18" fill="#854d0e" stroke="#ef4444" stroke-width="2"/>
    <circle cx="132" cy="72" r="18" fill="#854d0e" stroke="#ef4444" stroke-width="2"/>

    <rect x="34" y="42" width="92" height="90" rx="42" fill="url(#monkey-grad)" stroke="#ef4444" stroke-width="2.5" filter="url(#monkey-glow)"/>

    <path d="M 44 82 C 44 60 60 54 70 62 C 76 66 80 66 84 62 C 94 54 110 60 110 82 C 110 114 96 124 77 124 C 58 124 44 114 44 82 Z" fill="#fef3c7"/>

    <!-- Squeezed X Eyes (> <) -->
    <path d="M 54 74 L 64 82 L 54 90" fill="none" stroke="#ef4444" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 106 74 L 96 82 L 106 90" fill="none" stroke="#ef4444" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>

    <path d="M 72 100 Q 76 95 80 100 Q 84 105 88 100" fill="none" stroke="#ef4444" stroke-width="2.5" stroke-linecap="round"/>

    <g class="sweat-drop" transform="translate(122, 60)">
      <path d="M 0 -8 Q 6 0 0 5 Q -6 0 0 -8 Z" fill="#38bdf8"/>
    </g>
  </g>
</svg>